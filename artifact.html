  /* ---------- exports: shared bits ---------- */
  const csvHead = () => [t('rep.colDate'), t('inv.category'), t('rep.item'), t('count.expected'), t('count.counted'), t('dash.variance'), t('count.note')];
  const csvLine = (c, l) => [c.bd, catOf(l), nameOf(l), fq(l.expected), fq(l.counted), fq(l.variance), noteOf(l)];
  const thRow = cols => `<tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>`;
  const pdfVarTable = lines => `<table>${thRow([t('inv.category'), t('rep.item'), t('count.expected'), t('count.counted'), t('dash.variance'), t('count.note')])}
    ${lines.map(l => `<tr><td>${esc(catOf(l))}</td><td>${esc(nameOf(l))}</td><td>${esc(fq(l.expected))}</td><td>${esc(fq(l.counted))}</td><td class="${pcls(l.variance)}">${esc(sgn(l.variance))}</td><td>${esc(l.note || '')}</td></tr>`).join('')}</table>`;
  const pdfKpis = (sold, rest, waste, vt, loss) => `<div class="kpis">
    <div><b>${esc(fq(sold))}</b><span>${esc(t('rep.soldLbl'))}</span></div>
    <div><b>${esc(fq(rest))}</b><span>${esc(t('rep.restocked'))}</span></div>
    <div><b>${esc(fq(waste))}</b><span>${esc(t('rep.wasted'))}</span></div>
    <div><b class="${pcls(vt)}">${esc(sgn(vt))}</b><span>${esc(t('count.varTotal'))}</span></div>
    ${loss != null ? `<div><b class="${loss > 0 ? 'neg' : ''}">${esc(UI.money(loss))}</b><span>${esc(t('rep.lossValue'))}</span></div>` : ''}
  </div>`;

  function exportCsvRange(from, to) {
    const cs = rangeCounts(from, to);
    if (!cs.length) return UI.toast(t('rep.rangeEmpty'), { type: 'danger' });
    const rows = [csvHead()];
    for (const c of cs) for (const l of [...c.lines].sort(bySort)) rows.push(csvLine(c, l));
    UI.csv(rows, `${slug(t('rep.title'))}-${from}_${to}.csv`);
    UI.haptic('success');
  }

  function exportPdfRange(from, to) {
    const cs = rangeCounts(from, to);
    if (!cs.length) return UI.toast(t('rep.rangeEmpty'), { type: 'danger' });
    let sold = 0, rest = 0, waste = 0, vt = 0, loss = 0;
    for (const c of cs) {
      sold += sumBd(S().sales, c.bd, true); rest += sumBd(S().restocks, c.bd);
      waste += sumBd(S().waste, c.bd); vt += varTotal(c); loss += lossValue(c);
    }
    let body = pdfKpis(r2(sold), r2(rest), r2(waste), r2(vt), hasCosts() ? r2(loss) : null);
    for (const c of cs) {
      const dSold = sumBd(S().sales, c.bd, true), dWaste = sumBd(S().waste, c.bd), dVt = varTotal(c);
      body += `<h2>${esc(longDate(c.bd))}</h2>
        <div class="sub">${esc(I18N.plural('rep.sold', dSold, { n: fq(dSold) }))} · ${esc(t('rep.wasted'))} : ${esc(fq(dWaste))} · ${esc(t('count.varTotal'))} : ${esc(sgn(dVt))}</div>`;
      const v = varLinesOf(c);
      body += v.length ? pdfVarTable(v) : `<p style="color:#1E8E5A;margin:6px 0 16px">${esc(t('count.clean'))} — ${esc(t('count.cleanSub'))}</p>`;
    }
    UI.printHTML(`${t('rep.title')} — ${UI.fmtDate(from)} → ${UI.fmtDate(to)}`, body);
    UI.haptic('success');
  }

  function exportCsvDay(c) {
    const rows = [csvHead()];
    for (const l of [...c.lines].sort(bySort)) rows.push(csvLine(c, l));
    UI.csv(rows, `${slug(t('rep.day', { date: c.bd }))}.csv`);
    UI.haptic('success');
  }

  function exportPdfDay(c) {
    const bd = c.bd;
    const sold = sumBd(S().sales, bd, true), rest = sumBd(S().restocks, bd), waste = sumBd(S().waste, bd);
    let body = pdfKpis(sold, rest, waste, varTotal(c), hasCosts() ? lossValue(c) : null);
    const v = varLinesOf(c);
    body += `<h2>${esc(t('rep.countRep'))}</h2>`;
    body += v.length ? pdfVarTable(v) : `<p style="color:#1E8E5A;margin:6px 0 16px">${esc(t('count.clean'))} — ${esc(t('count.cleanSub'))}</p>`;
    const daySales = S().sales.filter(s => s.bd === bd).sort((a, b) => a.at < b.at ? -1 : 1);
    body += `<h2>${esc(t('rep.sales'))}</h2>`;
    body += daySales.length
      ? `<table>${thRow([t('rep.time'), t('rep.qty'), t('rep.item'), t('rep.who')])}
          ${daySales.map(s => `<tr><td>${esc(UI.fmtTime(s.at))}</td><td>${esc(fq(s.qty))}</td><td>${esc(Store.item(s.itemId)?.name || '?')}${s.voidedAt ? ` <span class="neg">(${esc(t('rep.voidedTag'))})</span>` : ''}</td><td>${esc(s.by)}</td></tr>`).join('')}</table>`
      : `<p>${esc(t('rep.noSales'))}</p>`;
    const dayWaste = S().waste.filter(w => w.bd === bd).sort((a, b) => a.at < b.at ? -1 : 1);
    if (dayWaste.length) {
      body += `<h2>${esc(t('rep.waste'))}</h2>
        <table>${thRow([t('rep.time'), t('rep.qty'), t('rep.item'), t('waste.reason'), t('rep.who')])}
        ${dayWaste.map(w => `<tr><td>${esc(UI.fmtTime(w.at))}</td><td class="neg">${esc('−' + fq(w.qty))}</td><td>${esc(Store.item(w.itemId)?.name || '?')}</td><td>${esc(w.reason || '')}</td><td>${esc(w.by)}</td></tr>`).join('')}</table>`;
    }
    UI.printHTML(t('rep.day', { date: longDate(bd) }), body);
    UI.haptic('success');
  }

  /* ---------- export range sheet ---------- */
  function rangeSheet() {
    const days = Store.closedCounts();
    if (!days.length) return;
    const min = days[days.length - 1].bd, max = days[0].bd;
    const defFrom = days[Math.min(days.length - 1, 6)].bd;
    const from = range.from || defFrom, to = range.to || max;
    const c = UI.el(`<div>
      <div class="micro" style="margin-bottom:16px">${esc(t('rep.export'))} — ${esc(t('rep.exportRange'))}</div>
      <div style="display:flex;gap:12px">
        <div class="field" style="flex:1"><label>${esc(t('rep.from'))}</label><input type="date" data-r="from" value="${from}" min="${min}" max="${max}"></div>
        <div class="field" style="flex:1"><label>${esc(t('rep.to'))}</label><input type="date" data-r="to" value="${to}" min="${min}" max="${max}"></div>
      </div>
      <div style="display:flex;gap:12px;margin-top:8px">
        <button class="btn btn--ghost" style="flex:1" data-a="csv">${esc(t('rep.exportCsv'))}</button>
        <button class="btn btn--gold" style="flex:1" data-a="pdf">${esc(t('rep.exportPdf'))}</button>
      </div>
    </div>`);
    const sh = UI.sheet(c);
    const getRange = () => {
      let f = c.querySelector('[data-r=from]').value || defFrom;
      let x = c.querySelector('[data-r=to]').value || max;
      if (f > x) { const y = f; f = x; x = y; }
      return [f, x];
    };
    c.addEventListener('change', e => {
      const r = e.target.closest('[data-r]');
      if (r) range[r.dataset.r] = r.value;
    });
    c.addEventListener('click', e => {
      const isCsv = e.target.closest('[data-a=csv]'), isPdf = e.target.closest('[data-a=pdf]');
      if (!isCsv && !isPdf) return;
      const [f, x] = getRange();
      if (isCsv) exportCsvRange(f, x); else exportPdfRange(f, x);
      if (rangeCounts(f, x).length) sh.close();
    });
  }

  /* ---------- list mode (root tab) ---------- */
  function dayRow(c) {
    const sold = sumBd(S().sales, c.bd, true);
    const vt = varTotal(c);
    const nVar = c.lines.filter(l => l.variance !== 0).length;
    /* any nonzero line ⇒ danger-colored discrepancy count — a day never looks clean by netting out */
    const vHtml = nVar === 0
      ? `<span class="d faint tnum">${esc(sgn(0))}</span>`
      : `<span class="d ${vt < 0 ? 'bad' : vt > 0 ? 'good' : 'bad'} tnum">${esc(sgn(vt))}</span>
         <span class="rep-nvar tnum">${esc(I18N.plural('rep.varN', nVar, { n: nVar }))}</span>`;
    return `<button class="rep-drow" data-day="${esc(c.bd)}">
      <span class="rep-dd">${esc(longDate(c.bd))}</span>
      <span class="r v2 tnum">${esc(fq(sold))}</span>
      <span class="rep-dvar">${vHtml}</span>
    </button>`;
  }

  function renderList(el) {
    const days = Store.closedCounts();
    const open = S().counts.find(c => c.status === 'open');
    let html = `
      <div class="topbar">
        ${UI.logoMark(26)}
        <div class="micro tnum">${esc(UI.fmtDate(Store.todayBd()))}</div>
      </div>
      <div class="h1">${esc(t('tab.reports'))}</div>`;
    if (open) {
      html += `<div class="row rep-open">
        <span class="livedot"></span>
        <span class="row__body">
          <span class="row__t">${esc(t('rep.openDay'))} · <span class="num">${esc(UI.fmtDate(open.bd))}</span></span>
          <span class="row__s">${esc(t('rep.openHint'))}</span>
        </span>
        <span class="row__end"><button class="textbtn rep-cont" data-a="count">${esc(t('g.continue'))}</button></span>
      </div>`;
    }
    html += `<button class="grouprow${open ? '' : ' mt4'}" data-a="insights">
      <span class="micro">${esc(t('ins.title'))}</span><span class="chev">›</span>
    </button>`;
    if (!days.length) {
      html += `<div class="empty grow">
        <div class="empty__t">${esc(t('rep.noDays'))}</div>
        <div class="empty__s">${esc(t('rep.noDaysSub'))}</div>
      </div>`;
    } else {
      html += `<div class="sec"><div class="micro">${esc(t('rep.days'))}</div><div class="micro tnum">${days.length}</div></div>
        <div class="thead rep-th3"><div>${esc(t('rep.colDate'))}</div><div class="r">${esc(t('rep.kSold'))}</div><div class="r">${esc(t('count.ecart'))}</div></div>
        ${days.map(dayRow).join('')}
        <div class="bottomstack">
          <button class="textbtn" data-a="range">${esc(t('rep.exportRangeBtn'))}</button>
        </div>`;
    }
    el.innerHTML = html;
    el.addEventListener('click', e => {
      if (e.target.closest('[data-a=count]')) { UI.haptic('light'); return UI.go('count'); }
      if (e.target.closest('[data-a=insights]')) { UI.haptic('light'); return UI.go('insights', { from: 'reports' }); }
      const d = e.target.closest('[data-day]');
      if (d) { UI.haptic('light'); return UI.go('reports', { day: d.dataset.day }); }
      if (e.target.closest('[data-a=range]')) return rangeSheet();
    });
  }

  /* ---------- day mode ---------- */
  function countRow(l) {
    const note = noteOf(l);
    return `<div class="trow">
      <div class="tname"><span class="feedtick" style="background:${tickOf(l.itemId)}"></span><span>${esc(nameOf(l))}</span></div>
      <div class="r v1 tnum">${esc(fq(l.expected))}</div>
      <div class="r v2 tnum">${esc(fq(l.counted))}</div>
      <div class="r d tnum ${dcls(l.variance)}">${esc(sgn(l.variance))}</div>
    </div>${note ? `<div class="noterow">↳ ${esc(t('count.notePrefix'))} · ${esc(note)}</div>` : ''}`;
  }
  function saleRow(s) {
    const it = Store.item(s.itemId);
    return `<div class="row ${s.voidedAt ? 'rep-void' : ''}">
      <span class="feedtick" style="background:${tickOf(s.itemId)}"></span>
      <span class="row__body">
        <span class="row__t">${esc(it?.name || '?')}<span class="qtybubble">×${esc(fq(s.qty))}</span></span>
      </span>
      <span class="rep-meta">
        <span class="rep-time">${esc(UI.fmtTime(s.at))}</span>
        <span class="rep-by">${esc(s.by)}</span>
      </span>
      ${s.voidedAt
        ? `<span class="rep-tag">${esc(t('rep.voidedTag'))}</span>`
        : `<button class="rep-cancel" data-void="${esc(s.id)}" aria-label="${esc(t('rep.void'))}">${esc(t('rep.voidBtn'))}</button>`}
    </div>`;
  }
  function restockRow(r) {
    const it = Store.item(r.itemId);
    return `<div class="row">
      <span class="feedtick" style="background:${tickOf(r.itemId)}"></span>
      <span class="row__body">
        <span class="row__t">${esc(it?.name || '?')}<span class="qtybubble varpos">+${esc(fq(r.qty))}</span></span>
      </span>
      <span class="rep-meta">
        <span class="rep-time">${esc(UI.fmtTime(r.at))}</span>
        <span class="rep-by">${esc(r.by)}</span>
      </span>
    </div>`;
  }
  function wasteRow(w) {
    const it = Store.item(w.itemId);
    return `<div class="row">
      <span class="feedtick" style="background:${tickOf(w.itemId)}"></span>
      <span class="row__body">
        <span class="row__t">${esc(it?.name || '?')}<span class="qtybubble varneg">−${esc(fq(w.qty))}</span></span>
        ${w.reason ? `<span class="row__s">${esc(w.reason)}</span>` : ''}
      </span>
      <span class="rep-meta">
        <span class="rep-time">${esc(UI.fmtTime(w.at))}</span>
        <span class="rep-by">${esc(w.by)}</span>
      </span>
    </div>`;
  }

  function renderDay(el, bd) {
    if (lastDay !== bd) { lastDay = bd; cleanOpen = false; }
    const c = Store.closedCounts().find(x => x.bd === bd);
    if (!c) {
      el.innerHTML = `
        <div class="topbar">
          <button class="back" data-a="back">‹ ${esc(t('tab.reports'))}</button>
          <div class="micro tnum">${esc(UI.fmtDate(bd))}</div>
        </div>
        <div class="empty grow">
          <div class="empty__t">${esc(t('rep.notFound'))}</div>
          <div class="empty__s">${esc(t('rep.notFoundSub'))}</div>
          <button class="btn btn--ghost mt3" data-a="back">${esc(t('g.back'))}</button>
        </div>`;
      el.addEventListener('click', e => {
        if (e.target.closest('[data-a=back]')) { UI.haptic('light'); UI.go('reports'); }
      });
      return;
    }
    const st = S();
    const sold = sumBd(st.sales, bd, true), rest = sumBd(st.restocks, bd), waste = sumBd(st.waste, bd);
    const vt = varTotal(c), loss = lossValue(c), costs = hasCosts();
    const varLines = varLinesOf(c);
    const cleanLines = c.lines.filter(l => l.variance === 0).sort(bySort);
    const daySales = st.sales.filter(s => s.bd === bd).sort((a, b) => a.at < b.at ? -1 : 1);
    const dayRest = st.restocks.filter(r => r.bd === bd).sort((a, b) => a.at < b.at ? -1 : 1);
    const dayWaste = st.waste.filter(w => w.bd === bd).sort((a, b) => a.at < b.at ? -1 : 1);

    let html = `
      <div class="topbar">
        <button class="back" data-a="back">‹ ${esc(t('tab.reports'))}</button>
        <div class="micro tnum">${esc(UI.fmtDate(bd))}</div>
      </div>
      <div class="h1">${esc(longDate(bd))}</div>
      ${c.closedAt ? `<div class="sub2">${esc(t('rep.closedBy', { name: c.closedBy || '', time: UI.fmtTime(c.closedAt) }))}</div>` : ''}
      <div class="sum">
        <div class="sumcol"><div class="micro">${esc(t('rep.kSold'))}</div><div class="mid tnum">${esc(fq(sold))}</div></div>
        <div class="sumcol"><div class="micro">${esc(t('rep.kRest'))}</div><div class="mid tnum">${esc(fq(rest))}</div></div>
        <div class="sumcol"><div class="micro">${esc(t('count.ecart'))}</div><div class="mid tnum ${dcls(vt)}">${esc(sgn(vt))}</div></div>
      </div>
      <div class="sub2"><span class="num">${esc(fq(waste))}</span> ${esc(t('rep.wasted'))}${costs ? ` · ${esc(t('rep.lossValue'))} <span class="num ${loss > 0 ? 'bad' : ''}">${esc(UI.money(loss))}</span>` : ''}</div>`;

    /* 1 — count & variance: reference frame 03 table, variance first */
    html += `<div class="sec"><div class="micro">${esc(t('rep.countRep'))}</div>
      ${varLines.length ? `<div class="micro tnum" style="color:var(--bad)">${varLines.length}</div>` : ''}</div>`;
    if (c.lines.length) {
      html += `<div class="thead"><div>${esc(t('count.article'))}</div><div class="r">${esc(t('count.att'))}</div><div class="r">${esc(t('count.cpt'))}</div><div class="r">${esc(t('count.ecart'))}</div></div>`;
      html += varLines.map(countRow).join('');
      if (!varLines.length) {
        html += `<div class="rep-okline">${UI.icon('check')}
          <span class="row__body"><span class="row__t">${esc(t('count.clean'))}</span><span class="row__s">${esc(t('count.cleanSub'))}</span></span>
        </div>`;
      }
      if (cleanLines.length) {
        html += `<button class="grouprow" data-a="clean" aria-expanded="${cleanOpen}">
          <span class="micro">${esc(I18N.plural('count.noVar', cleanLines.length))}</span>
          <span class="chev" data-chev>${cleanOpen ? '⌄' : '›'}</span>
        </button>
        <div class="rep-cl ${cleanOpen ? '' : 'hidden'}">${cleanLines.map(countRow).join('')}</div>`;
      }
    } else {
      html += `<div class="sub2">${esc(t('ins.noData'))}</div>`;
    }

    /* 2 — sales */
    html += `<div class="sec"><div class="micro">${esc(t('rep.sales'))}</div><div class="micro tnum">${daySales.length}</div></div>`;
    html += daySales.length ? `<div class="feed">${daySales.map(saleRow).join('')}</div>` : `<div class="sub2">${esc(t('rep.noSales'))}</div>`;

    /* 3 — restocks */
    html += `<div class="sec"><div class="micro">${esc(t('rep.restocks'))}</div><div class="micro tnum">${dayRest.length}</div></div>`;
    html += dayRest.length ? `<div class="feed">${dayRest.map(restockRow).join('')}</div>` : `<div class="sub2">${esc(t('rep.noRestocks'))}</div>`;

    /* 4 — waste (with reasons) */
    html += `<div class="sec"><div class="micro">${esc(t('rep.waste'))}</div><div class="micro tnum">${dayWaste.length}</div></div>`;
    html += dayWaste.length ? `<div class="feed">${dayWaste.map(wasteRow).join('')}</div>` : `<div class="sub2">${esc(t('rep.noWaste'))}</div>`;

    /* export this day */
    html += `<div class="bottomstack">
      <div style="display:flex;gap:12px">
        <button class="btn btn--ghost" style="flex:1" data-a="dcsv">${esc(t('rep.exportCsv'))}</button>
        <button class="btn btn--gold" style="flex:1" data-a="dpdf">${esc(t('rep.exportPdf'))}</button>
      </div>
    </div>`;

    el.innerHTML = html;

    el.addEventListener('click', async e => {
      if (e.target.closest('[data-a=back]')) { UI.haptic('light'); return UI.go('reports'); }
      const tg = e.target.closest('[data-a=clean]');
      if (tg) {
        cleanOpen = !cleanOpen;
        el.querySelector('.rep-cl')?.classList.toggle('hidden', !cleanOpen);
        const ch = tg.querySelector('[data-chev]');
        if (ch) ch.textContent = cleanOpen ? '⌄' : '›';
        tg.setAttribute('aria-expanded', String(cleanOpen));
        UI.haptic('light');
        return;
      }
      const v = e.target.closest('[data-void]');
      if (v) {
        const ok = await UI.confirm(t('rep.voidWarn'), { danger: true, title: t('rep.void') });
        if (ok && Store.voidSale(v.dataset.void)) {
          UI.haptic('warn');
          UI.toast(t('rep.voided'), { type: 'ok' });
        }
        return;
      }
      if (e.target.closest('[data-a=dcsv]') || e.target.closest('[data-a=dpdf]')) {
        const fresh = Store.closedCounts().find(x => x.bd === bd);
        if (!fresh) return UI.toast(t('rep.notFound'), { type: 'danger' });
        return e.target.closest('[data-a=dcsv]') ? exportCsvDay(fresh) : exportPdfDay(fresh);
      }
    });
  }

  /* ---------- register ---------- */
  UI.registerScreen({
    id: 'reports',
    render(el, params) {
      ensureCss();
      if (!Store.isOwner) {
        el.innerHTML = `<div class="empty grow">${UI.icon('lock')}<div class="empty__t">${esc(t('login.locked'))}</div></div>`;
        setTimeout(() => UI.go(S().session ? 'sell' : 'login'), 0);
        return;
      }
      if (params && params.day) renderDay(el, params.day);
      else renderList(el);
    },
  });
})();

    [data-screen=insights] .ins-sval{flex:none;min-width:36px;text-align:right;font-size:13px;color:var(--t1)}
    [data-screen=insights] .ins-loss .num{color:var(--bad)}
    [data-screen=insights] .ins-rq{font-size:17px;line-height:1.2}
  </style>`));

  const esc = UI.esc;
  const WD = ['d.sun', 'd.mon', 'd.tue', 'd.wed', 'd.thu', 'd.fri', 'd.sat'];
  const wday = bd => t(WD[new Date(bd + 'T12:00:00').getDay()]);
  const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);

  /* y max: 3 gridlines at step/2·step/3·step, step chosen so the rhythm stays clean */
  function niceMax(v) {
    if (!(v > 0)) return 3;
    const t3 = v / 3;
    let step;
    if (t3 <= 1) step = Math.ceil(t3 * 4 - 1e-9) / 4;
    else if (t3 <= 10) step = Math.ceil(t3 - 1e-9);
    else {
      const p = Math.pow(10, Math.floor(Math.log10(t3)));
      const m = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(x => x * p >= t3 - 1e-9) || 10;
      step = m * p;
    }
    return step * 3;
  }

  /**
   * Permitted vocabulary only: hairline gridlines, one polyline, endpoint circle,
   * SG tabular end label, sparse axis text. No area fills, no freeform paths.
   * cfg: {pts:[{bd,v,x01}], color, endLabel, ticks:[{x01,label,num?,anchor?}], label}
   */
  function lineChart(cfg) {
    const W = 340, H = 120, padL = 6, padR = 6, padT = 18, padB = 16;
    const base = H - padB, pw = W - padL - padR, ph = base - padT;
    const pts = cfg.pts, n = pts.length;
    if (!n) return '';
    const vmax = niceMax(Math.max.apply(null, pts.map(p => p.v)));
    const X = p => padL + p.x01 * pw;
    const Y = v => base - (v / vmax) * ph;

    let grid = '';
    for (let k = 1; k <= 3; k++) {
      const gy = Y(vmax * k / 3).toFixed(1);
      grid += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    }
    grid += `<line x1="${padL}" y1="${base}" x2="${W - padR}" y2="${base}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;

    const ticks = (cfg.ticks || []).map(tk => {
      const anchor = tk.anchor || (tk.x01 <= 0 ? 'start' : tk.x01 >= 1 ? 'end' : 'middle');
      return `<text class="ins-tick${tk.num ? ' ins-tick--num' : ''}" x="${(padL + tk.x01 * pw).toFixed(1)}" y="${H - 3}" text-anchor="${anchor}">${esc(tk.label)}</text>`;
    }).join('');

    const line = n > 1
      ? `<polyline fill="none" points="${pts.map(p => X(p).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}" stroke="${cfg.color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`
      : '';
    const lp = pts[n - 1], ex = X(lp), ey = Y(lp.v);
    const endAnchor = ex > W - 52 ? 'end' : ex < 52 ? 'start' : 'middle';
    const dot = `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2.5" fill="${cfg.color}"/>`;
    const endLbl = `<text class="ins-end" x="${ex.toFixed(1)}" y="${Math.max(11, ey - 8).toFixed(1)}" text-anchor="${endAnchor}">${esc(cfg.endLabel)}</text>`;

    return `<svg class="ins-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.label)}">${grid}${ticks}${line}${dot}${endLbl}</svg>`;
  }

  UI.registerScreen({
    id: 'insights',
    render(el, params) {
      const backTo = (params && params.from === 'reports') ? 'reports' : 'dashboard';
      const today = Store.todayBd();
      const head = `<div class="topbar">
          <button class="back" data-a="back">‹ ${esc(t('g.back'))}</button>
          <div class="micro tnum">${esc(UI.fmtDate(today))}</div>
        </div>
        <div class="h1">${esc(t('ins.title'))}</div>`;

      /* owner-only guard: staff never see analytics */
      if (!Store.isOwner) {
        el.innerHTML = head + `<div class="empty grow"><div class="empty__t">${esc(t('login.locked'))}</div></div>`;
        wire(el);
        return;
      }

      const st = Store.state, E = Store.Engine;
      const fromBd = E.addDays(today, -(range - 1));

      /* ---- daily non-void sold units over the range ---- */
      const sold = {};
      let totalSold = 0;
      for (const s of st.sales) {
        if (s.voidedAt || s.bd < fromBd || s.bd > today) continue;
        sold[s.bd] = (sold[s.bd] || 0) + s.qty;
        totalSold += s.qty;
      }
      totalSold = Math.round(totalSold * 100) / 100;
      const days = [];
      for (let i = 0; i < range; i++) days.push(E.addDays(fromBd, i));
      const trendPts = days.map((bd, i) => ({ bd, v: Math.round((sold[bd] || 0) * 100) / 100, x01: range === 1 ? .5 : i / (range - 1) }));

      const seg = `<div class="seg" role="tablist" aria-label="${esc(t('rep.exportRange'))}">
        <button class="seg__btn ${range === 7 ? 'is-on' : ''}" data-range="7" role="tab" aria-selected="${range === 7}">${esc(t('ins.7d'))}</button>
        <button class="seg__btn ${range === 30 ? 'is-on' : ''}" data-range="30" role="tab" aria-selected="${range === 30}">${esc(t('ins.30d'))}</button>
      </div>`;

      /* ---- global empty gate: not enough history to analyse ---- */
      if (Store.closedCounts().length < 2 && totalSold === 0) {
        el.innerHTML = head + seg + `<div class="empty grow">
          <div class="empty__t">${esc(t('ins.noData'))}</div>
          <div class="empty__s">${esc(t('ins.noDataSub'))}</div></div>`;
        wire(el);
        return;
      }

      /* ---- top 8 items by units ---- */
      const per = {};
      for (const s of st.sales) {
        if (s.voidedAt || s.bd < fromBd || s.bd > today) continue;
        per[s.itemId] = (per[s.itemId] || 0) + s.qty;
      }
      const top = Object.entries(per)
        .map(([id, q]) => ({ it: Store.item(id), q: Math.round(q * 100) / 100 }))
        .filter(x => x.it && x.q > 0)
        .sort((a, b) => b.q - a.q).slice(0, 8);
      const maxQ = top.length ? Math.max(top[0].q, .01) : 1;

      /* ---- shrinkage series clipped to range, re-based to range start ---- */
      const allShrink = E.shrinkageSeries(st);
      const beforePts = allShrink.filter(p => p.bd < fromBd);
      const baseCum = beforePts.length ? beforePts[beforePts.length - 1].cum : 0;
      const sPts = allShrink.filter(p => p.bd >= fromBd && p.bd <= today).map(p => ({
        bd: p.bd,
        v: Math.max(0, Math.round((p.cum - baseCum) * 100) / 100),
        x01: range === 1 ? .5 : Math.min(range - 1, Math.max(0, dayDiff(fromBd, p.bd))) / (range - 1),
      }));

      const hasCosts = st.items.some(i => i.active && i.cost != null && i.cost > 0);
      let lossVal = 0;
      for (const c of st.counts) {
        if (c.status !== 'closed' || c.isOpening || c.bd < fromBd || c.bd > today) continue;
        for (const l of c.lines) {
          if (l.variance >= 0) continue;
          const it = Store.item(l.itemId);
          if (it && it.cost != null) lossVal += -l.variance * it.cost;
        }
      }

      /* ---- stockout & reorder (14-day velocity) ---- */
      const items = Store.activeItems();
      const facts = items.map(it => {
        const v = E.velocity(st, it.id, today, 14);
        const stock = Store.stock(it.id);
        return { it, v, stock, d: E.daysUntilStockout(stock, v) };
      });
      const stockout = facts.filter(f => f.d !== null)
        .map(f => ({ ...f, d: Math.max(0, f.d) }))
        .sort((a, b) => a.d - b.d || b.v - a.v).slice(0, 6);
      const reorder = facts.filter(f => f.d !== null && f.d <= 7)
        .map(f => ({ ...f, d: Math.max(0, f.d), sug: Math.max(0, Math.ceil(f.v * 14 - f.stock)) }))
        .sort((a, b) => a.d - b.d);

      /* ---- charts (strings only, no listeners) ---- */
      let trendTicks;
      if (range <= 7) {
        trendTicks = trendPts.map(p => ({ x01: p.x01, label: wday(p.bd).charAt(0).toUpperCase() }));
      } else {
        trendTicks = trendPts.filter((p, i) => i % 5 === 0 || i === trendPts.length - 1)
          .map(p => ({ x01: p.x01, label: String(new Date(p.bd + 'T12:00:00').getDate()), num: true }));
      }
      const trendSvg = lineChart({
        pts: trendPts, color: 'var(--brass)',
        ticks: trendTicks, label: t('ins.trend'),
        endLabel: UI.fmtQty(trendPts[trendPts.length - 1].v),
      });

      let shrinkSvg = '';
      if (sPts.length) {
        const sn = sPts.length;
        const soloAnchor = sPts[0].x01 > .8 ? 'end' : sPts[0].x01 < .2 ? 'start' : 'middle';
        let sTicks = [{ x01: sPts[0].x01, label: UI.fmtDate(sPts[0].bd, { day: 'numeric', month: 'short' }), anchor: sn > 1 ? 'start' : soloAnchor }];
        if (sn > 1 && sPts[sn - 1].x01 - sPts[0].x01 >= .25) {
          sTicks.push({ x01: sPts[sn - 1].x01, label: UI.fmtDate(sPts[sn - 1].bd, { day: 'numeric', month: 'short' }), anchor: 'end' });
        } else if (sn > 1) {
          sTicks = [{ x01: sPts[sn - 1].x01, label: UI.fmtDate(sPts[sn - 1].bd, { day: 'numeric', month: 'short' }), anchor: 'end' }];
        }
        shrinkSvg = lineChart({
          pts: sPts, color: 'var(--bad)',
          ticks: sTicks, label: t('ins.shrink'),
          endLabel: `${UI.fmtQty(sPts[sn - 1].v)} ${t('ins.units')}`,
        });
      }

      const velLine = f => esc(t('ins.perDay', { n: UI.fmtQty(Math.round(f.v * 10) / 10) }));

      el.innerHTML = head + seg + `
        <div class="sec"><div class="micro">${esc(t('ins.trend'))}</div>
          <div class="micro tnum">${esc(UI.fmtQty(totalSold))} ${esc(t('ins.units'))}</div></div>
        ${trendSvg}

        <div class="sec"><div class="micro">${esc(t('ins.top'))}</div></div>
        ${top.length ? `<div class="ins-sellers">${top.map(x => `
          <div class="ins-srow">
            <span class="ins-sname">${esc(x.it.name)}</span>
            <span class="ins-scell">
              <span class="ins-track"><span class="ins-bar" style="width:${Math.max(2, x.q / maxQ * 100).toFixed(1)}%"></span></span>
              <span class="ins-sval num">${esc(UI.fmtQty(x.q))}</span>
            </span>
          </div>`).join('')}</div>`
        : `<div class="sub2">${esc(t('ins.noData'))}</div>`}

        <div class="sec"><div class="micro">${esc(t('ins.shrink'))}</div></div>
        <div class="sub2">${esc(t('ins.shrinkHint'))}</div>
        ${shrinkSvg || `<div class="sub2">${esc(t('dash.noCountYet'))}</div>`}
        ${hasCosts ? `<div class="sub2 ins-loss">${esc(t('rep.lossValue'))} · <span class="num">${esc(UI.money(lossVal))}</span></div>` : ''}

        <div class="sec"><div class="micro">${esc(t('ins.stockout'))}</div></div>
        ${stockout.length ? `<div class="feed">${stockout.map(f => `
          <div class="row">
            <div class="row__art">${UI.art(f.it)}</div>
            <div class="row__body"><div class="row__t">${esc(f.it.name)}</div>
              <div class="row__s num">${velLine(f)}</div></div>
            <div class="row__end"><span class="pill ${f.d <= 3 ? 'pill--danger' : f.d <= 7 ? 'pill--warn' : 'pill--mut'} num">${esc(I18N.plural('ins.stockoutDays', f.d, { n: f.d }))}</span></div>
          </div>`).join('')}</div>`
        : `<div class="sub2">${esc(t('ins.noData'))}</div>`}

        <div class="sec"><div class="micro">${esc(t('ins.reorder'))}</div></div>
        <div class="sub2">${esc(t('ins.reorderHint'))}</div>
        ${reorder.length ? `<div class="feed">${reorder.map(f => `
          <div class="row">
            <div class="row__art">${UI.art(f.it)}</div>
            <div class="row__body"><div class="row__t">${esc(f.it.name)}</div>
              <div class="row__s num">${velLine(f)} · ${esc(I18N.plural('ins.stockoutDays', f.d, { n: f.d }))}</div></div>
            <div class="row__end"><div class="num ins-rq">+${esc(UI.fmtQty(f.sug))}</div><div class="micro">${esc(t('ins.units'))}</div></div>
          </div>`).join('')}</div>`
        : `<div class="sub2">${esc(t('ins.reorderNone'))}</div>`}`;

      wire(el);

      function wire(root) {
        root.addEventListener('click', e => {
          if (e.target.closest('[data-a=back]')) { UI.haptic('light'); return UI.go(backTo); }
          const b = e.target.closest('[data-range]');
          if (b) {
            const r = +b.dataset.range;
            if (r !== range) { range = r; UI.haptic('light'); UI.refresh(); }
          }
        });
      }
    },
  });
})();

      <button class="btn btn--gold btn--full mt3" data-a="ok" disabled>${esc(t('g.save'))}</button>
    </div>`);
    const sh = UI.sheet(c);
    const dotsEl = c.querySelector('[data-r=dots]');
    const okBtn = c.querySelector('[data-a=ok]');
    UI.numpad(c.querySelector('[data-r=pad]'), {
      onKey: k => {
        if (k === 'del') val = val.slice(0, -1);
        else if (k !== 'dot' && val.length < 6) val += k;
        [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i < val.length));
        okBtn.disabled = val.length < 4;
      },
    });
    okBtn.addEventListener('click', async () => {
      if (val.length < 4) return;
      okBtn.disabled = true;
      await Store.setEmployeePin(empId, val);
      UI.haptic('success'); sh.close(); UI.toast(t('set.pinChanged'), { type: 'ok' });
    });
  }

  function addMemberSheet() {
    const c = UI.el(`<div>
      <div class="micro" style="margin-bottom:16px">${esc(t('set.teamAdd'))}</div>
      <div class="field"><label>${esc(t('inv.name'))}</label>
        <input data-r="name" type="text" maxlength="30" placeholder="${esc(t('wiz.staffNamePh'))}" autocomplete="off"></div>
      <div class="field"><label>${esc(t('set.pinOptional'))}</label>
        <input data-r="pin" type="password" inputmode="numeric" maxlength="6" placeholder="····" autocomplete="new-password">
        <p class="tt mt2">${esc(t('set.pinLen'))}</p></div>
      <button class="btn btn--gold btn--full" data-a="save">${esc(t('g.save'))}</button>
    </div>`);
    const sh = UI.sheet(c);
    const nameEl = c.querySelector('[data-r=name]');
    setTimeout(() => nameEl.focus(), 350);
    c.querySelector('[data-a=save]').addEventListener('click', async () => {
      const name = nameEl.value.trim();
      const pin = c.querySelector('[data-r=pin]').value.trim();
      if (!name) { UI.haptic('warn'); nameEl.focus(); return; }
      if (pin && !/^\d{4,6}$/.test(pin)) { UI.haptic('warn'); UI.toast(t('set.pinLen'), { type: 'danger' }); return; }
      await Store.addEmployee(name, pin || undefined);
      UI.haptic('success'); sh.close(); UI.toast(t('set.memberAdded'), { type: 'ok' });
    });
  }

  function auditSheet() {
    const rows = Store.state.audit.slice(0, 100);
    const body = rows.length ? rows.map(a => {
      const meta = a.after == null ? '' : (typeof a.after === 'string' ? a.after : JSON.stringify(a.after));
      const metaShort = meta.length > 48 ? meta.slice(0, 48) + '…' : meta;
      return `<div class="row">
        <span class="row__body">
          <span class="row__t">${esc(a.action)} · ${esc(a.entity)}${metaShort ? ' · ' + esc(metaShort) : ''}</span>
          <span class="row__s tnum">${esc(a.actor)} · ${esc(UI.fmtDate(localBd(a.at)))} · ${esc(UI.fmtTime(a.at))}</span>
        </span>
      </div>`;
    }).join('')
      : `<div class="sub2" style="padding:16px 0">${esc(t('set.auditEmpty'))}</div>`;
    UI.sheet(`<div class="micro" style="margin-bottom:8px">${esc(t('set.audit'))}</div>${body}`);
  }

  function restoreFlow() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.style.display = 'none';
    inp.addEventListener('change', async () => {
      const f = inp.files[0];
      inp.remove();
      if (!f) return;
      let text;
      try { text = await f.text(); }
      catch (e) { UI.toast(t('g.error'), { type: 'danger' }); return; }
      const ok = await UI.confirm(t('set.restoreWarn'), { danger: true, title: t('set.restore'), yes: t('set.restore') });
      if (!ok) return;
      try { Store.importJSON(text); UI.haptic('success'); UI.toast(t('set.restored'), { type: 'ok' }); }
      catch (e) { UI.toast(t('g.error'), { type: 'danger' }); }
    });
    document.body.appendChild(inp);
    inp.click();
  }

  async function toggleNotifs() {
    if (typeof Notification === 'undefined') { UI.toast(t('set.notifUnsupported'), { type: 'danger' }); return; }
    const on = Notification.permission === 'granted' && S().notifGranted;
    if (on) { Store.setSettings({ notifGranted: false }); saved(); return; }
    const perm = await Notification.requestPermission();
    if (perm === 'granted') { Store.setSettings({ notifGranted: true }); UI.haptic('success'); saved(); }
    else { Store.setSettings({ notifGranted: false }); UI.toast(t('set.notifDenied'), { type: 'danger', ms: 4200 }); }
  }

  /* ---------- sections: .sec micro labels + hairline rows, no boxes ---------- */

  function barSec(s) {
    const langBtn = (v, key) => `<button class="seg__btn ${s.lang === v ? 'is-on' : ''}" data-a="lang" data-v="${v}">${esc(t(key))}</button>`;
    const hours = Array.from({ length: 13 }, (_, h) =>
      `<option value="${h}" ${h === s.cutoffHour ? 'selected' : ''}>${pad2(h)}:00</option>`).join('');
    return `
      <div class="sec"><div class="micro">${esc(t('set.bar'))}</div></div>
      <label class="row">
        <span class="row__body"><span class="row__t">${esc(t('set.barName'))}</span></span>
        <input class="stg-in" data-r="barname" type="text" maxlength="40" value="${esc(s.barName)}" placeholder="${esc(t('wiz.barNamePh'))}" autocomplete="off">
      </label>
      <div class="row">
        <span class="tile t40">${s.logo ? `<img src="${esc(s.logo)}" alt="${esc(t('set.logo'))}">` : UI.logoMark(22)}</span>
        <span class="row__body"><span class="row__t">${esc(t('set.logo'))}</span></span>
        ${s.logo ? `<button class="textbtn" data-a="logo-rm">${esc(t('set.logoRemove'))}</button>` : ''}
        <button class="textbtn" data-a="logo-pick">${esc(t('set.logoPick'))}</button>
      </div>
      <div class="row">
        <span class="row__body"><span class="row__t">${esc(t('set.lang'))}</span></span>
        <div class="seg stg-seg">${langBtn('fr', 'set.langFr')}${langBtn('en', 'set.langEn')}</div>
      </div>
      <label class="row">
        <span class="row__body"><span class="row__t">${esc(t('set.cutoff'))}</span>
          <span class="row__s">${esc(t('set.cutoffHint'))}</span></span>
        <select class="stg-sel num" data-r="cutoff">${hours}</select>
      </label>`;
  }

  function teamSec(s) {
    const emps = [...Store.state.employees].sort((a, b) => (a.active === b.active ? 0 : a.active ? -1 : 1));
    const rows = emps.map(emp => `
      <div class="row ${emp.active ? '' : 'is-off'}">
        <span class="tile t40"><span class="mono" style="color:var(--t2)">${esc(initials(emp.name))}</span></span>
        <span class="row__body">
          <span class="row__t">${esc(emp.name)}</span>
          ${emp.active
            ? (emp.pinHash ? `<span class="row__s">${esc(t('set.teamPin'))} ····</span>` : '')
            : `<span class="row__s">${esc(t('inv.inactive'))}</span>`}
        </span>
        ${emp.active ? `<button class="textbtn" data-a="emp-pin" data-id="${emp.id}">${esc(t('set.teamPin'))}</button>` : ''}
        <button class="textbtn" data-a="emp-act" data-id="${emp.id}">${esc(emp.active ? t('set.teamDeactivate') : t('set.teamReactivate'))}</button>
      </div>`).join('');
    const empty = `<div class="sub2" style="margin-top:12px">${esc(t('set.teamEmpty'))}</div>
      <div class="tt" style="margin-top:4px">${esc(t('set.teamEmptySub'))}</div>`;
    return `
      <div class="sec"><div class="micro">${esc(t('set.team'))}</div><div class="micro tnum">${emps.filter(e => e.active).length}</div></div>
      ${emps.length ? rows : empty}
      <button class="textbtn" data-a="team-add" style="width:100%;padding:16px 0">${esc(t('set.teamAdd'))}</button>
      <div class="switchrow" style="border-top:1px solid var(--hair)">
        <div style="flex:1;min-width:0"><div class="switchrow__t">${esc(t('set.teamRequirePin'))}</div>
          <div class="switchrow__s">${esc(t('set.teamRequirePinHint'))}</div></div>
        <button class="sw ${s.requireStaffPin ? 'on' : ''}" data-a="requirePin" role="switch" aria-checked="${s.requireStaffPin}" aria-label="${esc(t('set.teamRequirePin'))}"></button>
      </div>
      <button class="grouprow" data-a="owner-pin"><span>${esc(t('set.ownerPin'))}</span><span class="chev">›</span></button>`;
  }

  function alertsSec(s) {
    const hasN = typeof Notification !== 'undefined';
    const perm = hasN ? Notification.permission : 'unsupported';
    const on = hasN && perm === 'granted' && s.notifGranted;
    const sub = !hasN ? t('set.notifUnsupported') : perm === 'denied' ? t('set.notifDenied') : t('set.notifHint');
    return `
      <div class="sec"><div class="micro">${esc(t('set.alerts'))}</div></div>
      <div class="row">
        <span class="row__body"><span class="row__t">${esc(t('set.varThreshold'))}</span>
          <span class="row__s">${esc(t('set.varThresholdHint'))}</span></span>
        <div class="stg-step">
          <button class="stg-stepbtn" data-a="var-" ${s.varThreshold <= 1 ? 'disabled' : ''} aria-label="−1">−</button>
          <span class="stg-step__v">${s.varThreshold}</span>
          <button class="stg-stepbtn" data-a="var+" ${s.varThreshold >= 10 ? 'disabled' : ''} aria-label="+1">+</button>
        </div>
      </div>
      <div class="switchrow">
        <div style="flex:1;min-width:0"><div class="switchrow__t">${esc(t('set.notifOn'))}</div>
          <div class="switchrow__s"${perm === 'denied' ? ' style="color:var(--warn)"' : ''}>${esc(sub)}</div></div>
        <button class="sw ${on ? 'on' : ''}" data-a="notif" role="switch" aria-checked="${on}" aria-label="${esc(t('set.notifOn'))}"></button>
      </div>`;
  }

  function costsSec(s) {
    const items = Store.activeItems();
    const list = costsOpen ? `<div class="stg-costs">${items.map(it => `
      <div class="row">
        <span class="row__body"><span class="row__t">${esc(it.name)}</span></span>
        <input class="stg-cost" data-cost="${it.id}" type="number" inputmode="decimal" min="0" step="0.5" value="${it.cost ?? ''}" placeholder="—" aria-label="${esc(t('inv.cost', { cur: s.currency }))}">
      </div>`).join('')}</div>` : '';
    return `
      <div class="sec"><div class="micro">${esc(t('set.costs'))}</div></div>
      <div class="sub2" style="margin-top:8px">${esc(t('set.costsHint', { cur: s.currency }))}</div>
      <label class="row" style="margin-top:4px">
        <span class="row__body"><span class="row__t">${esc(t('set.currency'))}</span></span>
        <input class="stg-in stg-in--s" data-r="cur" type="text" maxlength="5" value="${esc(s.currency)}" autocapitalize="characters" autocomplete="off">
      </label>
      <button class="grouprow" data-a="costs">
        <span class="micro">${esc(costsOpen ? t('set.costsHide') : t('set.costsShow', { n: items.length }))}</span>
        <span class="chev">${costsOpen ? '⌄' : '›'}</span>
      </button>
      ${list}`;
  }

  function dataSec(s) {
    return `
      <div class="sec"><div class="micro">${esc(t('set.data'))}</div></div>
      <div class="row">
        <span class="row__body"><span class="row__t">${esc(t('set.backup'))}</span>
          <span class="row__s">${esc(t('set.backupHint'))}</span></span>
        <button class="textbtn" data-a="backup">${esc(t('set.actExport'))}</button>
      </div>
      <div class="row">
        <span class="row__body"><span class="row__t">${esc(t('set.restore'))}</span></span>
        <button class="textbtn" data-a="restore">${esc(t('set.actRestore'))}</button>
      </div>
      ${s.demoMode ? `<div class="row">
        <span class="row__body"><span class="row__t">${esc(t('set.demoClear'))}</span></span>
        <button class="textbtn" data-a="demo-clear" style="color:var(--bad)">${esc(t('set.actClear'))}</button>
      </div>` : ''}
      <div class="row">
        <span class="row__body"><span class="row__t">${esc(t('set.reset'))}</span></span>
        <button class="textbtn" data-a="reset" style="color:var(--bad)">${esc(t('set.actErase'))}</button>
      </div>
      <button class="grouprow" data-a="audit"><span>${esc(t('set.audit'))}</span><span class="chev">›</span></button>`;
  }

  function aboutLine() {
    return `<div class="sub2" style="margin-top:24px">BarTally · ${esc(t('set.version'))} <span class="tnum">${VERSION}</span> · ${esc(t('set.installHint'))}</div>`;
  }

  /* ---------- delegated handlers ---------- */

  async function onClick(e) {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    const a = b.dataset.a;
    const s = S();
    if (a === 'lang') {
      const v = b.dataset.v;
      if (v !== s.lang) { Store.setSettings({ lang: v }); UI.refresh(); saved(); }
      return;
    }
    if (a === 'logo-pick') {
      const uri = await UI.pickImage();
      if (uri) { Store.setSettings({ logo: uri }); saved(); }
      return;
    }
    if (a === 'logo-rm') { Store.setSettings({ logo: null }); saved(); return; }
    if (a === 'team-add') { addMemberSheet(); return; }
    if (a === 'emp-pin') { staffPinSheet(b.dataset.id); return; }
    if (a === 'emp-act') {
      const emp = Store.state.employees.find(x => x.id === b.dataset.id);
      if (!emp) return;
      if (emp.active) {
        if (await UI.confirm(t('set.teamDeactivateWarn', { name: emp.name }), { danger: true, title: t('set.teamDeactivate'), yes: t('set.teamDeactivate') })) {
          Store.setEmployeeActive(emp.id, false); UI.haptic('warn'); saved();
        }
      } else if (await UI.confirm(t('set.teamReactivateWarn', { name: emp.name }), { title: t('set.teamReactivate'), yes: t('set.teamReactivate') })) {
        Store.setEmployeeActive(emp.id, true); UI.haptic('success'); saved();
      }
      return;
    }
    if (a === 'requirePin') { UI.haptic('light'); Store.setSettings({ requireStaffPin: !s.requireStaffPin }); saved(); return; }
    if (a === 'owner-pin') { ownerPinSheet(); return; }
    if (a === 'var-' || a === 'var+') {
      const v = Math.min(10, Math.max(1, (s.varThreshold || 2) + (a === 'var+' ? 1 : -1)));
      if (v !== s.varThreshold) { UI.haptic('light'); Store.setSettings({ varThreshold: v }); }
      return;
    }
    if (a === 'notif') { toggleNotifs(); return; }
    if (a === 'costs') {
      costsOpen = !costsOpen;
      if (!costsOpen) costFocusId = null;
      UI.haptic('light'); UI.refresh();
      return;
    }
    if (a === 'backup') {
      UI.haptic('success');
      UI.download('bartally-backup-' + Store.todayBd() + '.json', Store.exportJSON(), 'application/json');
      return;
    }
    if (a === 'restore') { restoreFlow(); return; }
    if (a === 'demo-clear') {
      if (await UI.confirm(t('set.demoClearWarn'), { danger: true, title: t('set.demoClear'), yes: t('set.demoClear') })) Store.resetAll();
      return;
    }
    if (a === 'reset') {
      if (await UI.confirm(t('set.resetWarn'), { danger: true, title: t('set.reset'), yes: t('set.reset') })) Store.resetAll();
      return;
    }
    if (a === 'audit') { auditSheet(); return; }
  }

  function onChange(e) {
    const tgt = e.target;
    const s = S();
    if (tgt.dataset.r === 'barname') {
      const v = tgt.value.trim();
      if (v && v !== s.barName) { Store.setSettings({ barName: v }); saved(); }
      else if (!v) tgt.value = s.barName;
      return;
    }
    if (tgt.dataset.r === 'cutoff') {
      const v = +tgt.value;
      if (v !== s.cutoffHour) { Store.setSettings({ cutoffHour: v }); saved(); }
      return;
    }
    if (tgt.dataset.r === 'cur') {
      const v = tgt.value.trim().toUpperCase();
      if (v.length < 3 || v.length > 5) { tgt.value = s.currency; UI.toast(t('set.curLen'), { type: 'danger' }); }
      else if (v !== s.currency) { Store.setSettings({ currency: v }); saved(); }
      return;
    }
    if (tgt.dataset.cost) {
      const it = Store.item(tgt.dataset.cost);
      if (!it) return;
      const raw = tgt.value.trim().replace(',', '.');
      let cost = raw === '' ? null : Number(raw);
      if (cost != null && (!isFinite(cost) || cost < 0)) { tgt.value = it.cost ?? ''; return; }
      if (cost != null) cost = Math.round(cost * 100) / 100;
      if (cost !== (it.cost ?? null)) { Store.saveItem({ id: it.id, cost }); saved(); }
    }
  }

  /* ---------- screen (root tab: no back button, tab bar is global) ---------- */

  UI.registerScreen({
    id: 'settings',
    render(el) {
      if (!Store.isOwner) {
        el.innerHTML = `<div class="empty grow">${UI.icon('lock')}<div class="empty__t">${esc(t('login.locked'))}</div></div>`;
        return;
      }
      const s = S();
      el.innerHTML = `
        <div class="topbar">
          ${UI.logoMark(26)}
          <div class="micro tnum">v${VERSION}</div>
        </div>
        <div class="h1">${esc(t('set.title'))}</div>
        ${barSec(s)}
        ${teamSec(s)}
        ${alertsSec(s)}
        ${costsSec(s)}
        ${dataSec(s)}
        ${aboutLine()}`;
      /* keep focus on the cost input the user is moving to across store-driven re-renders */
      if (costsOpen && costFocusId) {
        const inp = el.querySelector(`[data-cost="${costFocusId}"]`);
        if (inp && document.activeElement !== inp) inp.focus();
      }
      el.addEventListener('click', onClick);
      el.addEventListener('change', onChange);
      el.addEventListener('focusin', e => { costFocusId = (e.target.dataset && e.target.dataset.cost) || null; });
    },
  });
})();

/* == 90-app.js == */
/* ============ boot + "Plus" menu screen ============ */
/* 'more' retired by the 4-tab reference layout — legacy targets land on the dashboard */
UI.registerScreen({ id: 'more', render() { UI.go(Store.isOwner ? 'dashboard' : 'sell'); } });

UI.registerScreen({
  id: 'more-legacy',
  render(el) {
    if (!Store.isOwner) { UI.go(Store.state.session ? 'sell' : 'login'); return; }
    const s = Store.state.settings;
    el.innerHTML = UI.header(t('tab.more'), s.barName) + `
      <div class="card" style="padding:6px 16px">
        ${[
          ['reports', 'calendar', 'rep.title'],
          ['insights', 'chart', 'ins.title'],
          ['restock', 'truck', 'restock.title'],
          ['waste', 'spill', 'waste.title'],
          ['settings', 'gear', 'set.title'],
        ].map(([id, ic, key]) => `
          <button class="row" style="width:100%;text-align:left" data-go="${id}">
            <span class="iconbtn iconbtn--plain" style="color:var(--gold)">${UI.icon(ic)}</span>
            <span class="row__body"><span class="row__t">${UI.esc(t(key))}</span></span>
            <span style="color:var(--text-3)">${UI.icon('chevR')}</span>
          </button>`).join('')}
      </div>
      <div class="card" style="padding:6px 16px">
        <button class="row" style="width:100%;text-align:left" data-a="lock">
          <span class="iconbtn iconbtn--plain" style="color:var(--text-2)">${UI.icon('lock')}</span>
          <span class="row__body"><span class="row__t">${UI.esc(t('login.switchUser'))}</span></span>
        </button>
      </div>`;
    el.addEventListener('click', e => {
      const g = e.target.closest('[data-go]');
      if (g) return UI.go(g.dataset.go);
      if (e.target.closest('[data-a=lock]')) { Store.logout(); }
    });
  },
});

const App = {
  start() {
    I18N.lang = Store.state.settings.lang || 'fr';
    let raf = null;
    Store.on(what => {
      if (what === 'session' || what === 'all') return App.route();
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = null; UI.refresh(); });
    });
    this.route();
    this.countReminder();
    // PWA service worker (no-op where sw.js doesn't exist, e.g. artifact preview)
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  },
  route() {
    const st = Store.state;
    if (!st.settings.setupDone) return UI.go('welcome');
    if (!st.session) return UI.go('login');
    UI.go(Store.isOwner ? 'dashboard' : 'sell');
  },
  countReminder() {
    const st = Store.state;
    if (!st.settings.setupDone) return;
    const yesterday = Store.Engine.addDays(Store.todayBd(), -1);
    const has = st.counts.some(c => c.bd >= yesterday && c.status === 'closed');
    const already = st.notifs.some(n => n.type === 'reminder' && n.bd === Store.todayBd());
    if (!has && !already && new Date().getHours() >= 11) {
      Store.notify('reminder', { date: UI.fmtDate(yesterday) });
    }
  },
};
window.addEventListener('DOMContentLoaded', () => App.start());

</script>
