/* == 01-tokens.css == */
/* ============ BarTally design tokens (§7) — single-theme: ink & gold ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:root{
  color-scheme:dark;
  /* grounds */
  --ink:#0A0A0E;
  --surface:#14141B;
  --surface-2:#1A1A23;
  --surface-3:#22222D;
  --glass:rgba(26,26,35,.72);
  --hairline:rgba(255,255,255,.08);
  --hairline-strong:rgba(255,255,255,.14);
  /* brand */
  --gold:#F5A623;
  --gold-hi:#F7C14B;
  --gold-deep:#E8940A;
  --gold-grad:linear-gradient(135deg,#F7C14B 0%,#F5A623 55%,#E8940A 100%);
  --gold-soft:rgba(245,166,35,.14);
  --on-gold:#161006;
  /* ink (text) */
  --text:#F2F2F5;
  --text-2:#A9A9B5;
  --text-3:#6E6E7A;
  /* status — reserved, never series colors */
  --ok:#34D399;   --ok-soft:rgba(52,211,153,.13);
  --danger:#F87171; --danger-soft:rgba(248,113,113,.13);
  --warn:#FB923C; --warn-soft:rgba(251,146,60,.13);
  /* chart series (validated, dark band) */
  --series-1:#C98500; --series-2:#3987E5; --series-3:#D55181; --series-4:#9085E9;
  /* category accents */
  --cat-biere:#F2C43D; --cat-rouge:#D05672; --cat-blanc:#DCCB7E; --cat-rose:#F49BB5;
  --cat-demi:#A78BFA; --cat-champ:#EFE3AE; --cat-spirit:#C97A45; --cat-cuisine:#6FBF8E;
  /* geometry — 8pt grid */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;
  --r-card:20px; --r-el:12px; --r-pill:999px;
  --shadow-1:0 1px 2px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.35);
  --shadow-2:0 2px 6px rgba(0,0,0,.55),0 16px 48px rgba(0,0,0,.45);
  --glow-gold:0 0 0 1px rgba(245,166,35,.35),0 4px 24px rgba(245,166,35,.18);
  /* type */
  --f-display:'Space Grotesk','Inter',system-ui,sans-serif;
  --f-ui:'Inter',system-ui,-apple-system,sans-serif;
  --tap:48px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{
  background:var(--ink);
  color:var(--text);
  font-family:var(--f-ui);
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
/* ambient ground: faint gold aurora, fixed, never moves content */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 40% at 85% -10%,rgba(245,166,35,.10),transparent 60%),
    radial-gradient(50% 35% at -10% 100%,rgba(88,60,150,.08),transparent 60%);
}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums lining-nums;font-feature-settings:'tnum' 1;letter-spacing:.01em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
a{color:var(--gold);text-decoration:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
::selection{background:rgba(245,166,35,.3)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* == 02-components.css == */
/* ============ BarTally component kit ============ */

/* ---- app shell ---- */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding:calc(var(--sat) + var(--s4)) var(--s4) calc(var(--sab) + 96px);animation:screen-in .28s cubic-bezier(.2,.8,.25,1)}
.screen--bare{padding-bottom:calc(var(--sab) + var(--s6))}
@keyframes screen-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.apphead{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s5)}
.apphead__titles{flex:1;min-width:0}
.apphead__title{font-size:22px}
.apphead__sub{color:var(--text-3);font-size:12.5px;margin-top:1px}
.apphead .iconbtn{flex:none}

/* ---- bottom tab bar (glass) ---- */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 12px);z-index:40;
  display:flex;gap:2px;padding:6px;border-radius:var(--r-pill);
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);
  border:1px solid var(--hairline);box-shadow:var(--shadow-2)}
.tabbar__btn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:64px;padding:8px 10px;border-radius:var(--r-pill);color:var(--text-3);transition:color .18s,background .18s}
.tabbar__btn svg{width:22px;height:22px}
.tabbar__btn span{font-size:10.5px;font-weight:600;letter-spacing:.02em}
.tabbar__btn.is-on{color:var(--on-gold);background:var(--gold-grad);box-shadow:var(--glow-gold)}

/* ---- cards ---- */
.card{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 40%),var(--surface);
  border:1px solid var(--hairline);border-radius:var(--r-card);padding:var(--s4);box-shadow:var(--shadow-1)}
.card+.card{margin-top:var(--s3)}
.card--gold{background:linear-gradient(160deg,rgba(245,166,35,.16),rgba(245,166,35,.04) 55%),var(--surface);border-color:rgba(245,166,35,.25)}
.card__head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:var(--s3)}
.card__title{font-size:15px;font-weight:600;font-family:var(--f-ui)}

/* ---- stat tiles ---- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.stat{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-card);padding:var(--s4)}
.stat__v{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat__l{color:var(--text-3);font-size:12px;margin-top:2px}
.stat__d{font-size:12px;margin-top:4px;font-weight:600}
.up{color:var(--ok)}.down{color:var(--danger)}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:var(--tap);padding:0 var(--s5);border-radius:var(--r-el);
  font-weight:600;font-size:15px;transition:transform .12s,box-shadow .18s,background .18s;user-select:none}
.btn:active{transform:scale(.97)}
.btn--gold{background:var(--gold-grad);color:var(--on-gold);box-shadow:var(--glow-gold)}
.btn--ghost{background:var(--surface-2);border:1px solid var(--hairline);color:var(--text)}
.btn--danger{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(248,113,113,.3)}
.btn--line{border:1px solid var(--hairline-strong);color:var(--text-2)}
.btn--full{width:100%}
.btn--big{min-height:56px;border-radius:16px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);border-radius:var(--r-el);background:var(--surface-2);border:1px solid var(--hairline);color:var(--text-2);transition:background .15s}
.iconbtn svg{width:20px;height:20px}
.iconbtn:active{background:var(--surface-3)}
.iconbtn--plain{background:none;border:0}

/* ---- chips / segmented ---- */
.chips{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 2px var(--s2);scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:var(--r-pill);
  background:var(--surface-2);border:1px solid var(--hairline);color:var(--text-2);font-size:13px;font-weight:600;transition:all .16s}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--gold))}
.chip.is-on{background:var(--gold-soft);border-color:rgba(245,166,35,.4);color:var(--gold-hi)}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--hairline);border-radius:var(--r-el);padding:3px;gap:2px}
.seg__btn{flex:1;min-height:38px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-3);transition:all .16s}
.seg__btn.is-on{background:var(--surface-3);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.4)}

/* ---- search ---- */
.search{position:relative;margin-bottom:var(--s3)}
.search input{width:100%;height:48px;padding:0 44px 0 44px;border-radius:14px;border:1px solid var(--hairline);
  background:var(--surface-2);color:var(--text);font-size:15px}
.search input::placeholder{color:var(--text-3)}
.search input:focus{border-color:rgba(245,166,35,.5)}
.search>svg{position:absolute;left:14px;top:14px;width:20px;height:20px;color:var(--text-3);pointer-events:none}
.search .search__clear{position:absolute;right:6px;top:6px;width:36px;height:36px}

/* ---- item grid (sell screen) & rows ---- */
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
@media (min-width:420px){.igrid{grid-template-columns:repeat(3,1fr)}}
.icard{position:relative;border-radius:16px;overflow:hidden;background:var(--surface-2);border:1px solid var(--hairline);

.sheet{position:relative;width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;background:var(--surface);
  border:1px solid var(--hairline);border-bottom:0;border-radius:24px 24px 0 0;padding:var(--s3) var(--s5) calc(var(--sab) + var(--s6));

.sheet.is-closing{animation:sheet-down .22s ease-in forwards}
.sheet-wrap__bg.is-closing{animation:fade-out .22s forwards}
@keyframes sheet-up{from{transform:translateY(60px);opacity:.4}to{transform:none;opacity:1}}
@keyframes sheet-down{to{transform:translateY(100%);opacity:0}}
@keyframes fade-in{from{opacity:0}}
@keyframes fade-out{to{opacity:0}}

/* ---- toast ---- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 92px);z-index:80;display:flex;flex-direction:column;gap:var(--s2);width:min(92vw,440px)}
.toast{display:flex;align-items:center;gap:var(--s3);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);

/* ============ BarTally store — state, engine, seed, audit. No DOM, no i18n here. ============ */

/* ---------- pure engine (also exercised by node tests) ---------- */
const Engine = {
  pad(n) { return String(n).padStart(2, '0'); },
  /** business date 'YYYY-MM-DD' for a JS Date, given cutoff hour (sales at 01:30 belong to previous evening) */
  bdOf(date, cutoffHour) {
    const d = new Date(date.getTime());
    if (d.getHours() < cutoffHour) d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${this.pad(d.getMonth() + 1)}-${this.pad(d.getDate())}`;
  },
  addDays(bd, n) {
    const [y, m, d] = bd.split('-').map(Number);
    const dt = new Date(y, m - 1, d + n);
    return `${dt.getFullYear()}-${this.pad(dt.getMonth() + 1)}-${this.pad(dt.getDate())}`;
  },
  /** latest CLOSED count with bd matching cmp relative to targetBd */
  baselineCount(counts, targetBd, { strictlyBefore = false } = {}) {
    let best = null;
    for (const c of counts) {
      if (c.status !== 'closed') continue;
      if (strictlyBefore ? c.bd >= targetBd : c.bd > targetBd) continue;
      if (!best || c.bd > best.bd) best = c;
    }
    return best;
  },
  sumSince(entries, itemId, base, targetBd, { skipVoided = true } = {}) {
    let s = 0;
    for (const e of entries) {
      if (e.itemId !== itemId) continue;
      if (skipVoided && e.voidedAt) continue;
      if (targetBd && e.bd > targetBd) continue;
      if (base) {
        if (e.bd < base.bd) continue;
        if (e.bd === base.bd && !(base.closedAt && e.at > base.closedAt)) continue;
      }
      s += e.qty;
    }
    return Math.round(s * 100) / 100;
  },
  /**
   * expected(item, targetBd) = counted at baseline + restocks − sales − waste since baseline, up to targetBd inclusive.
   * strictlyBefore=true → baseline is the previous day's count (used DURING a count of targetBd).
   */
  expected(state, itemId, targetBd, { strictlyBefore = false } = {}) {
    const base = this.baselineCount(state.counts, targetBd, { strictlyBefore });
    let start = 0;
    if (base) {
      const line = base.lines.find(l => l.itemId === itemId);
      if (line) start = line.counted;
      else start = 0; // item added after that count → entries since still apply
    }
    const r = this.sumSince(state.restocks, itemId, base, targetBd, { skipVoided: false });
    const s = this.sumSince(state.sales, itemId, base, targetBd);
    const w = this.sumSince(state.waste, itemId, base, targetBd, { skipVoided: false });
    return Math.round((start + r - s - w) * 100) / 100;
  },
  /** sales velocity: avg non-void units/day over last `days` business days ending yesterday-ish */
  velocity(state, itemId, todayBd, days = 14) {
    const from = this.addDays(todayBd, -days);
    let s = 0;
    for (const e of state.sales) {
      if (e.itemId !== itemId || e.voidedAt) continue;
      if (e.bd > todayBd || e.bd <= from) continue;
      s += e.qty;
    }
    return s / days;
  },
  daysUntilStockout(stock, vel) { return vel > 0.01 ? Math.floor(stock / vel) : null; },
  /** cumulative unexplained loss series from closed counts (negative variances only, flipped positive) */
  shrinkageSeries(state) {
    const closed = state.counts.filter(c => c.status === 'closed').sort((a, b) => a.bd < b.bd ? -1 : 1);
    let cum = 0;
    return closed.filter(c => !c.isOpening).map(c => {
      let day = 0;
      for (const l of c.lines) if (l.variance < 0) day += -l.variance;
      cum = Math.round((cum + day) * 100) / 100;
      return { bd: c.bd, day: Math.round(day * 100) / 100, cum };
    });
  },
};

/* ---------- id/hash utils ---------- */
let _uidc = 0;
function uid() { return Date.now().toString(36) + (_uidc++).toString(36) + Math.random().toString(36).slice(2, 6); }
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + '|' + pin);
  const h = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}

    ['spirit', 'Agavita', 'bouteille', true, 2, 'tequila', { g: '#7A6A24', l: '#EAE2C0' }],
    ['spirit', 'Jägermeister', 'bouteille', true, 2, 'herbal', { g: '#12300F', l: '#E8890A' }],
    ['spirit', 'Cognac', 'bouteille', true, 2, 'cognac', { g: '#4A2410', l: '#E9D9B8' }],
    ['spirit', 'Martini Blanc', 'bouteille', true, 2, 'vermouth', { g: '#8A8A4A', l: '#F0ECD8' }],
    // Cuisine — portion, threshold 10
    ['cuisine', 'Fromage', 'portion', false, 10, 'cheese', { g: '#C89A3A', l: '#F2E2B0' }],
    ['cuisine', 'Viande Hachée', 'portion', false, 10, 'meat', { g: '#8A3A2E', l: '#E9C9B8' }],
    ['cuisine', 'Foie', 'portion', false, 10, 'liver', { g: '#6A2A24', l: '#DCB8A8' }],
    ['cuisine', 'Cervelle', 'portion', false, 10, 'brain', { g: '#B08A7A', l: '#EEDCD0' }],
    ['cuisine', 'Pizza V/H', 'portion', false, 10, 'pizza', { g: '#B4582A', l: '#F0D8A0' }],
  ],
  build() {
    return this.items.map(([catId, name, unit, allowDecimal, threshold, art, tint], i) => ({
      id: 'it' + (i + 1).toString(36).padStart(2, '0'),
      catId, name, unit, allowDecimal, threshold, art, tint,
      photo: null, barcode: null, pinned: ['Heineken', 'Spécial', 'Black Label', 'Casablanca', 'Red Bull', 'Ricard'].includes(name),
      cost: null, active: true, sort: i,
    }));
  },
};

/* ---------- store ---------- */
const Store = (() => {
  const KEY = 'bartally.v1';
  const LS = (typeof localStorage !== 'undefined') ? localStorage : { getItem: () => null, setItem: () => {}, removeItem: () => {} };
  const listeners = new Set();
  let saveTimer = null;

  function blank() {
    return {
      v: 1,
      settings: {
        barName: '', logo: null, lang: 'fr', cutoffHour: 6,
        varThreshold: 2, currency: 'MAD', requireStaffPin: false,
        ownerPinHash: null, ownerPinSalt: null, ownerName: '',
        setupDone: false, demoMode: false, notifGranted: false,
      },
      categories: [], items: [], employees: [],
      sales: [], restocks: [], waste: [], counts: [],
      audit: [], notifs: [], recents: [],
      session: null,
    };
  }

  let state = blank();
  try {
    const raw = LS.getItem(KEY);
    if (raw) { const p = JSON.parse(raw); if (p && p.v === 1) state = Object.assign(blank(), p, { settings: Object.assign(blank().settings, p.settings) }); }
  } catch (e) { console.error('load failed', e); }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { LS.setItem(KEY, JSON.stringify(state)); }
      catch (e) { console.error('save failed', e); }
    }, 120);
  }
  function emit(what) { save(); for (const fn of listeners) fn(what); }

  const S = {
    Engine, SEED,
    get state() { return state; },
    on(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    /* ---- session & auth ---- */
    get me() { return state.session ? (state.session.role === 'owner' ? { id: 'owner', name: state.settings.ownerName || 'Patron', role: 'owner' } : state.employees.find(e => e.id === state.session.userId)) : null; },
    get isOwner() { return state.session?.role === 'owner'; },
    async loginOwner(pin) {
      const ok = state.settings.ownerPinHash === await hashPin(pin, state.settings.ownerPinSalt);
      if (ok) { state.session = { userId: 'owner', role: 'owner' }; emit('session'); }
      return ok;
    },
    async loginEmployee(empId, pin) {
      const emp = state.employees.find(e => e.id === empId && e.active);
      if (!emp) return false;
      if (state.settings.requireStaffPin && emp.pinHash) {
        if (emp.pinHash !== await hashPin(pin, emp.pinSalt)) return false;
      }
      state.session = { userId: empId, role: 'employee' }; emit('session');
      return true;
    },
    logout() { state.session = null; emit('session'); },

    /* ---- helpers ---- */
    todayBd() { return Engine.bdOf(new Date(), state.settings.cutoffHour); },
    item(id) { return state.items.find(i => i.id === id); },
    cat(id) { return state.categories.find(c => c.id === id); },
    catName(c) { return state.settings.lang === 'en' ? c.nameEn : c.nameFr; },
    stock(itemId) { return Engine.expected(state, itemId, this.todayBd()); },
    activeItems() { return state.items.filter(i => i.active).sort((a, b) => a.sort - b.sort); },
    isLow(itemId) { const it = this.item(itemId); return it && this.stock(itemId) <= it.threshold; },
    lowItems() { return this.activeItems().filter(i => this.stock(i.id) <= i.threshold); },

    audit(action, entity, entityId, before, after) {
      state.audit.unshift({ at: new Date().toISOString(), actor: this.me?.name || 'system', action, entity, entityId, before: before ?? null, after: after ?? null });
      if (state.audit.length > 600) state.audit.length = 600;
    },
    notify(type, payload) {
      const bd = this.todayBd();
      if (type === 'low' && state.notifs.some(n => n.type === 'low' && n.bd === bd && n.payload.itemId === payload.itemId)) return; // debounce: 1/item/day
      state.notifs.unshift({ id: uid(), type, at: new Date().toISOString(), bd, read: false, payload });
      if (state.notifs.length > 120) state.notifs.length = 120;
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && typeof window !== 'undefined' && window.__notifText) {
        try { new Notification(state.settings.barName || 'BarTally', { body: window.__notifText(type, payload), tag: type + (payload.itemId || '') }); } catch (e) {}
      }
    },
    checkLow(itemId) {
      const it = this.item(itemId);
      if (it && it.active && this.stock(itemId) <= it.threshold) this.notify('low', { itemId, qty: this.stock(itemId), unit: it.unit });
    },

    /* ---- staff + owner actions ---- */
    logSale(itemId, qty) {
      if (!state.session) return null;
      const e = { id: uid(), itemId, qty, bd: this.todayBd(), at: new Date().toISOString(), by: this.me.name, byId: state.session.userId, voidedAt: null, voidedBy: null };
      state.sales.unshift(e);
      state.recents = [itemId, ...state.recents.filter(r => r !== itemId)].slice(0, 8);
      this.checkLow(itemId);
      emit('sales');
      return e;
    },
    /** staff undo: only own entry, only within grace window (UI enforces 6s); recorded as void */
    undoSale(saleId) {
      const e = state.sales.find(s => s.id === saleId);
      if (!e || e.voidedAt) return false;
      if (!this.isOwner && e.byId !== state.session?.userId) return false;
      e.voidedAt = new Date().toISOString(); e.voidedBy = this.me.name;
      this.audit('void_sale', 'sale', saleId, { qty: e.qty, itemId: e.itemId }, null);
      emit('sales');
      return true;
    },
    voidSale(saleId) {
      if (!this.isOwner) return false;
      return this.undoSale(saleId);
    },
    logRestock(itemId, qty) {
      if (!this.isOwner) return null;
      const e = { id: uid(), itemId, qty, bd: this.todayBd(), at: new Date().toISOString(), by: this.me.name };
      state.restocks.unshift(e);
      this.audit('restock', 'restock', e.id, null, { itemId, qty });
      emit('restocks');
      return e;
    },
    logWaste(itemId, qty, reason) {
      if (!this.isOwner) return null;
      const e = { id: uid(), itemId, qty, reason: reason || '', bd: this.todayBd(), at: new Date().toISOString(), by: this.me.name };
      state.waste.unshift(e);
      this.audit('waste', 'waste', e.id, null, { itemId, qty, reason });
      this.checkLow(itemId);
      emit('waste');
      return e;
    },

    /* ---- counts ---- */
    openCount() {
      if (!this.isOwner) return null;
      let c = state.counts.find(c => c.status === 'open');
      if (c) return c;
      const bd = this.todayBd();
      c = { id: uid(), bd, status: 'open', startedAt: new Date().toISOString(), closedAt: null, closedBy: null, lines: [] };
      state.counts.push(c);
      emit('counts');
      return c;
    },
    countExpected(itemId, bd) { return Engine.expected(state, itemId, bd, { strictlyBefore: true }); },
    setCountLine(countId, itemId, counted, note) {
      const c = state.counts.find(x => x.id === countId);
      if (!c || c.status !== 'open' || !this.isOwner) return;
      const expected = this.countExpected(itemId, c.bd);
      const variance = Math.round((counted - expected) * 100) / 100;
      const i = c.lines.findIndex(l => l.itemId === itemId);
      const line = { itemId, expected, counted, variance, note: note ?? (i >= 0 ? c.lines[i].note : '') };
      if (i >= 0) c.lines[i] = line; else c.lines.push(line);
      emit('counts');
    },
    setCountNote(countId, itemId, note) {
      const c = state.counts.find(x => x.id === countId);
      const l = c?.lines.find(l => l.itemId === itemId);
      if (l) { l.note = note; emit('counts'); }
    },
    closeCount(countId) {
      const c = state.counts.find(x => x.id === countId);
      if (!c || c.status !== 'open' || !this.isOwner) return null;
      // uncounted active items keep expected value (variance 0)
      for (const it of this.activeItems()) {
        if (!c.lines.some(l => l.itemId === it.id)) {
          const expected = this.countExpected(it.id, c.bd);
          c.lines.push({ itemId: it.id, expected, counted: expected, variance: 0, note: '', autofilled: true });
        }
      }
      c.status = 'closed'; c.closedAt = new Date().toISOString(); c.closedBy = this.me.name;
      this.audit('close_count', 'count', c.id, null, { bd: c.bd, lines: c.lines.length });
      const issues = c.lines.filter(l => Math.abs(l.variance) >= state.settings.varThreshold || l.variance !== 0);
      const big = c.lines.filter(l => Math.abs(l.variance) >= state.settings.varThreshold);
      if (issues.length) {
        const top = [...issues].sort((a, b) => Math.abs(b.variance) - Math.abs(a.variance))[0];
        const it = this.item(top.itemId);
        this.notify('variance', { n: issues.length, big: big.length, top: `${it?.name} ${top.variance > 0 ? '+' : ''}${top.variance}` });
      }
      for (const it of this.activeItems()) this.checkLow(it.id);
      emit('counts');
      return c;
    },
    reopenCount(countId) {
      const c = state.counts.find(x => x.id === countId);
      if (!c || c.status !== 'closed' || !this.isOwner || c.isOpening) return false;
      c.status = 'open'; this.audit('reopen_count', 'count', c.id, { closedAt: c.closedAt }, null);
      c.closedAt = null; c.closedBy = null;
      emit('counts');
      return true;
    },
    closedCounts() { return state.counts.filter(c => c.status === 'closed' && !c.isOpening).sort((a, b) => a.bd < b.bd ? 1 : -1); },

    /* ---- items & categories (owner) ---- */
    saveItem(data) {
      if (!this.isOwner) return null;
      if (data.id) {
        const it = this.item(data.id); const before = { ...it };
        Object.assign(it, data);
        this.audit('edit_item', 'item', it.id, { name: before.name, threshold: before.threshold, cost: before.cost }, { name: it.name, threshold: it.threshold, cost: it.cost });
        emit('items'); return it;
      }
      const it = { id: uid(), catId: data.catId, name: data.name, unit: data.unit || 'bouteille', allowDecimal: !!data.allowDecimal, threshold: data.threshold ?? 6, art: data.art || 'wine', tint: data.tint || { g: '#3B1420', l: '#E2D5BD' }, photo: data.photo || null, barcode: data.barcode || null, pinned: !!data.pinned, cost: data.cost ?? null, active: true, sort: state.items.length };
      state.items.push(it);
      this.audit('add_item', 'item', it.id, null, { name: it.name });
      emit('items'); return it;
    },
    findByBarcode(code) { return state.items.find(i => i.barcode === code && i.active); },

    /* ---- employees (owner) ---- */
    async addEmployee(name, pin) {
      if (!this.isOwner) return null;
      const emp = { id: uid(), name, active: true, pinHash: null, pinSalt: null };
      if (pin) { emp.pinSalt = uid(); emp.pinHash = await hashPin(pin, emp.pinSalt); }
      state.employees.push(emp);
      this.audit('add_employee', 'employee', emp.id, null, { name });
      emit('employees'); return emp;
    },
    async setEmployeePin(empId, pin) {
      if (!this.isOwner) return;
      const emp = state.employees.find(e => e.id === empId);
      if (!emp) return;
      emp.pinSalt = uid(); emp.pinHash = await hashPin(pin, emp.pinSalt);
      this.audit('reset_pin', 'employee', empId, null, null);
      emit('employees');
    },
    setEmployeeActive(empId, active) {
      if (!this.isOwner) return;
      const emp = state.employees.find(e => e.id === empId);
      if (emp) { emp.active = active; this.audit(active ? 'reactivate_employee' : 'deactivate_employee', 'employee', empId, null, null); emit('employees'); }
    },
    async setOwnerPin(pin) {
      state.settings.ownerPinSalt = uid();
      state.settings.ownerPinHash = await hashPin(pin, state.settings.ownerPinSalt);
      this.audit('change_owner_pin', 'settings', 'owner', null, null);
      emit('settings');
    },

    /* ---- settings & data ---- */
    setSettings(patch) {
      const before = { ...state.settings };
      Object.assign(state.settings, patch);
      if (state.session?.role === 'owner' || !state.settings.setupDone) this.audit('settings', 'settings', 'app', null, Object.keys(patch).join(','));
      if (patch.lang) I18N.lang = patch.lang;
      emit('settings');
    },
    markNotifsRead() { for (const n of state.notifs) n.read = true; emit('notifs'); },
    exportJSON() { return JSON.stringify(state, null, 1); },
    importJSON(json) {
      const p = JSON.parse(json);
      if (!p || p.v !== 1 || !Array.isArray(p.items)) throw new Error('bad backup');
      state = Object.assign(blank(), p, { settings: Object.assign(blank().settings, p.settings) });
      state.session = null;
      emit('all');
    },
    resetAll() { state = blank(); LS.removeItem(KEY); emit('all'); },

    /* ---- setup ---- */
    async setupReal({ barName, ownerName, pin, employees, opening }) {
      state = blank();
      state.categories = JSON.parse(JSON.stringify(SEED.categories));
      state.items = SEED.build();
      state.settings.barName = barName; state.settings.ownerName = ownerName || 'Patron';
      await this.setOwnerPin(pin);
      for (const name of employees) await this.addEmployeeRaw(name);
      // opening stock = closed baseline count dated yesterday-bd so today's entries apply on top
      const bd = Engine.addDays(this.todayBd(), -1);
      const c = { id: uid(), bd, status: 'closed', isOpening: true, startedAt: new Date().toISOString(), closedAt: new Date().toISOString(), closedBy: ownerName || 'Patron', lines: [] };
      for (const it of state.items) {
        const q = opening[it.id] ?? 0;
        c.lines.push({ itemId: it.id, expected: q, counted: q, variance: 0, note: '' });
      }
      state.counts.push(c);
      state.settings.setupDone = true; state.settings.demoMode = false;
      state.session = { userId: 'owner', role: 'owner' };
      this.audit('setup', 'settings', 'app', null, { items: state.items.length });
      emit('all');
    },
    async addEmployeeRaw(name) {
      const emp = { id: uid(), name, active: true, pinHash: null, pinSalt: null };
      state.employees.push(emp); return emp;
    },
    async setupDemo() {
      state = blank();
      state.categories = JSON.parse(JSON.stringify(SEED.categories));
      state.items = SEED.build();
      state.settings.barName = 'Le Comptoir'; state.settings.ownerName = 'Karim';
      state.settings.demoMode = true; state.settings.setupDone = true;
      await this.setOwnerPin('1234');
      const y = await this.addEmployeeRaw('Yassine');
      const s = await this.addEmployeeRaw('Sarah');
      seedDemoHistory(state, [y, s]);
      state.session = { userId: 'owner', role: 'owner' };
      emit('all');
    },
  };

  /* deterministic demo history: 14 closed days + today's open activity */
  function seedDemoHistory(st, emps) {
    let rs = 42;
    const rnd = () => (rs = (rs * 1103515245 + 12345) % 2147483648) / 2147483648;
    const today = S.todayBd();
    const start = Engine.addDays(today, -14);
    const stockNow = {}; // running physical stock
    const popular = { Heineken: 26, 'Spécial': 30, Casablanca: 18, 'Spécial Gold': 10, Budweiser: 8, 'Smirnoff Ice': 6, 'Red Bull': 14, Soda: 12, 'Black Label': 7, 'Red Label': 5, Absolut: 4, "Jack Daniel's": 4, Ricard: 6, 'Jägermeister': 3, "Gordon's" : 3, Belvedere: 2, Agavita: 2, Cognac: 1.5, 'Martini Blanc': 2, Champagne: 0.4, Fromage: 5, 'Viande Hachée': 4, Foie: 3, Cervelle: 2, 'Pizza V/H': 6 };
    for (const it of st.items) {
      const base = it.catId === 'biere' ? 90 : it.catId === 'spirit' ? 6 : it.catId === 'cuisine' ? 25 : it.catId === 'champ' ? 5 : 14;
      stockNow[it.id] = base;
    }
    // opening baseline
    st.counts.push({ id: uid(), bd: Engine.addDays(start, -1), status: 'closed', isOpening: true, startedAt: '', closedAt: new Date(Date.now() - 15 * 864e5).toISOString(), closedBy: 'Karim', lines: st.items.map(it => ({ itemId: it.id, expected: stockNow[it.id], counted: stockNow[it.id], variance: 0, note: '' })) });
    const mkAt = (bd, h, m) => { const [Y, M, D] = bd.split('-').map(Number); const d = new Date(Y, M - 1, D, h, m); if (h < 6) d.setDate(d.getDate() + 1); return d.toISOString(); };
    for (let d = 0; d < 14; d++) {
      const bd = Engine.addDays(start, d);
      const dow = new Date(bd + 'T12:00').getDay();
      const busy = (dow === 5 || dow === 6) ? 1.5 : dow === 0 ? 1.15 : 1;
      // sales
      for (const it of st.items) {
        const p = popular[it.name] ?? (it.catId === 'rouge' ? 2.2 : it.catId === 'blanc' ? 1.4 : it.catId === 'rose' ? 1.2 : it.catId === 'demi' ? 0.9 : 1);
        let want = Math.round(p * busy * (0.6 + rnd() * 0.8) * 10) / 10;
        let n = it.allowDecimal ? Math.round(want) : Math.round(want);
        n = Math.min(n, Math.floor(stockNow[it.id] * 0.7));
        let logged = 0;
        while (logged < n) {
          const q = Math.min(n - logged, 1 + Math.floor(rnd() * 2));
          const emp = emps[Math.floor(rnd() * emps.length)];
          const hour = 18 + Math.floor(rnd() * 10); // 18h → 03h
          st.sales.push({ id: uid(), itemId: it.id, qty: q, bd, at: mkAt(bd, hour % 24, Math.floor(rnd() * 60)), by: emp.name, byId: emp.id, voidedAt: null, voidedBy: null });
          logged += q; stockNow[it.id] -= q;
        }
      }
      // deliveries: top-up model so shelves stay realistic; a few items deliberately
      // run low at the end (the low-stock story on the dashboard)
      const lowStory = ['Casablanca', 'Champagne', 'Ricard'];
      if (d === 4 || d === 9 || d === 12) {
        for (const it of st.items) {
          if (d === 12 && lowStory.includes(it.name)) continue;
          let q = 0;
          if (it.catId === 'biere' && stockNow[it.id] < 70) q = Math.ceil((110 - stockNow[it.id]) / 24) * 24;
          else if (it.catId === 'spirit' && stockNow[it.id] < 3.5) q = 6;
          else if (it.catId === 'cuisine' && stockNow[it.id] < 14) q = 20;
          else if ((it.catId === 'rouge' || it.catId === 'blanc' || it.catId === 'rose' || it.catId === 'demi') && stockNow[it.id] < it.threshold * 2) q = 12;
          else if (it.catId === 'champ' && stockNow[it.id] < 3) q = 4;
          if (q > 0) {
            st.restocks.push({ id: uid(), itemId: it.id, qty: q, bd, at: mkAt(bd, 16, Math.floor(rnd() * 50)), by: 'Karim' });
            stockNow[it.id] += q;
          }
        }
      }
      // one waste event
      if (d === 6) {
        const hei = st.items.find(i => i.name === 'Heineken');
        st.waste.push({ id: uid(), itemId: hei.id, qty: 2, reason: 'Casse — 2 bouteilles tombées', bd, at: mkAt(bd, 22, 40), by: 'Karim' });
        stockNow[hei.id] -= 2;
      }
      // shrink: unexplained losses on some days (the story the app catches)
      const shrinkPlan = { 3: [['Black Label', 0.5]], 7: [['Heineken', 2]], 10: [['Heineken', 3], ['Red Label', 0.5]], 12: [['Black Label', 1]], 13: [['Heineken', 2], ['Black Label', 0.5]] };
      for (const [nm, q] of (shrinkPlan[d] || [])) {
        const it = st.items.find(i => i.name === nm);
        stockNow[it.id] -= q; // vanished without a log entry → shows as negative variance
      }
      // close the day
      const lines = st.items.map(it => {
        const expected = Engine.expected(st, it.id, bd, { strictlyBefore: true });
        const counted = Math.round(stockNow[it.id] * 100) / 100;
        const v = Math.round((counted - expected) * 100) / 100;
        const notes = { Heineken: 'À surveiller — écart répété', 'Black Label': 'Vérifier le doseur' };
        return { itemId: it.id, expected, counted, variance: v, note: v < -1 ? (notes[it.name] || '') : '' };
      });
      st.counts.push({ id: uid(), bd, status: 'closed', startedAt: mkAt(bd, 4, 0), closedAt: mkAt(bd, 4, 30), closedBy: 'Karim', lines });
    }
    // today's open activity: a few live sales
    const liveSales = [['Heineken', 2, 'Yassine'], ['Spécial', 3, 'Sarah'], ['Red Bull', 1, 'Yassine'], ['Black Label', 1, 'Sarah'], ['Casablanca', 2, 'Yassine']];
    let mins = 0;
    for (const [nm, q, who] of liveSales) {
      const it = st.items.find(i => i.name === nm);
      if (stockNow[it.id] < q + 1) continue; // never oversell the demo shelves
      const emp = emps.find(e => e.name === who);
      st.sales.push({ id: uid(), itemId: it.id, qty: q, bd: today, at: new Date(Date.now() - (50 - mins) * 60000).toISOString(), by: emp.name, byId: emp.id, voidedAt: null, voidedBy: null });
      stockNow[it.id] -= q;
      mins += 10;
    }
    st.recents = liveSales.map(([nm]) => st.items.find(i => i.name === nm).id).reverse();
  }

  return S;
})();

if (typeof module !== 'undefined' && module.exports) module.exports = { Engine, SEED, Store };

/* == 12-ui.js == */
/* ============ BarTally UI kit — router, components, icons, item art, scanner, exports ============ */
const UI = (() => {
  const screens = {};
  let current = null, currentParams = {};
  let gradSeq = 0;

  /* ---------- utils ---------- */
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };

  /* ---------- toast ---------- */

    if (!toastWrap) { toastWrap = el('<div class="toasts"></div>'); document.body.appendChild(toastWrap); }

  /* ---------- sheet / confirm ---------- */
  const sheetStack = [];
  function sheet(contentEl, opts = {}) {
    const wrap = el(`<div class="sheet-wrap"><div class="sheet-wrap__bg"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet__grip"></div></div></div>`);
    const body = wrap.querySelector('.sheet');

    else body.appendChild(contentEl);
    document.body.appendChild(wrap);
    history.pushState({ sheet: true }, '');
    let closed = false;
    const close = (viaPop) => {
      if (closed) return; closed = true;
      sheetStack.splice(sheetStack.indexOf(close), 1);
      body.classList.add('is-closing'); wrap.querySelector('.sheet-wrap__bg').classList.add('is-closing');
      setTimeout(() => wrap.remove(), 210);
      if (!viaPop && history.state?.sheet) history.back();
      opts.onClose && opts.onClose();
    };
    wrap.querySelector('.sheet-wrap__bg').addEventListener('click', () => close());
    sheetStack.push(close);

  /* ---------- numpad ---------- */
  function numpad(container, { decimal = false, onKey }) {
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', decimal ? (I18N.lang === 'fr' ? ',' : '.') : '', '0', '⌫'];
    const np = el(`<div class="numpad">${keys.map(k => k === '' ? '<span></span>' : `<button type="button" data-k="${k === ',' || k === '.' ? 'dot' : k === '⌫' ? 'del' : k}">${k}</button>`).join('')}</div>`);
    np.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;

    container.appendChild(np);

  /* ---------- progress ring ---------- */
  function ring(pct, label) {
    const r = 26, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, Math.max(0, pct)));
    return `<div class="ring"><svg viewBox="0 0 64 64" width="64" height="64">
      <defs><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7C14B"/><stop offset="1" stop-color="#E8940A"/></linearGradient></defs>

  }

  /* ---------- barcode scanning ---------- */
  const canScan = 'BarcodeDetector' in window && !!navigator.mediaDevices?.getUserMedia;
  async function scan({ onCode }) {
    const c = el(`<div><h2 style="font-size:18px;margin-bottom:12px">${esc(t('sell.scan'))}</h2>
      <div style="position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4">
        <video autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
        <div style="position:absolute;inset:0;border:2px solid rgba(245,166,35,.6);border-radius:16px;margin:14%;pointer-events:none"></div>
      </div>
      <div class="field mt4"><label>${esc(t('inv.barcode'))}</label><input type="text" inputmode="numeric" placeholder="0000000000000"></div>
      <button class="btn btn--gold btn--full" data-a="manual">${esc(t('g.confirm'))}</button></div>`);
    const s = sheet(c, { onClose: stop });
    const video = c.querySelector('video');
    let stream = null, timer = null;
    function stop() { clearInterval(timer); stream?.getTracks().forEach(tk => tk.stop()); }
    c.querySelector('[data-a=manual]').addEventListener('click', () => {
      const v = c.querySelector('input').value.trim();
      if (v) { onCode(v); s.close(); }
    });
    if (canScan) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'qr_code'] });
        timer = setInterval(async () => {
          try {
            const codes = await det.detect(video);
            if (codes.length) { haptic('success'); onCode(codes[0].rawValue); stop(); s.close(); }
          } catch (e) {}
        }, 300);
      } catch (e) { video.parentElement.style.display = 'none'; }
    } else { video.parentElement.style.display = 'none'; }
    return s;
  }

  /* ---------- image pick + compress ---------- */
  function pickImage({ capture } = {}) {
    return new Promise(res => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      if (capture) inp.capture = 'environment';
      inp.addEventListener('change', () => {
        const f = inp.files[0]; if (!f) return res(null);
        const img = new Image();
        img.onload = () => {
          const max = 512, k = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          res(cv.toDataURL('image/jpeg', .72));
        };
        img.src = URL.createObjectURL(f);
      });
      inp.click();
    });
  }

  /* ---------- exports ---------- */
  function download(filename, content, mime) {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }
  function csv(rows, filename) {
    const sep = ';';
    const body = rows.map(r => r.map(v => {
      let s = String(v ?? '');
      if (/[";\n]/.test(s)) s = '"' + s.replaceAll('"', '""') + '"';
      return s;
    }).join(sep)).join('\r\n');
    download(filename, '﻿sep=;\r\n' + body, 'text/csv;charset=utf-8');
  }
  function printHTML(title, bodyHtml) {
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);
    f.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title>
      <style>
        body{font-family:Segoe UI,system-ui,sans-serif;color:#151519;margin:32px;font-size:13px}
        h1{font-size:20px;margin:0 0 2px} .sub{color:#777;font-size:12px;margin-bottom:18px}
        table{width:100%;border-collapse:collapse;margin:10px 0 22px}
        th{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#888;text-align:left;padding:6px 8px;border-bottom:2px solid #e8c87a}
        td{padding:6px 8px;border-bottom:1px solid #eee;font-variant-numeric:tabular-nums}
        .neg{color:#C0392B;font-weight:600}.pos{color:#1E8E5A}
        .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding-bottom:14px;border-bottom:3px solid #F5A623}
        .brand b{font-size:16px} h2{font-size:14px;margin:18px 0 4px}
        .kpis{display:flex;gap:26px;margin:14px 0}.kpis div b{display:block;font-size:19px}
        .kpis div span{font-size:11px;color:#888}
      </style></head><body>
      <div class="brand"><svg width="34" height="34" viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#14141B"/><g stroke="#EDEDF2" stroke-width="3.2" stroke-linecap="round"><path d="M14 14v20M21 14v20M28 14v20M35 14v20"/></g><path d="M10 31 39 17" stroke="#F5A623" stroke-width="3.6" stroke-linecap="round"/></svg>
      <div><b>${esc(Store.state.settings.barName || 'BarTally')}</b><div style="color:#999;font-size:11px">${esc(title)}</div></div></div>
      ${bodyHtml}</body></html>`;
    f.addEventListener('load', () => setTimeout(() => { f.contentWindow.print(); setTimeout(() => f.remove(), 2000); }, 150));
  }

  /* ---------- router / shell ---------- */
  function registerScreen(def) { screens[def.id] = def; }
  function go(id, params = {}) {
    if (!screens[id]) return console.error('no screen', id);
    current = id; currentParams = params;
    render();
    window.scrollTo({ top: 0 });
  }
  function refresh() { if (current) render(); }
  function render() {
    const root = document.getElementById('app');
    const def = screens[current];
    root.innerHTML = '';
    const wrap = el(`<div class="screen ${def.bare ? 'screen--bare' : ''}" data-screen="${def.id}"></div>`);
    root.appendChild(wrap);
    def.render(wrap, currentParams);
    if (!def.bare) renderTabs(root);
  }
  function renderTabs(root) {
    const owner = Store.isOwner;
    const tabs = owner
      ? [['dashboard', 'home', 'tab.home'], ['sell', 'sell', 'tab.sell'], ['count', 'count', 'tab.count'], ['inventory', 'stock', 'tab.stock'], ['more', 'more', 'tab.more']]
      : [['sell', 'sell', 'tab.sell']];
    if (!owner) return; // staff: single screen, no tab chrome
    const bar = el(`<nav class="tabbar" aria-label="Navigation">${tabs.map(([id, ic, key]) =>
      `<button class="tabbar__btn ${current === id ? 'is-on' : ''}" data-go="${id}">${icon(ic)}<span>${esc(t(key))}</span></button>`).join('')}</nav>`);
    bar.addEventListener('click', e => {
      const b = e.target.closest('[data-go]'); if (!b) return;
      haptic('light'); go(b.dataset.go);
    });
    root.appendChild(bar);
  }
  window.addEventListener('popstate', () => {
    if (sheetStack.length) { sheetStack[sheetStack.length - 1](true); }
  });

  /* header helper */
  function header(title, sub, actionsHtml) {
    return `<header class="apphead">
      <div class="apphead__titles"><h1 class="apphead__title">${esc(title)}</h1>${sub ? `<div class="apphead__sub">${esc(sub)}</div>` : ''}</div>
      ${actionsHtml || ''}</header>`;
  }

  return {
    esc, el, t, icon, art, logoMark, toast, sheet, confirm: confirmBox, numpad, ring,
    canScan, scan, pickImage, download, csv, printHTML,
    fmtQty, fmtDate, fmtTime, money, haptic,
    registerScreen, go, refresh, header,
    get current() { return current; }, get params() { return currentParams; },
  };
})();

  if (type === 'variance') return t('ntf.variance', { n: p.n, top: p.top });
  if (type === 'reminder') return t('ntf.countReminder', { date: p.date });
  return '';
};

        <div class="wz-addrow">
          <input type="text" data-f="empName" autocomplete="off" enterkeyhint="done" placeholder="${esc(t('wiz.staffNamePh'))}" value="${esc(W.empName)}">
          <button class="btn btn--ghost" data-a="addEmp" aria-label="${esc(t('wiz.staffAdd'))}">${UI.icon('plus')}</button>
        </div>
        <div class="wz-next"><button class="btn btn--gold btn--big btn--full" data-a="next">${esc(t('g.next'))}</button></div>`;
    } else if (W.step === 4) {
      W.items = W.items || Store.SEED.build();
      const cats = [...Store.SEED.categories].sort((a, b) => a.sort - b.sort);
      const groups = cats.map(c => {
        const its = W.items.filter(i => i.catId === c.id);
        if (!its.length) return '';
        return `
          <div class="wz-cathead"><i style="background:${c.hex}"></i><span class="eyebrow">${esc(I18N.lang === 'en' ? c.nameEn : c.nameFr)}</span></div>
          ${its.map(it => `
            <div class="row">
              <div class="row__art">${UI.art(it)}</div>
              <div class="row__body"><div class="row__t">${esc(it.name)}</div><div class="row__s">${esc(t('u.' + it.unit))}</div></div>
              <input class="wz-qty num" type="text" inputmode="${it.allowDecimal ? 'decimal' : 'numeric'}" placeholder="0" data-item="${it.id}" value="${esc(W.opening[it.id] ?? '')}" aria-label="${esc(it.name)}">
            </div>`).join('')}`;
      }).join('');
      body = `
        <h2>${esc(t('wiz.stock'))}</h2>
        <p class="wz-sub">${esc(t('wiz.stockHint'))}</p>
        ${groups}
        <div class="wz-next"><button class="btn btn--gold btn--big btn--full" data-a="next">${esc(t('g.next'))}</button></div>`;
    } else {
      W.items = W.items || Store.SEED.build();
      const opening = collectOpening();
      const filled = W.items.filter(it => opening[it.id] > 0).length;
      const rows = [
        [t('wiz.barName'), W.barName.trim()],
        [t('wiz.ownerName'), W.ownerName.trim() || t('g.owner')],
        [t('wiz.staff'), I18N.plural('wiz.sumTeam', W.employees.length)],
        [t('wiz.stock'), I18N.plural('wiz.sumStock', filled)],
      ];
      body = `
        <div class="wz-done">
          <div class="wz-check">${UI.icon('check')}</div>
          <h2>${esc(t('wiz.ready'))}</h2>
          <p class="wz-sub">${esc(t('wiz.readySub'))}</p>
          <div class="card">${rows.map(([l, v]) => `<div class="wz-sumrow"><span>${esc(l)}</span><b>${esc(v)}</b></div>`).join('')}</div>
          <div class="wz-next"><button class="btn btn--gold btn--big btn--full" data-a="finish">${esc(t('wiz.finish'))}</button></div>
        </div>`;
    }

    view.innerHTML = wizTop() + `<div class="wz-body" data-step="${W.step}">${body}</div>`;
    if (W.step === 2) UI.numpad(view.querySelector('[data-np]'), { decimal: false, onKey: k => onWizPin(k, view, el) });

    view.addEventListener('click', e => {
      const rm = e.target.closest('[data-rm]');
      if (rm) { W.employees.splice(+rm.dataset.rm, 1); UI.haptic('light'); paintWelcome(el); return; }
      const b = e.target.closest('[data-a]');
      if (!b) return;
      const a = b.dataset.a;
      if (a === 'back') wizBack(el);
      else if (a === 'next') wizNext(el);
      else if (a === 'addEmp') addEmp(view, el);
      else if (a === 'finish') finishSetup(b, el);
    });
    view.addEventListener('input', e => {
      const f = e.target.dataset.f;
      if (f) {
        W[f] = e.target.value;
        if (f === 'barName') { const nb = view.querySelector('[data-a=next]'); if (nb) nb.disabled = !W.barName.trim(); }
      }
      const id = e.target.dataset.item;
      if (id) {
        const clean = e.target.value.replace(/[^\d.,]/g, '');
        if (clean !== e.target.value) e.target.value = clean;
        W.opening[id] = clean;
      }
    });
    view.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const f = e.target.dataset.f;
      if ((f === 'barName' || f === 'ownerName') && W.barName.trim()) wizNext(el);
      else if (f === 'empName') addEmp(view, el);
      else if (e.target.dataset.item) e.target.blur();
    });
  }

  function wizNext(el) {
    UI.haptic('light');
    if (W.step === 1) {
      if (!W.barName.trim()) return;
      W.step = 2; W.pinPhase = 'set'; W.pin1 = ''; W.pinEntry = ''; W.pinErr = '';
    } else if (W.step === 3) W.step = 4;
    else if (W.step === 4) W.step = 5;
    paintWelcome(el);
  }

  function wizBack(el) {
    UI.haptic('light');
    if (W.step === 2) {
      if (W.pinPhase === 'confirm') W.pinPhase = 'set';
      else W.step = 1;
      W.pin1 = ''; W.pinEntry = ''; W.pinErr = '';
    } else if (W.step > 0) {
      W.step -= 1;
      if (W.step === 2) { W.pinPhase = 'set'; W.pin1 = ''; W.pinEntry = ''; W.pinErr = ''; }
    }
    paintWelcome(el);
  }

  function onWizPin(k, view, el) {
    if (W.busy) return;
    if (k === 'del') W.pinEntry = W.pinEntry.slice(0, -1);
    else if (/^\d$/.test(k) && W.pinEntry.length < 4) W.pinEntry += k;
    else return;
    if (W.pinErr) {
      W.pinErr = '';
      const er = view.querySelector('[data-err]');
      if (er) { er.classList.remove('is-err'); er.textContent = ''; }
    }
    const dots = view.querySelector('[data-dots]');
    if (dots) dots.querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i < W.pinEntry.length));
    if (W.pinEntry.length < 4) return;
    W.busy = true;
    setTimeout(() => {
      if (W.pinPhase === 'set') {
        W.busy = false;
        W.pin1 = W.pinEntry; W.pinPhase = 'confirm'; W.pinEntry = '';
        paintWelcome(el);
      } else if (W.pinEntry === W.pin1) {
        W.busy = false;
        W.pin = W.pinEntry;
        UI.haptic('success');
        W.step = 3;
        paintWelcome(el);
      } else {
        UI.haptic('warn');
        W.pinErr = t('wiz.pinMismatch');
        if (dots && dots.isConnected) {
          dots.classList.add('shake');
          const er = view.querySelector('[data-err]');
          if (er) { er.textContent = W.pinErr; er.classList.add('is-err'); }
        }
        setTimeout(() => {
          W.busy = false;
          W.pinPhase = 'set'; W.pin1 = ''; W.pinEntry = '';
          paintWelcome(el);
        }, 650);
      }
    }, 160);
  }

  function addEmp(view, el) {
    const inp = view.querySelector('[data-f=empName]');
    const name = (inp ? inp.value : W.empName).trim();
    if (!name) { if (inp) inp.focus(); return; }
    W.employees.push(name);
    W.empName = '';
    UI.haptic('light');
    paintWelcome(el);
    const ninp = el.querySelector('[data-f=empName]');
    if (ninp) ninp.focus();
  }

  async function finishSetup(btn, el) {
    if (W.busy) return;
    if (!W.pin || W.pin.length !== 4) { // safety net: PIN somehow missing → back to PIN step
      W.step = 2; W.pinPhase = 'set'; W.pin1 = ''; W.pinEntry = ''; W.pinErr = '';
      paintWelcome(el);
      return;
    }
    W.busy = true;
    btn.disabled = true;
    btn.innerHTML = `<span class="bt-spin"></span>${esc(t('g.loading'))}`;
    try {
      W.items = W.items || Store.SEED.build();
      await Store.setupReal({
        barName: W.barName.trim(),
        ownerName: W.ownerName.trim(),
        pin: W.pin,
        employees: W.employees.map(n => n.trim()).filter(Boolean),
        opening: collectOpening(),
      }); // emits 'all' → App.route() takes over
      UI.haptic('success');
      UI.toast(t('wiz.openingSaved'), { type: 'ok' });
      resetW();
    } catch (err) {
      W.busy = false;
      UI.toast(t('g.error'), { type: 'danger' });
      paintWelcome(el);
    }
  }

  UI.registerScreen({ id: 'welcome', bare: true, render(el) { paintWelcome(el); } });

  /* ================================================================
     LOGIN — daily unlock: user grid → PIN pad */
  const L = { view: 'grid', target: null, pin: '', busy: false };
  function resetL() { L.view = 'grid'; L.target = null; L.pin = ''; L.busy = false; }

  function paintLogin(el) {
    el.innerHTML = '';
    if (L.view === 'pin' && L.target && L.target.type === 'emp') {
      const emp = Store.state.employees.find(x => x.id === L.target.id && x.active);
      if (!emp) resetL(); // employee deactivated meanwhile → back to grid
    }
    const view = UI.el('<div class="grow" style="display:flex;flex-direction:column"></div>');
    el.appendChild(view);
    if (L.view === 'grid') paintUserGrid(view, el);
    else paintPinPad(view, el);
  }

  function paintUserGrid(view, el) {
    const s = Store.state.settings;
    const emps = Store.state.employees.filter(e => e.active);
    const ownerName = s.ownerName || t('g.owner');
    view.innerHTML = `
      <header class="lg-head">
        ${UI.logoMark(56)}
        <h1 class="lg-bar">${esc(s.barName || 'BarTally')}</h1>
        <div class="lg-sub">${esc(t('login.title'))}</div>
      </header>
      <div class="lg-grid">
        <button class="lg-user lg-user--owner" data-owner style="--i:0">
          <span class="bt-ava bt-ava--gold bt-ava--big">${UI.icon('user')}</span>
          <span class="lg-owner-body"><span class="lg-name">${esc(ownerName)}</span></span>
          <span class="pill pill--gold">${esc(t('g.owner'))}</span>
        </button>
        ${emps.map((e2, i) => `
          <button class="lg-user" data-emp="${esc(e2.id)}" style="--i:${i + 1}">
            <span class="bt-ava bt-ava--big" style="background:${avaColor(e2.name)}">${esc(initials(e2.name))}</span>
            <span class="lg-name">${esc(e2.name)}</span>
          </button>`).join('')}
      </div>`;
    view.addEventListener('click', async e => {
      if (e.target.closest('[data-owner]')) {
        UI.haptic('light');
        L.view = 'pin'; L.target = { type: 'owner', name: Store.state.settings.ownerName || t('g.owner') }; L.pin = ''; L.busy = false;
        paintLogin(el);
        return;
      }
      const eb = e.target.closest('[data-emp]');
      if (!eb) return;
      const emp = Store.state.employees.find(x => x.id === eb.dataset.emp && x.active);
      if (!emp) return;
      UI.haptic('light');
      if (Store.state.settings.requireStaffPin && emp.pinHash) {
        L.view = 'pin'; L.target = { type: 'emp', id: emp.id, name: emp.name }; L.pin = ''; L.busy = false;
        paintLogin(el);
        return;
      }
      if (L.busy) return;
      L.busy = true;
      const ok = await Store.loginEmployee(emp.id); // emits 'session' → App.route()
      if (ok) { UI.haptic('success'); resetL(); }
      else { L.busy = false; UI.toast(t('g.error'), { type: 'danger' }); }
    });
  }

  function paintPinPad(view, el) {
    const isOwner = L.target.type === 'owner';
    const nDots = isOwner ? 4 : Math.min(6, Math.max(4, L.pin.length));
    view.innerHTML = `
      <div class="lg-topbar"><button class="iconbtn" data-a="back" aria-label="${esc(t('g.back'))}">${UI.icon('chevL')}</button></div>
      <div class="lg-pinwrap">
        <div class="lg-pinhead">
          ${isOwner
            ? `<span class="bt-ava bt-ava--gold bt-ava--big">${UI.icon('user')}</span><div class="lg-pin-name">${esc(L.target.name)}</div>`
            : `<span class="bt-ava bt-ava--big" style="background:${avaColor(L.target.name)}">${esc(initials(L.target.name))}</span>`}
          <div class="lg-pin-title">${esc(isOwner ? t('login.ownerPin') : t('login.staffPin', { name: L.target.name }))}</div>
        </div>
        ${dotsHtml(nDots, L.pin.length)}
        <div class="bt-perr" data-err aria-live="polite"></div>
        <div data-np></div>
        ${isOwner ? '' : `<button class="btn btn--gold btn--full mt3" data-a="pinok" ${L.pin.length >= 4 ? '' : 'disabled'}>${esc(t('g.confirm'))}</button>`}
      </div>`;
    UI.numpad(view.querySelector('[data-np]'), { decimal: false, onKey: k => onLoginKey(k, view, el) });
    view.addEventListener('click', e => {
      const b = e.target.closest('[data-a]');
      if (!b) return;
      if (b.dataset.a === 'back') { UI.haptic('light'); resetL(); paintLogin(el); }
      else if (b.dataset.a === 'pinok') submitPin(view, el);
    });
  }

  function refreshLoginDots(view) {
    const isOwner = L.target && L.target.type === 'owner';
    const nDots = isOwner ? 4 : Math.min(6, Math.max(4, L.pin.length));
    const dots = view.querySelector('[data-dots]');
    if (dots) dots.outerHTML = dotsHtml(nDots, L.pin.length);
  }

  function onLoginKey(k, view, el) {
    if (L.busy || !L.target) return;
    const isOwner = L.target.type === 'owner';
    const max = isOwner ? 4 : 6;
    if (k === 'del') L.pin = L.pin.slice(0, -1);
    else if (/^\d$/.test(k) && L.pin.length < max) L.pin += k;
    else return;
    const er = view.querySelector('[data-err]');
    if (er && er.classList.contains('is-err')) { er.classList.remove('is-err'); er.textContent = ''; }
    refreshLoginDots(view);
    const okBtn = view.querySelector('[data-a=pinok]');
    if (okBtn) okBtn.disabled = L.pin.length < 4;
    if ((isOwner && L.pin.length === 4) || (!isOwner && L.pin.length === 6)) submitPin(view, el);
  }

  async function submitPin(view, el) {
    if (L.busy || !L.target || L.pin.length < 4) return;
    L.busy = true;
    const okBtn = view.querySelector('[data-a=pinok]');
    if (okBtn) okBtn.disabled = true;
    let ok = false;
    try {
      ok = L.target.type === 'owner'
        ? await Store.loginOwner(L.pin)
        : await Store.loginEmployee(L.target.id, L.pin);
    } catch (e) { ok = false; }
    if (ok) { UI.haptic('success'); resetL(); return; } // 'session' event routes to the app
    L.busy = false;
    UI.haptic('warn');
    if (!view.isConnected) return;
    const dots = view.querySelector('[data-dots]');
    if (dots) dots.classList.add('shake');
    const er = view.querySelector('[data-err]');
    if (er) { er.textContent = t('login.pinWrong'); er.classList.add('is-err'); }
    setTimeout(() => {
      L.pin = '';
      if (!view.isConnected) return;
      refreshLoginDots(view);
      const ob = view.querySelector('[data-a=pinok]');
      if (ob) ob.disabled = true;
    }, 520);
  }

  UI.registerScreen({ id: 'login', bare: true, render(el) { paintLogin(el); } });
})();

/* == 21-screen-sell.js == */
/* ============ Sell screen — the 2-tap sale logger (both roles) ============ */
(() => {
  I18N.extend({
    fr: {
      'sell.instock': '{qty} {unit} en stock',
      'sell.empty': 'Aucun article à vendre',
      'sell.empty.hint': 'Ajoutez vos articles depuis l’écran Stock.',
    },
    en: {
      'sell.instock': '{qty} {unit} in stock',
      'sell.empty': 'No items to sell',
      'sell.empty.hint': 'Add your items from the Stock screen.',
    },
  });

  document.head.appendChild(UI.el(`<style>
    [data-screen=sell] .sellsec{display:flex;align-items:center;gap:7px;margin:var(--s5) 2px var(--s3)}
    [data-screen=sell] .sellsec svg{width:14px;height:14px;color:var(--gold)}
    [data-screen=sell] .sellsec .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--gold));flex:none}
    [data-screen=sell] .sellsec .tt{margin-left:auto}
    [data-screen=sell] .favrow{display:flex;gap:var(--s3);overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-ms-overflow-style:none}
    [data-screen=sell] .favrow::-webkit-scrollbar{display:none}
    [data-screen=sell] .favrow .icard{flex:none;width:31%;min-width:104px}
    [data-screen=sell] .rrow{display:flex;gap:var(--s2);overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-ms-overflow-style:none}
    [data-screen=sell] .rrow::-webkit-scrollbar{display:none}
    [data-screen=sell] .rchip{flex:none;display:inline-flex;align-items:center;gap:9px;height:48px;padding:0 15px 0 7px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--hairline);font-size:13px;font-weight:600;color:var(--text);transition:transform .12s,background .15s}
    [data-screen=sell] .rchip:active{transform:scale(.96);background:var(--surface-3)}
    [data-screen=sell] .rchip__art{width:34px;height:34px;border-radius:10px;overflow:hidden;background:var(--surface-3);flex:none}
    [data-screen=sell] .rchip__art svg,[data-screen=sell] .rchip__art img{width:100%;height:100%;object-fit:cover}
    [data-screen=sell] .icard{text-align:left;width:100%}
    [data-screen=sell] .sellbody>*{animation:sell-f .28s cubic-bezier(.2,.8,.3,1) both}
    [data-screen=sell] .qs{text-align:center}
    [data-screen=sell] .qs__art{width:104px;height:120px;margin:0 auto var(--s3);border-radius:18px;overflow:hidden;background:var(--surface-2);border:1px solid var(--hairline)}
    [data-screen=sell] .qs__art svg,[data-screen=sell] .qs__art img{width:100%;height:100%;object-fit:cover}
    [data-screen=sell] .qs__name{font-size:19px}
    [data-screen=sell] .qs__stock{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--text-2);font-size:13px;margin-top:5px}
    [data-screen=sell] .qs__quick{display:flex;justify-content:center;gap:var(--s2);margin-top:var(--s4)}
    [data-screen=sell] .qs__quick .chip{height:44px;min-width:64px;justify-content:center;font-size:15px}
    [data-screen=sell] .stepper__btn[disabled]{opacity:.35;pointer-events:none}
    [data-screen=sell] .stepper__v.is-bump{animation:sell-bump .16s ease}
    @keyframes sell-f{from{opacity:0;transform:translateY(6px)}}
    @keyframes sell-bump{50%{transform:scale(1.08)}}
  </style>`));

  /* transient UI state — survives store-driven re-renders */
  let sellQ = '';
  let sellCat = 'all';

  const norm = s => String(s || '').normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();

  const secHTML = (ic, label) =>
    `<div class="sellsec">${UI.icon(ic)}<span class="eyebrow">${UI.esc(label)}</span></div>`;

  function icardHTML(it) {
    const stock = Store.stock(it.id);
    const low = Store.isLow(it.id);
    return `<button class="icard" type="button" data-item="${UI.esc(it.id)}">
      <div class="icard__art">${UI.art(it)}</div>
      ${low ? `<span class="icard__badge pill pill--danger">${UI.esc(t('inv.low'))}</span>` : ''}
      <div class="icard__name">${UI.esc(it.name)}</div>
      <div class="icard__meta"><span class="num">${UI.fmtQty(stock)}</span> ${UI.esc(t('u.' + it.unit))}</div>
    </button>`;
  }

  const rchipHTML = it =>
    `<button class="rchip" type="button" data-item="${UI.esc(it.id)}"><span class="rchip__art">${UI.art(it)}</span>${UI.esc(it.name)}</button>`;

  function bodyHTML() {
    const items = Store.activeItems();
    if (!items.length) {
      return `<div class="empty">${UI.icon('stock')}
        <div class="empty__t">${UI.esc(t('sell.empty'))}</div>
        <div class="empty__s">${UI.esc(t('sell.empty.hint'))}</div></div>`;
    }
    const inCat = sellCat === 'all' ? items : items.filter(i => i.catId === sellCat);

    /* search active → flat grid, accent/case-insensitive */
    if (sellQ.trim()) {
      const nq = norm(sellQ.trim());
      const hits = inCat.filter(i => norm(i.name).includes(nq));
      if (!hits.length) {
        return `<div class="empty">${UI.icon('search')}
          <div class="empty__t">${UI.esc(t('sell.noresults'))}</div>
          <div class="empty__s">${UI.esc(t('sell.noresults.hint'))}</div></div>`;
      }
      return `<div class="igrid">${hits.map(icardHTML).join('')}</div>`;
    }

    let out = '';
    if (sellCat === 'all') {
      const favs = items.filter(i => i.pinned);
      if (favs.length) out += secHTML('pin', t('sell.favorites')) + `<div class="favrow">${favs.map(icardHTML).join('')}</div>`;
      const rec = Store.state.recents.map(id => Store.item(id)).filter(i => i && i.active);
      if (rec.length) out += secHTML('clock', t('sell.recents')) + `<div class="rrow">${rec.map(rchipHTML).join('')}</div>`;
    }
    const cats = Store.state.categories.slice().sort((a, b) => a.sort - b.sort)
      .filter(c => sellCat === 'all' || c.id === sellCat);
    for (const c of cats) {
      const list = items.filter(i => i.catId === c.id);
      if (!list.length) continue;
      out += `<div class="sellsec"><span class="dot" style="--c:${UI.esc(c.color)}"></span>
          <span class="eyebrow">${UI.esc(Store.catName(c))}</span><span class="tt num">${list.length}</span></div>
        <div class="igrid">${list.map(icardHTML).join('')}</div>`;
    }
    if (!out) out = `<div class="empty">${UI.icon('stock')}<div class="empty__t">${UI.esc(t('inv.empty'))}</div></div>`;
    return out;
  }

  /* ---- quantity sheet: tap 2 of 2 ---- */
  function openQty(itemId) {
    const it = Store.item(itemId);
    if (!it || !it.active) return;
    const stock = Store.stock(it.id);
    const low = Store.isLow(it.id);
    const dec = !!it.allowDecimal;
    const min = dec ? 0.5 : 1, max = 999;
    let qty = 1;

    const c = UI.el(`<div data-screen="sell"><div class="qs">
      <div class="qs__art">${UI.art(it)}</div>
      <h2 class="qs__name">${UI.esc(it.name)}</h2>
      <div class="qs__stock">
        <span>${UI.esc(t('sell.instock', { qty: UI.fmtQty(stock), unit: t('u.' + it.unit) }))}</span>
        ${low ? `<span class="pill pill--danger">${UI.esc(t('inv.low'))}</span>` : ''}
      </div>
      <div class="eyebrow" style="margin-top:var(--s5)">${UI.esc(t('sell.qty'))}</div>
      <div class="stepper" style="margin-top:var(--s3)">
        <button class="stepper__btn" type="button" data-a="minus">${UI.icon('minus')}</button>
        <div class="stepper__v num" data-v></div>
        <button class="stepper__btn" type="button" data-a="plus">${UI.icon('plus')}</button>
      </div>
      ${dec ? `<div class="qs__quick">${[0.5, 1, 2].map(v =>
        `<button class="chip" type="button" data-q="${v}"><span class="num">${UI.fmtQty(v)}</span></button>`).join('')}</div>` : ''}
      <button class="btn btn--gold btn--big btn--full" style="margin-top:var(--s6)" type="button" data-a="ok">${UI.esc(t('g.confirm'))}</button>
    </div></div>`);

    const vEl = c.querySelector('[data-v]');
    const minusB = c.querySelector('[data-a=minus]');
    const setQ = v => {
      qty = Math.min(max, Math.max(min, Math.round(v * 100) / 100));
      vEl.textContent = UI.fmtQty(qty);
      vEl.classList.remove('is-bump'); void vEl.offsetWidth; vEl.classList.add('is-bump');
      if (qty <= min) minusB.setAttribute('disabled', ''); else minusB.removeAttribute('disabled');
      for (const b of c.querySelectorAll('[data-q]')) b.classList.toggle('is-on', Number(b.dataset.q) === qty);
    };
    const s = UI.sheet(c);
    setQ(1);

    c.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.q) { UI.haptic('light'); return setQ(Number(b.dataset.q)); }
      if (b.dataset.a === 'plus') { UI.haptic('light'); return setQ(dec && qty === 0.5 ? 1 : qty + 1); }
      if (b.dataset.a === 'minus') { UI.haptic('light'); return setQ(qty <= 1 ? min : qty - 1); }
      if (b.dataset.a === 'ok') {
        const fresh = Store.item(itemId); /* fresh data at action time */
        if (!fresh || !fresh.active) { s.close(); return void UI.toast(t('g.error'), { type: 'danger' }); }
        const entry = Store.logSale(fresh.id, qty);
        if (!entry) return void UI.toast(t('g.error'), { type: 'danger' });
        UI.haptic('light');
        s.close();
        UI.toast(t('sell.logged', { qty: UI.fmtQty(qty), item: fresh.name }), {
          type: 'ok', ms: 6000,
          action: {
            label: t('g.undo'),
            fn: () => { if (Store.undoSale(entry.id)) { UI.haptic('warn'); UI.toast(t('sell.undone')); } },
          },
        });
      }
    });
  }

  function startScan() {
    UI.haptic('light');
    UI.scan({
      onCode(code) {
        const it = Store.findByBarcode(code);
        if (it) openQty(it.id);
        else UI.toast(t('sell.noresults'), { type: 'danger' });
      },
    });
  }

  UI.registerScreen({
    id: 'sell',
    render(el) {
      const st = Store.state;
      /* scan always shown: UI.scan falls back to manual code entry */
      let actions = `<button class="iconbtn" type="button" data-a="scan" aria-label="${UI.esc(t('sell.scan'))}">${UI.icon('scan')}</button>`;
      if (!Store.isOwner) actions += `<button class="iconbtn" type="button" data-a="lock" aria-label="${UI.esc(t('login.switchUser'))}">${UI.icon('lock')}</button>`;

      el.innerHTML = UI.header(t('sell.title'), st.settings.barName, actions) + `
        <div class="search">
          ${UI.icon('search')}
          <input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="${UI.esc(t('g.search'))}">
          <button class="iconbtn iconbtn--plain search__clear ${sellQ ? '' : 'hidden'}" type="button" data-a="clear">${UI.icon('x')}</button>
        </div>
        <div class="chips" data-cats></div>
        <div class="sellbody" data-body></div>`;

      const input = el.querySelector('.search input');
      const clearB = el.querySelector('[data-a=clear]');
      const bodyEl = el.querySelector('[data-body]');
      const catsEl = el.querySelector('[data-cats]');
      input.value = sellQ; /* keep search text across re-renders */

      const drawCats = () => {
        const cats = st.categories.slice().sort((a, b) => a.sort - b.sort);
        catsEl.innerHTML =
          `<button class="chip ${sellCat === 'all' ? 'is-on' : ''}" type="button" data-cat="all">${UI.esc(t('g.all'))}</button>` +
          cats.map(cg => `<button class="chip ${sellCat === cg.id ? 'is-on' : ''}" type="button" data-cat="${UI.esc(cg.id)}"><span class="dot" style="--c:${UI.esc(cg.color)}"></span>${UI.esc(Store.catName(cg))}</button>`).join('');
      };
      const drawBody = () => { bodyEl.innerHTML = bodyHTML(); };
      drawCats(); drawBody();

      input.addEventListener('input', () => {
        sellQ = input.value;
        clearB.classList.toggle('hidden', !sellQ);
        drawBody();
      });
      input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); });

      el.addEventListener('click', e => {
        const cb = e.target.closest('[data-cat]');
        if (cb) { sellCat = cb.dataset.cat; UI.haptic('light'); drawCats(); drawBody(); return; }
        const ib = e.target.closest('[data-item]');
        if (ib) { UI.haptic('light'); openQty(ib.dataset.item); return; }
        const a = e.target.closest('[data-a]');
        if (!a) return;
        if (a.dataset.a === 'clear') { sellQ = ''; input.value = ''; clearB.classList.add('hidden'); drawBody(); input.focus(); }
        else if (a.dataset.a === 'scan') startScan();
        else if (a.dataset.a === 'lock') { UI.haptic('light'); Store.logout(); }
      });
    },
  });
})();

  /* notification sheet (lives outside the screen — own unique scope) */
  .dash-ntf__h{font-size:18px;margin-bottom:12px}
