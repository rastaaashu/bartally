      'rep.closedBy': 'Clôturé par {name} à {time}',
    },
    en: {
      'rep.openHint': 'Count in progress — close it to generate the report.',
      'rep.sold_one': '{n} unit sold', 'rep.sold_many': '{n} units sold',
      'rep.wasteN_one': '{n} loss', 'rep.wasteN_many': '{n} losses',
      'rep.from': 'From', 'rep.to': 'To', 'rep.colDate': 'Date',
      'rep.soldLbl': 'units sold', 'rep.restocked': 'units delivered', 'rep.wasted': 'units lost',
      'rep.notFound': 'Report not found',
      'rep.notFoundSub': 'No closed count for this date.',
      'rep.cleanN_one': '{n} item spot-on', 'rep.cleanN_many': '{n} items spot-on',
      'rep.noSales': 'No sales recorded that day.',
      'rep.noRestocks': 'No deliveries that day.',
      'rep.noWaste': 'No waste recorded that day.',
      'rep.voidedTag': 'Voided',
      'rep.rangeEmpty': 'No closed days in this range.',
      'rep.auto': 'Not counted — expected value kept',
      'rep.closedBy': 'Closed by {name} at {time}',
    },
  });

  /* ---------- helpers ---------- */
  const S = () => Store.state;
  const esc = (...a) => UI.esc(...a);
  const fq = n => UI.fmtQty(n);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const sgn = v => (v > 0 ? '+' : '') + fq(v);
  const vcls = v => v < 0 ? 'varneg' : v > 0 ? 'varpos' : 'varzero';
  const pcls = v => v < 0 ? 'neg' : v > 0 ? 'pos' : '';
  const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '');
  const longDate = bd => cap(UI.fmtDate(bd, { weekday: 'long', day: 'numeric', month: 'long' }));
  const r2 = n => Math.round(n * 100) / 100;
  const sumBd = (arr, bd, skipVoid) => {
    let s = 0;
    for (const e of arr) if (e.bd === bd && !(skipVoid && e.voidedAt)) s += e.qty;
    return r2(s);
  };
  const varTotal = c => r2(c.lines.reduce((s, l) => s + (l.variance || 0), 0));
  const lossValue = c => {
    let s = 0;
    for (const l of c.lines) {
      if (l.variance >= 0) continue;
      const it = Store.item(l.itemId);
      if (it && it.cost != null) s += -l.variance * it.cost;
    }
    return r2(s);
  };
  const hasCosts = () => S().items.some(i => i.cost != null);
  const bySort = (a, b) => (Store.item(a.itemId)?.sort ?? 0) - (Store.item(b.itemId)?.sort ?? 0);
  const nameOf = l => Store.item(l.itemId)?.name || '?';
  const catOf = l => { const it = Store.item(l.itemId); const c = it && Store.cat(it.catId); return c ? Store.catName(c) : ''; };
  const varLinesOf = c => c.lines.filter(l => l.variance !== 0).sort((a, b) => Math.abs(b.variance) - Math.abs(a.variance));
  const rangeCounts = (from, to) => Store.closedCounts().filter(c => c.bd >= from && c.bd <= to).sort((a, b) => a.bd < b.bd ? -1 : 1);

  function head(title, sub, backTo) {
    return `<header class="apphead">
      <button class="iconbtn" data-back="${backTo}" aria-label="${esc(t('g.back'))}">${UI.icon('chevL')}</button>
      <div class="apphead__titles"><h1 class="apphead__title">${esc(title)}</h1>${sub ? `<div class="apphead__sub">${esc(sub)}</div>` : ''}</div>
    </header>`;
  }

  /* transient view state — survives UI.refresh() re-renders */
  const range = { from: null, to: null };
  let lastDay = null, cleanOpen = false;

  /* ---------- scoped css (appended once) ---------- */
  let cssIn = false;
  function ensureCss() {
    if (cssIn) return; cssIn = true;
    document.head.appendChild(UI.el(`<style>
[data-screen=reports] .row__t,[data-screen=reports] .row__s{display:block}
[data-screen=reports] .rep-days{padding:6px 16px}
[data-screen=reports] .rep-days .row,[data-screen=reports] [data-a=clean]{width:100%;text-align:left}
[data-screen=reports] .pill svg{width:12px;height:12px}
[data-screen=reports] .btn svg{width:18px;height:18px}
[data-screen=reports] .rep-chev{color:var(--text-3);flex:none;transition:transform .25s cubic-bezier(.2,.8,.3,1)}
[data-screen=reports] .rep-chev svg{width:18px;height:18px}
[data-screen=reports] .rep-chev.is-open{transform:rotate(90deg)}
[data-screen=reports] .rep-range{display:flex;gap:12px}
[data-screen=reports] .rep-range .field{flex:1;margin-bottom:var(--s3)}
[data-screen=reports] .field input[type=date]{width:100%;min-height:48px;padding:12px 14px;border-radius:12px;border:1px solid var(--hairline);background:var(--surface-2);font-size:15px;color:var(--text);color-scheme:dark}
[data-screen=reports] .field input[type=date]:focus{border-color:rgba(245,166,35,.5)}
[data-screen=reports] .rep-void .row__t,[data-screen=reports] .rep-void .row__s{text-decoration:line-through;opacity:.55}
[data-screen=reports] .rep-void .row__art{opacity:.4}
[data-screen=reports] .rep-note{display:flex;align-items:flex-start;gap:5px;margin-top:3px;font-size:12px;color:var(--text-2)}
[data-screen=reports] .rep-note svg{width:13px;height:13px;flex:none;margin-top:2px;color:var(--gold)}
[data-screen=reports] .rep-okline{display:flex;align-items:center;gap:10px;padding:4px 0 8px;color:var(--ok)}
[data-screen=reports] .rep-okline svg{width:22px;height:22px;flex:none}
[data-screen=reports] .rep-loss{grid-column:1/-1;background:linear-gradient(160deg,rgba(245,166,35,.14),rgba(245,166,35,.03) 60%),var(--surface);border-color:rgba(245,166,35,.25)}
[data-screen=reports] .rep-clean{animation:rep-drop .28s cubic-bezier(.2,.8,.3,1)}
[data-screen=reports] .rep-fade{animation:rep-in .34s cubic-bezier(.2,.85,.3,1) both}
@keyframes rep-in{from{opacity:0;transform:translateY(8px)}}
@keyframes rep-drop{from{opacity:0;transform:translateY(-6px)}}
</style>`));
  }

  /* ---------- exports: shared bits ---------- */
  const csvHead = () => [t('rep.colDate'), t('inv.category'), t('rep.item'), t('count.expected'), t('count.counted'), t('dash.variance'), t('count.note')];
  const csvLine = (c, l) => [c.bd, catOf(l), nameOf(l), fq(l.expected), fq(l.counted), fq(l.variance), l.note || (l.autofilled ? t('rep.auto') : '')];
  const thRow = cols => `<tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr>`;
  const pdfVarTable = lines => `<table>${thRow([t('inv.category'), t('rep.item'), t('count.expected'), t('count.counted'), t('dash.variance'), t('count.note')])}
    ${lines.map(l => `<tr><td>${esc(catOf(l))}</td><td>${esc(nameOf(l))}</td><td>${esc(fq(l.expected))}</td><td>${esc(fq(l.counted))}</td><td class="${pcls(l.variance)}">${esc(sgn(l.variance))}</td><td>${esc(l.note || '')}</td></tr>`).join('')}</table>`;
  const pdfKpis = (sold, rest, waste, vt, loss) => `<div class="kpis">
    <div><b>${esc(fq(sold))}</b><span>${esc(t('rep.soldLbl'))}</span></div>
    <div><b>${esc(fq(rest))}</b><span>${esc(t('rep.restocked'))}</span></div>
    <div><b>${esc(fq(waste))}</b><span>${esc(t('rep.wasted'))}</span></div>
    <div><b class="${pcls(vt)}">${esc(sgn(vt))}</b><span>${esc(t('count.varTotal'))}</span></div>
    ${loss != null ? `<div><b class="${loss > 0 ? 'neg' : ''}">${esc(UI.money(loss))}</b><span>${esc(t('rep.lossValue'))}</span></div>` : ''}
  </div>`;

  function exportCsvRange(from, to) {
    const cs = rangeCounts(from, to);
    if (!cs.length) return UI.toast(t('rep.rangeEmpty'), { type: 'danger' });
    const rows = [csvHead()];
    for (const c of cs) for (const l of [...c.lines].sort(bySort)) rows.push(csvLine(c, l));
    UI.csv(rows, `${slug(t('rep.title'))}-${from}_${to}.csv`);
    UI.haptic('success');
  }

  function exportPdfRange(from, to) {
    const cs = rangeCounts(from, to);
    if (!cs.length) return UI.toast(t('rep.rangeEmpty'), { type: 'danger' });
    let sold = 0, rest = 0, waste = 0, vt = 0, loss = 0;
    for (const c of cs) {
      sold += sumBd(S().sales, c.bd, true); rest += sumBd(S().restocks, c.bd);
      waste += sumBd(S().waste, c.bd); vt += varTotal(c); loss += lossValue(c);
    }
    let body = pdfKpis(r2(sold), r2(rest), r2(waste), r2(vt), hasCosts() ? r2(loss) : null);
    for (const c of cs) {
      const dSold = sumBd(S().sales, c.bd, true), dWaste = sumBd(S().waste, c.bd), dVt = varTotal(c);
      body += `<h2>${esc(longDate(c.bd))}</h2>
        <div class="sub">${esc(I18N.plural('rep.sold', dSold, { n: fq(dSold) }))} · ${esc(t('rep.wasted'))} : ${esc(fq(dWaste))} · ${esc(t('count.varTotal'))} : ${esc(sgn(dVt))}</div>`;
      const v = varLinesOf(c);
      body += v.length ? pdfVarTable(v) : `<p style="color:#1E8E5A;margin:6px 0 16px">${esc(t('count.clean'))} — ${esc(t('count.cleanSub'))}</p>`;
    }
    UI.printHTML(`${t('rep.title')} — ${UI.fmtDate(from)} → ${UI.fmtDate(to)}`, body);
    UI.haptic('success');
  }

  function exportCsvDay(c) {
    const rows = [csvHead()];
    for (const l of [...c.lines].sort(bySort)) rows.push(csvLine(c, l));
    UI.csv(rows, `${slug(t('rep.day', { date: c.bd }))}.csv`);
    UI.haptic('success');
  }

  function exportPdfDay(c) {
    const bd = c.bd;
    const sold = sumBd(S().sales, bd, true), rest = sumBd(S().restocks, bd), waste = sumBd(S().waste, bd);
    let body = pdfKpis(sold, rest, waste, varTotal(c), hasCosts() ? lossValue(c) : null);
    const v = varLinesOf(c);
    body += `<h2>${esc(t('rep.countRep'))}</h2>`;
    body += v.length ? pdfVarTable(v) : `<p style="color:#1E8E5A;margin:6px 0 16px">${esc(t('count.clean'))} — ${esc(t('count.cleanSub'))}</p>`;
    const daySales = S().sales.filter(s => s.bd === bd).sort((a, b) => a.at < b.at ? -1 : 1);
    body += `<h2>${esc(t('rep.sales'))}</h2>`;
    body += daySales.length
      ? `<table>${thRow([t('rep.time'), t('rep.qty'), t('rep.item'), t('rep.who')])}
          ${daySales.map(s => `<tr><td>${esc(UI.fmtTime(s.at))}</td><td>${esc(fq(s.qty))}</td><td>${esc(Store.item(s.itemId)?.name || '?')}${s.voidedAt ? ` <span class="neg">(${esc(t('rep.voidedTag'))})</span>` : ''}</td><td>${esc(s.by)}</td></tr>`).join('')}</table>`
      : `<p>${esc(t('rep.noSales'))}</p>`;
    const dayWaste = S().waste.filter(w => w.bd === bd).sort((a, b) => a.at < b.at ? -1 : 1);
    if (dayWaste.length) {
      body += `<h2>${esc(t('rep.waste'))}</h2>
        <table>${thRow([t('rep.time'), t('rep.qty'), t('rep.item'), t('waste.reason'), t('rep.who')])}
        ${dayWaste.map(w => `<tr><td>${esc(UI.fmtTime(w.at))}</td><td class="neg">${esc('-' + fq(w.qty))}</td><td>${esc(Store.item(w.itemId)?.name || '?')}</td><td>${esc(w.reason || '')}</td><td>${esc(w.by)}</td></tr>`).join('')}</table>`;
    }
    UI.printHTML(t('rep.day', { date: longDate(bd) }), body);
    UI.haptic('success');
  }

  /* ---------- list mode ---------- */
  function dayRow(c, i) {
    const sold = sumBd(S().sales, c.bd, true);
    const wn = S().waste.filter(w => w.bd === c.bd).length;
    const vt = varTotal(c);
    const pill = vt === 0
      ? `<span class="pill pill--ok">${UI.icon('check')}<span class="num">0</span></span>`
      : `<span class="pill pill--danger"><span class="num">${esc(sgn(vt))}</span></span>`;
    return `<button class="row rep-fade" data-day="${c.bd}" style="animation-delay:${Math.min(i * 30, 240)}ms">
      <span class="row__body">
        <span class="row__t">${esc(longDate(c.bd))}</span>
        <span class="row__s">${esc(I18N.plural('rep.sold', sold, { n: fq(sold) }))}${wn ? ' · ' + esc(I18N.plural('rep.wasteN', wn, { n: wn })) : ''}</span>
      </span>
      <span class="row__end">${pill}</span>
      <span class="rep-chev">${UI.icon('chevR')}</span>
    </button>`;
  }

  function renderList(el) {
    const days = Store.closedCounts();
    const open = S().counts.find(c => c.status === 'open');
    let html = head(t('rep.title'), '', 'more');
    if (open) {
      html += `<div class="card card--gold rep-fade">
        <div class="card__head" style="margin-bottom:6px">
          <div class="card__title" style="display:flex;align-items:center;gap:8px"><span class="livedot"></span>${esc(t('rep.openDay'))}</div>
          <span class="pill pill--gold"><span class="num">${esc(UI.fmtDate(open.bd))}</span></span>
        </div>
        <p class="tt">${esc(t('rep.openHint'))}</p>
        <button class="btn btn--gold btn--full mt3" data-a="count">${esc(t('g.continue'))}</button>
      </div>`;
    }
    if (!days.length) {
      html += `<div class="empty grow">${UI.icon('calendar')}
        <div class="empty__t">${esc(t('rep.noDays'))}</div>
        <div class="empty__s">${esc(t('rep.noDaysSub'))}</div></div>`;
    } else {
      html += `<div class="card rep-days">${days.map(dayRow).join('')}</div>`;
      const defTo = days[0].bd, defFrom = days[Math.min(days.length - 1, 6)].bd;
      const from = range.from || defFrom, to = range.to || defTo;
      html += `<div class="card rep-fade" style="animation-delay:.1s">
        <div class="card__head"><div class="card__title">${esc(t('rep.export'))}</div><span class="eyebrow">${esc(t('rep.exportRange'))}</span></div>
        <div class="rep-range">
          <div class="field"><label>${esc(t('rep.from'))}</label><input type="date" data-r="from" value="${from}" min="${days[days.length - 1].bd}" max="${defTo}"></div>
          <div class="field"><label>${esc(t('rep.to'))}</label><input type="date" data-r="to" value="${to}" min="${days[days.length - 1].bd}" max="${defTo}"></div>
        </div>
        <div style="display:flex;gap:10px">
          <button class="btn btn--ghost" style="flex:1" data-a="csv">${UI.icon('download')}${esc(t('rep.exportCsv'))}</button>
          <button class="btn btn--gold" style="flex:1" data-a="pdf">${UI.icon('download')}${esc(t('rep.exportPdf'))}</button>
        </div>
      </div>`;
    }
    el.innerHTML = html;
    const getRange = () => {
      const ds = Store.closedCounts();
      let from = el.querySelector('[data-r=from]')?.value || ds[Math.min(ds.length - 1, 6)].bd;
      let to = el.querySelector('[data-r=to]')?.value || ds[0].bd;
      if (from > to) { const x = from; from = to; to = x; }
      return [from, to];
    };
    el.addEventListener('click', e => {
      const back = e.target.closest('[data-back]');
      if (back) { UI.haptic('light'); return UI.go(back.dataset.back); }
      if (e.target.closest('[data-a=count]')) { UI.haptic('light'); return UI.go('count'); }
      const d = e.target.closest('[data-day]');
      if (d) { UI.haptic('light'); return UI.go('reports', { day: d.dataset.day }); }
      if (e.target.closest('[data-a=csv]')) return exportCsvRange(...getRange());
      if (e.target.closest('[data-a=pdf]')) return exportPdfRange(...getRange());
    });
    el.addEventListener('change', e => {
      const r = e.target.closest('[data-r]');
      if (r) range[r.dataset.r] = r.value;
    });
  }

  /* ---------- day mode ---------- */
  function varLineRow(l) {
    const it = Store.item(l.itemId);
    return `<div class="row">
      <div class="row__art">${it ? UI.art(it) : ''}</div>
      <div class="row__body">
        <div class="row__t">${esc(nameOf(l))}</div>
        <div class="row__s"><span class="num">${esc(fq(l.expected))} → ${esc(fq(l.counted))}</span></div>
        ${l.note ? `<div class="rep-note">${UI.icon('note')}<span>${esc(l.note)}</span></div>` : ''}
      </div>
      <div class="row__end"><span class="qtybubble ${vcls(l.variance)}">${esc(sgn(l.variance))}</span></div>
    </div>`;
  }
  function cleanLineRow(l) {
    return `<div class="row" style="min-height:44px">
      <div class="row__body">
        <div class="row__t" style="font-weight:500;color:var(--text-2)">${esc(nameOf(l))}</div>
        ${l.autofilled ? `<div class="tt">${esc(t('rep.auto'))}</div>` : ''}
      </div>
      <div class="row__end num" style="color:var(--text-3)">${esc(fq(l.counted))}</div>
    </div>`;
  }
  function saleRow(s) {
    const it = Store.item(s.itemId);
    return `<div class="row ${s.voidedAt ? 'rep-void' : ''}">
      <div class="row__art">${it ? UI.art(it) : ''}</div>
      <div class="row__body">
        <div class="row__t"><span class="num">${esc(fq(s.qty))} ×</span> ${esc(it?.name || '?')}</div>
        <div class="row__s">${esc(s.by)} · <span class="num">${esc(UI.fmtTime(s.at))}</span></div>
      </div>
      <div class="row__end">${s.voidedAt
        ? `<span class="pill pill--mut">${esc(t('rep.voidedTag'))}</span>`
        : `<button class="iconbtn" data-void="${s.id}" aria-label="${esc(t('rep.void'))}">${UI.icon('trash')}</button>`}</div>
    </div>`;
  }
  function restockRow(r) {
    const it = Store.item(r.itemId);
    return `<div class="row">
      <div class="row__art">${it ? UI.art(it) : ''}</div>
      <div class="row__body">
        <div class="row__t">${esc(it?.name || '?')}</div>
        <div class="row__s">${esc(r.by)} · <span class="num">${esc(UI.fmtTime(r.at))}</span></div>
      </div>
      <div class="row__end qtybubble varpos">${esc('+' + fq(r.qty))}</div>
    </div>`;
  }
  function wasteRow(w) {
    const it = Store.item(w.itemId);
    return `<div class="row">
      <div class="row__art">${it ? UI.art(it) : ''}</div>
      <div class="row__body">
        <div class="row__t">${esc(it?.name || '?')}</div>
        <div class="row__s">${esc(w.by)} · <span class="num">${esc(UI.fmtTime(w.at))}</span></div>
        ${w.reason ? `<div class="rep-note">${UI.icon('note')}<span>${esc(w.reason)}</span></div>` : ''}
      </div>
      <div class="row__end qtybubble varneg">${esc('-' + fq(w.qty))}</div>
    </div>`;
  }

  function renderDay(el, bd) {
    if (lastDay !== bd) { lastDay = bd; cleanOpen = false; }
    const c = Store.closedCounts().find(x => x.bd === bd);
    if (!c) {
      el.innerHTML = head(t('rep.day', { date: UI.fmtDate(bd) }), '', 'reports') +
        `<div class="empty grow">${UI.icon('alert')}
          <div class="empty__t">${esc(t('rep.notFound'))}</div>
          <div class="empty__s">${esc(t('rep.notFoundSub'))}</div>
          <button class="btn btn--ghost mt3" data-back="reports">${esc(t('g.back'))}</button></div>`;
      el.addEventListener('click', e => {
        const back = e.target.closest('[data-back]');
        if (back) { UI.haptic('light'); UI.go(back.dataset.back); }
      });
      return;
    }
    const st = S();
    const sold = sumBd(st.sales, bd, true), rest = sumBd(st.restocks, bd), waste = sumBd(st.waste, bd);
    const vt = varTotal(c), loss = lossValue(c), costs = hasCosts();
    const varLines = varLinesOf(c);
    const cleanLines = c.lines.filter(l => l.variance === 0).sort(bySort);
    const daySales = st.sales.filter(s => s.bd === bd).sort((a, b) => a.at < b.at ? -1 : 1);
    const dayRest = st.restocks.filter(r => r.bd === bd).sort((a, b) => a.at < b.at ? -1 : 1);
    const dayWaste = st.waste.filter(w => w.bd === bd).sort((a, b) => a.at < b.at ? -1 : 1);
    const stat = (v, l, cls, extra, i) =>
      `<div class="stat rep-fade${extra ? ' ' + extra : ''}" style="animation-delay:${i * 50}ms"><div class="stat__v num ${cls || ''}">${v}</div><div class="stat__l">${esc(l)}</div></div>`;

    let html = head(
      t('rep.day', { date: UI.fmtDate(bd) }),
      c.closedAt ? t('rep.closedBy', { name: c.closedBy || '', time: UI.fmtTime(c.closedAt) }) : '',
      'reports');

    html += `<div class="stats mb3">
      ${stat(esc(fq(sold)), t('rep.soldLbl'), '', '', 0)}
      ${stat(esc(fq(rest)), t('rep.restocked'), '', '', 1)}
      ${stat(esc(fq(waste)), t('rep.wasted'), waste > 0 ? 'varneg' : '', '', 2)}
      ${stat(esc(sgn(vt)), t('count.varTotal'), vcls(vt), '', 3)}
      ${costs ? stat(`<span style="font-size:22px" class="${loss > 0 ? 'varneg' : ''}">${esc(UI.money(loss))}</span>`, t('rep.lossValue'), '', 'rep-loss', 4) : ''}
    </div>`;

    /* 1 — count & variance */
    html += `<div class="card rep-fade" style="animation-delay:.08s">
      <div class="card__head"><div class="card__title">${esc(t('rep.countRep'))}</div>
        ${varLines.length
          ? `<span class="pill pill--danger"><span class="num">${varLines.length}</span></span>`
          : `<span class="pill pill--ok">${UI.icon('check')}${esc(t('count.clean'))}</span>`}
      </div>
      ${varLines.map(varLineRow).join('')}
      ${!varLines.length && c.lines.length ? `<div class="rep-okline">${UI.icon('check')}<div><div class="row__t">${esc(t('count.clean'))}</div><div class="tt">${esc(t('count.cleanSub'))}</div></div></div>` : ''}
      ${!c.lines.length ? `<div class="tt" style="padding:6px 0">${esc(t('ins.noData'))}</div>` : ''}
      ${cleanLines.length ? `
        <button class="row" data-a="clean" aria-expanded="${cleanOpen}">
          <span class="iconbtn iconbtn--plain" style="color:var(--ok)">${UI.icon('check')}</span>
          <span class="row__body"><span class="row__t" style="color:var(--text-2)">${esc(I18N.plural('rep.cleanN', cleanLines.length, { n: cleanLines.length }))}</span></span>
          <span class="rep-chev ${cleanOpen ? 'is-open' : ''}">${UI.icon('chevR')}</span>
        </button>
        <div class="rep-clean ${cleanOpen ? '' : 'hidden'}">${cleanLines.map(cleanLineRow).join('')}</div>` : ''}
    </div>`;

    /* 2 — sales */
    html += `<div class="card rep-fade" style="animation-delay:.12s">
      <div class="card__head"><div class="card__title">${esc(t('rep.sales'))}</div><span class="pill pill--mut"><span class="num">${daySales.length}</span></span></div>
      ${daySales.length ? daySales.map(saleRow).join('') : `<div class="tt" style="padding:6px 0">${esc(t('rep.noSales'))}</div>`}
    </div>`;

    /* 3 — restocks */
    html += `<div class="card rep-fade" style="animation-delay:.16s">
      <div class="card__head"><div class="card__title">${esc(t('rep.restocks'))}</div><span class="pill pill--mut"><span class="num">${dayRest.length}</span></span></div>
      ${dayRest.length ? dayRest.map(restockRow).join('') : `<div class="tt" style="padding:6px 0">${esc(t('rep.noRestocks'))}</div>`}
    </div>`;

    /* 4 — waste (with reasons) */
    html += `<div class="card rep-fade" style="animation-delay:.2s">
      <div class="card__head"><div class="card__title">${esc(t('rep.waste'))}</div><span class="pill pill--mut"><span class="num">${dayWaste.length}</span></span></div>
      ${dayWaste.length ? dayWaste.map(wasteRow).join('') : `<div class="tt" style="padding:6px 0">${esc(t('rep.noWaste'))}</div>`}
    </div>`;

    /* export this day */
    html += `<div class="card rep-fade" style="animation-delay:.24s">
      <div class="card__head"><div class="card__title">${esc(t('rep.export'))}</div><span class="eyebrow">${esc(UI.fmtDate(bd))}</span></div>
      <div style="display:flex;gap:10px">
        <button class="btn btn--ghost" style="flex:1" data-a="dcsv">${UI.icon('download')}${esc(t('rep.exportCsv'))}</button>
        <button class="btn btn--gold" style="flex:1" data-a="dpdf">${UI.icon('download')}${esc(t('rep.exportPdf'))}</button>
      </div>
    </div>`;

    el.innerHTML = html;

    el.addEventListener('click', async e => {
      const back = e.target.closest('[data-back]');
      if (back) { UI.haptic('light'); return UI.go(back.dataset.back); }
      const tg = e.target.closest('[data-a=clean]');
      if (tg) {
        cleanOpen = !cleanOpen;
        el.querySelector('.rep-clean')?.classList.toggle('hidden', !cleanOpen);
        tg.querySelector('.rep-chev')?.classList.toggle('is-open', cleanOpen);
        tg.setAttribute('aria-expanded', String(cleanOpen));
        UI.haptic('light');
        return;
      }
      const v = e.target.closest('[data-void]');
      if (v) {
        const ok = await UI.confirm(t('rep.voidWarn'), { danger: true, title: t('rep.void') });
        if (ok && Store.voidSale(v.dataset.void)) {
          UI.haptic('warn');
          UI.toast(t('rep.voided'), { type: 'ok' });
        }
        return;
      }
      if (e.target.closest('[data-a=dcsv]') || e.target.closest('[data-a=dpdf]')) {
        const fresh = Store.closedCounts().find(x => x.bd === bd);
        if (!fresh) return UI.toast(t('rep.notFound'), { type: 'danger' });
        return e.target.closest('[data-a=dcsv]') ? exportCsvDay(fresh) : exportPdfDay(fresh);
      }
    });
  }

  /* ---------- register ---------- */
  UI.registerScreen({
    id: 'reports',
    render(el, params) {
      ensureCss();
      if (!Store.isOwner) {
        el.innerHTML = `<div class="empty grow">${UI.icon('lock')}<div class="empty__t">${esc(t('login.locked'))}</div></div>`;
        setTimeout(() => UI.go(S().session ? 'sell' : 'login'), 0);
        return;
      }
      if (params && params.day) renderDay(el, params.day);
      else renderList(el);
    },
  });
})();

/* == 27-screen-insights.js == */
/* ============ Insights screen — owner analytics: trend, top sellers, shrinkage, stockout, reorder ============ */
(() => {
  I18N.extend({
    fr: { 'ins.perDay': '{n}/jour' },
    en: { 'ins.perDay': '{n}/day' },
  });

  /* module state: selected range survives re-renders */
  let range = 7;
  let gseq = 0;

  document.head.appendChild(UI.el(`<style>
    [data-screen=insights] .viz{margin-top:4px}
    [data-screen=insights] .viz-tip{display:none}
    [data-screen=insights] .ins-hit{fill:transparent;pointer-events:all}
    [data-screen=insights] .ins-ax{fill:var(--text-3);font-size:9px;letter-spacing:.02em}
    [data-screen=insights] .ins-line{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:ins-draw .9s .1s cubic-bezier(.3,.7,.3,1) forwards}
    [data-screen=insights] .ins-area{opacity:0;animation:ins-fade .6s .5s forwards}
    [data-screen=insights] .ins-end{opacity:0;animation:ins-fade .45s .85s forwards}
    [data-screen=insights] .ins-dot{transform-box:fill-box;transform-origin:center;animation:ins-pop .5s .65s cubic-bezier(.2,.9,.3,1.35) backwards}
    [data-screen=insights] .ins-cross,[data-screen=insights] .ins-hov{display:none}
    [data-screen=insights] .ins-bars{display:flex;flex-direction:column;gap:2px}
    [data-screen=insights] .ins-brow{display:grid;grid-template-columns:88px 1fr 44px;gap:10px;align-items:center;min-height:24px}
    [data-screen=insights] .ins-bname{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    [data-screen=insights] .ins-btrack{height:16px;display:flex;align-items:center}
    [data-screen=insights] .ins-bfill{display:block;height:16px;min-width:3px;background:var(--series-1);border-radius:0 4px 4px 0;transform-origin:left;animation:ins-grow .55s cubic-bezier(.2,.8,.25,1) both}
    [data-screen=insights] .ins-bval{font-size:12.5px;text-align:right}
    [data-screen=insights] .ins-hint{margin:-6px 0 var(--s3);font-size:12px;color:var(--text-3);line-height:1.4}
    [data-screen=insights] .ins-loss{display:flex;align-items:baseline;justify-content:space-between;margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--hairline)}
    [data-screen=insights] .ins-loss .num{font-size:17px;font-weight:700;color:var(--danger)}
    [data-screen=insights] .ins-ok{display:flex;align-items:center;gap:10px;color:var(--ok);font-size:14px;font-weight:600;min-height:44px}
    [data-screen=insights] .ins-ok svg{width:20px;height:20px;flex:none}
    [data-screen=insights] .ins-rqty{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1.1;font-variant-numeric:tabular-nums}
    [data-screen=insights] .ins-note{padding:var(--s2) 0;font-size:12.5px;color:var(--text-3)}
    @keyframes ins-draw{to{stroke-dashoffset:0}}
    @keyframes ins-fade{to{opacity:1}}
    @keyframes ins-pop{from{transform:scale(0)}}
    @keyframes ins-grow{from{transform:scaleX(0)}}
  </style>`));

  const esc = UI.esc;
  const WD = ['d.sun', 'd.mon', 'd.tue', 'd.wed', 'd.thu', 'd.fri', 'd.sat'];
  const wday = bd => t(WD[new Date(bd + 'T12:00:00').getDay()]);
  const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);

  /* y max: 3 gridlines at step/2·step/3·step, step chosen so labels stay clean */
  function niceMax(v) {
    if (!(v > 0)) return 3;
    const t3 = v / 3;
    let step;
    if (t3 <= 1) step = Math.ceil(t3 * 4 - 1e-9) / 4;
    else if (t3 <= 10) step = Math.ceil(t3 - 1e-9);
    else {
      const p = Math.pow(10, Math.floor(Math.log10(t3)));
      const m = [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(x => x * p >= t3 - 1e-9) || 10;
      step = m * p;
    }
    return step * 3;
  }
  const fmtAxis = v => UI.fmtQty(Math.round(v * 100) / 100);

  /**
   * Hand-built SVG line/area chart. Single hue, recessive grid, direct end label,
   * tooltip via transparent overlay hit-rects (hover + tap). Safe with 1 point.
   * cfg: {points:[{bd,v,x01}], color, h, gradient?, areaOp?, ticks:[{x01,label,anchor?,num?}], label, endLabel, tip(p)->html}
   */
  function drawChart(viz, cfg) {
    const W = 340, H = cfg.h || 160, padL = 30, padR = 12, padT = 16, padB = 18;
    const pw = W - padL - padR, base = H - padB, ph = base - padT;
    const pts = cfg.points, n = pts.length;
    if (!n) { viz.innerHTML = ''; return; }
    const vmax = niceMax(Math.max.apply(null, pts.map(p => p.v)));
    const X = p => padL + p.x01 * pw;
    const Y = v => base - (v / vmax) * ph;

    let defs = '', area = '', line = '';
    if (n > 1) {
      const lineD = pts.map((p, i) => (i ? 'L' : 'M') + X(p).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join('');
      const areaD = `M${X(pts[0]).toFixed(1)} ${base}` + pts.map(p => `L${X(p).toFixed(1)} ${Y(p.v).toFixed(1)}`).join('') + `L${X(pts[n - 1]).toFixed(1)} ${base}Z`;
      if (cfg.gradient) {
        const gid = 'insG' + (gseq++);
        defs = `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${cfg.color}" stop-opacity=".22"/><stop offset="1" stop-color="${cfg.color}" stop-opacity="0"/></linearGradient></defs>`;
        area = `<path class="ins-area" d="${areaD}" fill="url(#${gid})"/>`;
      } else {
        area = `<path class="ins-area" d="${areaD}" fill="${cfg.color}" fill-opacity="${cfg.areaOp ?? .08}"/>`;
      }
      line = `<path class="ins-line" pathLength="1" d="${lineD}" stroke="${cfg.color}"/>`;
    }

    let grid = '';
    for (let k = 1; k <= 3; k++) {
      const gv = vmax * k / 3, gy = Y(gv).toFixed(1);
      grid += `<line x1="${padL}" y1="${gy}" x2="${W - padR}" y2="${gy}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>` +
        `<text class="ins-ax num" x="${padL - 6}" y="${(+gy + 3).toFixed(1)}" text-anchor="end">${esc(fmtAxis(gv))}</text>`;
    }
    grid += `<line x1="${padL}" y1="${base}" x2="${W - padR}" y2="${base}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;

    const ticks = (cfg.ticks || []).map(tk =>
      `<text class="ins-ax${tk.num ? ' num' : ''}" x="${(padL + tk.x01 * pw).toFixed(1)}" y="${H - 4}" text-anchor="${tk.anchor || 'middle'}">${esc(tk.label)}</text>`).join('');

    const lp = pts[n - 1], ex = X(lp), ey = Y(lp.v);
    const endAnchor = ex > W - 46 ? 'end' : 'middle';
    const end = `<g class="ins-dot"><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="7" fill="${cfg.color}" opacity=".18"/>` +
      `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3.5" fill="${cfg.color}" stroke="#14141B" stroke-width="1.5"/></g>` +
      `<text class="ins-ax num ins-end" x="${(endAnchor === 'end' ? ex + 4 : ex).toFixed(1)}" y="${Math.max(10, ey - 10).toFixed(1)}" text-anchor="${endAnchor}" style="fill:var(--text);font-size:11px;font-weight:700">${esc(cfg.endLabel)}</text>`;

    const cross = `<line class="ins-cross" x1="0" x2="0" y1="${padT}" y2="${base}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>`;
    const hov = `<circle class="ins-hov" r="3.5" fill="${cfg.color}" stroke="#14141B" stroke-width="1.5"/>`;

    let hits = '';
    for (let i = 0; i < n; i++) {
      const l = i === 0 ? 0 : (X(pts[i - 1]) + X(pts[i])) / 2;
      const r = i === n - 1 ? W : (X(pts[i]) + X(pts[i + 1])) / 2;
      hits += `<rect class="ins-hit" data-i="${i}" x="${l.toFixed(1)}" y="0" width="${(r - l).toFixed(1)}" height="${H}"/>`;
    }

    viz.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.label)}">${defs}${grid}${area}${line}${end}${ticks}${cross}${hov}${hits}</svg><div class="viz-tip"></div>`;

    const svgEl = viz.querySelector('svg'), tip = viz.querySelector('.viz-tip');
    const crossEl = viz.querySelector('.ins-cross'), hovEl = viz.querySelector('.ins-hov');
    const show = i => {
      const p = pts[i]; if (!p) return;
      const x = X(p), y = Y(p.v);
      crossEl.setAttribute('x1', x.toFixed(1)); crossEl.setAttribute('x2', x.toFixed(1));
      hovEl.setAttribute('cx', x.toFixed(1)); hovEl.setAttribute('cy', y.toFixed(1));
      crossEl.style.display = 'block'; hovEl.style.display = 'block';
      tip.innerHTML = cfg.tip(p);
      tip.style.left = Math.min(88, Math.max(11, x / W * 100)) + '%';
      tip.style.top = (y / H * 100) + '%';
      tip.style.display = 'block';
    };
    const hide = () => { tip.style.display = 'none'; crossEl.style.display = 'none'; hovEl.style.display = 'none'; };
    const onPt = e => { const r = e.target.closest('.ins-hit'); if (r) show(+r.dataset.i); };
    svgEl.addEventListener('pointerover', onPt);
    svgEl.addEventListener('pointermove', onPt);
    svgEl.addEventListener('pointerdown', onPt);
    svgEl.addEventListener('pointerleave', hide);
    svgEl.addEventListener('pointercancel', hide);
  }

  UI.registerScreen({
    id: 'insights',
    render(el) {
      const head = `<header class="apphead">
        <button class="iconbtn" data-a="back" aria-label="${esc(t('g.back'))}">${UI.icon('chevL')}</button>
        <div class="apphead__titles"><h1 class="apphead__title">${esc(t('ins.title'))}</h1></div>
      </header>`;

      /* owner-only guard: staff never see analytics */
      if (!Store.isOwner) {
        el.innerHTML = head + `<div class="empty grow">${UI.icon('lock')}<div class="empty__t">${esc(t('login.locked'))}</div></div>`;
        el.addEventListener('click', e => { if (e.target.closest('[data-a=back]')) { UI.haptic('light'); UI.go('more'); } });
        return;
      }

      const st = Store.state, E = Store.Engine, today = Store.todayBd();
      const fromBd = E.addDays(today, -(range - 1));

      /* ---- daily non-void sold units over the range ---- */
      const sold = {};
      let totalSold = 0;
      for (const s of st.sales) {
        if (s.voidedAt || s.bd < fromBd || s.bd > today) continue;
        sold[s.bd] = (sold[s.bd] || 0) + s.qty;
        totalSold += s.qty;
      }
      totalSold = Math.round(totalSold * 100) / 100;
      const days = [];
      for (let i = 0; i < range; i++) days.push(E.addDays(fromBd, i));
      const trendPts = days.map((bd, i) => ({ bd, v: Math.round((sold[bd] || 0) * 100) / 100, x01: range === 1 ? .5 : i / (range - 1) }));

      const seg = `<div class="seg mb3" role="tablist" aria-label="${esc(t('rep.exportRange'))}">
        <button class="seg__btn ${range === 7 ? 'is-on' : ''}" data-range="7" role="tab" aria-selected="${range === 7}">${esc(t('ins.7d'))}</button>
        <button class="seg__btn ${range === 30 ? 'is-on' : ''}" data-range="30" role="tab" aria-selected="${range === 30}">${esc(t('ins.30d'))}</button>
      </div>`;

      /* ---- global empty gate: not enough history to analyse ---- */
      if (Store.closedCounts().length < 2 && totalSold === 0) {
        el.innerHTML = head + seg + `<div class="empty grow">${UI.icon('chart')}
          <div class="empty__t">${esc(t('ins.noData'))}</div>
          <div class="empty__s">${esc(t('ins.noDataSub'))}</div></div>`;
        wire(el);
        return;
      }

      /* ---- top 8 items by units ---- */
      const per = {};
      for (const s of st.sales) {
        if (s.voidedAt || s.bd < fromBd || s.bd > today) continue;
        per[s.itemId] = (per[s.itemId] || 0) + s.qty;
      }
      const top = Object.entries(per)
        .map(([id, q]) => ({ it: Store.item(id), q: Math.round(q * 100) / 100 }))
        .filter(x => x.it && x.q > 0)
        .sort((a, b) => b.q - a.q).slice(0, 8);
      const maxQ = top.length ? Math.max(top[0].q, .01) : 1;

      /* ---- shrinkage series clipped to range, re-based to range start ---- */
      const allShrink = E.shrinkageSeries(st);
      const beforePts = allShrink.filter(p => p.bd < fromBd);
      const baseCum = beforePts.length ? beforePts[beforePts.length - 1].cum : 0;
      const sPts = allShrink.filter(p => p.bd >= fromBd && p.bd <= today).map(p => ({
        bd: p.bd,
        v: Math.max(0, Math.round((p.cum - baseCum) * 100) / 100),
        x01: range === 1 ? .5 : Math.min(range - 1, Math.max(0, dayDiff(fromBd, p.bd))) / (range - 1),
      }));

      const hasCosts = st.items.some(i => i.active && i.cost != null && i.cost > 0);
      let lossVal = 0;
      for (const c of st.counts) {
        if (c.status !== 'closed' || c.isOpening || c.bd < fromBd || c.bd > today) continue;
        for (const l of c.lines) {
          if (l.variance >= 0) continue;
          const it = Store.item(l.itemId);
          if (it && it.cost != null) lossVal += -l.variance * it.cost;
        }
      }

      /* ---- stockout & reorder (14-day velocity) ---- */
      const items = Store.activeItems();
      const facts = items.map(it => {
        const v = E.velocity(st, it.id, today, 14);
        const stock = Store.stock(it.id);
        return { it, v, stock, d: E.daysUntilStockout(stock, v) };
      });
      const stockout = facts.filter(f => f.d !== null)
        .map(f => ({ ...f, d: Math.max(0, f.d) }))
        .sort((a, b) => a.d - b.d || b.v - a.v).slice(0, 6);
      const reorder = facts.filter(f => f.d !== null && f.d <= 7)
        .map(f => ({ ...f, d: Math.max(0, f.d), sug: Math.max(0, Math.ceil(f.v * 14 - f.stock)) }))
        .sort((a, b) => a.d - b.d);

      const subLine = f => `${UI.fmtQty(f.stock)} ${esc(t('u.' + f.it.unit))} · ${esc(t('ins.perDay', { n: UI.fmtQty(Math.round(f.v * 10) / 10) }))}`;

      el.innerHTML = head + seg + `
        <div class="card">
          <div class="card__head"><div class="card__title">${esc(t('ins.trend'))}</div>
            <span class="tt"><span class="num">${esc(UI.fmtQty(totalSold))}</span> ${esc(t('ins.units'))}</span></div>
          <div class="viz" data-viz="trend"></div>
        </div>

        <div class="card">
          <div class="card__head"><div class="card__title">${esc(t('ins.top'))}</div></div>
          ${top.length ? `<div class="ins-bars">${top.map((x, i) => `
            <div class="ins-brow">
              <span class="ins-bname">${esc(x.it.name)}</span>
              <span class="ins-btrack"><span class="ins-bfill" style="width:${Math.max(2, x.q / maxQ * 100).toFixed(1)}%;animation-delay:${i * 45}ms"></span></span>
              <span class="ins-bval num">${esc(UI.fmtQty(x.q))}</span>
            </div>`).join('')}</div>`
          : `<div class="ins-note">${esc(t('ins.noData'))}</div>`}
        </div>

        <div class="card">
          <div class="card__head"><div class="card__title">${esc(t('ins.shrink'))}</div></div>
          <p class="ins-hint">${esc(t('ins.shrinkHint'))}</p>
          ${sPts.length ? `<div class="viz" data-viz="shrink"></div>` : `<div class="ins-note">${esc(t('dash.noCountYet'))}</div>`}
          ${hasCosts ? `<div class="ins-loss"><span class="tt">${esc(t('rep.lossValue'))}</span><span class="num">${esc(UI.money(lossVal))}</span></div>` : ''}
        </div>

        <div class="card">
          <div class="card__head"><div class="card__title">${esc(t('ins.stockout'))}</div></div>
          ${stockout.length ? stockout.map(f => `
            <div class="row">
              <div class="row__art">${UI.art(f.it)}</div>
              <div class="row__body"><div class="row__t">${esc(f.it.name)}</div>
                <div class="row__s num">${subLine(f)}</div></div>
              <div class="row__end"><span class="pill ${f.d <= 3 ? 'pill--danger' : f.d <= 7 ? 'pill--warn' : 'pill--mut'} num">${esc(I18N.plural('ins.stockoutDays', f.d, { n: f.d }))}</span></div>
            </div>`).join('')
          : `<div class="ins-note">${esc(t('ins.noData'))}</div>`}
        </div>

        <div class="card">
          <div class="card__head"><div class="card__title">${esc(t('ins.reorder'))}</div></div>
          <p class="ins-hint">${esc(t('ins.reorderHint'))}</p>
          ${reorder.length ? reorder.map(f => `
            <div class="row">
              <div class="row__art">${UI.art(f.it)}</div>
              <div class="row__body"><div class="row__t">${esc(f.it.name)}</div>
                <div class="row__s num">${subLine(f)} · ${esc(I18N.plural('ins.stockoutDays', f.d, { n: f.d }))}</div></div>
              <div class="row__end"><div class="ins-rqty num">+${esc(UI.fmtQty(f.sug))}</div><div class="tt">${esc(t('ins.units'))}</div></div>
            </div>`).join('')
          : `<div class="ins-ok">${UI.icon('check')}<span>${esc(t('ins.reorderNone'))}</span></div>`}
        </div>`;

      /* ---- charts ---- */
      const tipFmt = p => `${esc(UI.fmtDate(p.bd))} · <span class="num">${esc(UI.fmtQty(p.v))}</span> ${esc(t('ins.units'))}`;

      let trendTicks;
      if (range <= 7) {
        trendTicks = trendPts.map(p => ({ x01: p.x01, label: wday(p.bd) }));
      } else {
        trendTicks = trendPts.filter((p, i) => i % 5 === 0 || i === trendPts.length - 1)
          .map(p => ({ x01: p.x01, label: String(new Date(p.bd + 'T12:00:00').getDate()), num: true }));
      }
      drawChart(el.querySelector('[data-viz=trend]'), {
        points: trendPts, color: 'var(--series-1)', h: 168, gradient: true,
        ticks: trendTicks, label: t('ins.trend'),
        endLabel: UI.fmtQty(trendPts[trendPts.length - 1].v),
        tip: tipFmt,
      });

      const shrinkViz = el.querySelector('[data-viz=shrink]');
      if (shrinkViz) {
        const sn = sPts.length;
        const soloAnchor = sPts[0].x01 > .8 ? 'end' : sPts[0].x01 < .2 ? 'start' : 'middle';
        let sTicks = [{ x01: sPts[0].x01, label: UI.fmtDate(sPts[0].bd, { day: 'numeric', month: 'short' }), anchor: sn > 1 ? 'start' : soloAnchor }];
        if (sn > 1 && sPts[sn - 1].x01 - sPts[0].x01 >= .25) {
          sTicks.push({ x01: sPts[sn - 1].x01, label: UI.fmtDate(sPts[sn - 1].bd, { day: 'numeric', month: 'short' }), anchor: 'end' });
        } else if (sn > 1) {
          sTicks = [{ x01: sPts[sn - 1].x01, label: UI.fmtDate(sPts[sn - 1].bd, { day: 'numeric', month: 'short' }), anchor: 'end' }];
        }
        drawChart(shrinkViz, {
          points: sPts, color: 'var(--danger)', h: 140, areaOp: .08,
          ticks: sTicks, label: t('ins.shrink'),
          endLabel: `${UI.fmtQty(sPts[sn - 1].v)} ${t('ins.units')}`,
          tip: tipFmt,
        });
      }

      wire(el);

      function wire(root) {
        root.addEventListener('click', e => {
          if (e.target.closest('[data-a=back]')) { UI.haptic('light'); return UI.go('more'); }
          const b = e.target.closest('[data-range]');
          if (b) {
            const r = +b.dataset.range;
            if (r !== range) { range = r; UI.haptic('light'); UI.refresh(); }
          }
        });
      }
    },
  });
})();

  function ownerPinSheet() {
    let step = 0, val = '', newPin = '', busy = false;
    const c = UI.el(`<div>
      <h2 style="font-size:18px;margin-bottom:2px">${esc(t('set.ownerPin'))}</h2>
      <p data-r="step" style="color:var(--text-2);font-size:13.5px">${esc(t('set.pinCurrent'))}</p>
      <div class="pinDots" data-r="dots"><i></i><i></i><i></i><i></i></div>
      <div data-r="pad"></div>
    </div>`);
    const sh = UI.sheet(c);
    const stepEl = c.querySelector('[data-r=step]');
    const dotsEl = c.querySelector('[data-r=dots]');
    const paint = () => {
      stepEl.textContent = [t('set.pinCurrent'), t('set.pinNew'), t('wiz.ownerPinConfirm')][step];
      [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i < val.length));
    };
    const shake = () => { dotsEl.classList.remove('shake'); void dotsEl.offsetWidth; dotsEl.classList.add('shake'); UI.haptic('warn'); };
    UI.numpad(c.querySelector('[data-r=pad]'), {
      onKey: async k => {
        if (busy) return;
        if (k === 'del') val = val.slice(0, -1);
        else if (k !== 'dot' && val.length < 4) val += k;
        paint();
        if (val.length < 4) return;
        busy = true;
        const pin = val;
        await new Promise(r => setTimeout(r, 160));
        if (step === 0) {
          // verify by re-logging the same owner session (acceptable side effect), then bounce back
          if (await Store.loginOwner(pin)) { UI.go('settings'); step = 1; val = ''; }
          else { shake(); UI.toast(t('login.pinWrong'), { type: 'danger' }); val = ''; }
        } else if (step === 1) {
          newPin = pin; step = 2; val = '';
        } else if (pin === newPin) {
          await Store.setOwnerPin(pin);
          UI.haptic('success'); sh.close(); UI.toast(t('set.pinChanged'), { type: 'ok' });
          busy = false; return;
        } else {
          shake(); UI.toast(t('wiz.pinMismatch'), { type: 'danger' });
          step = 1; newPin = ''; val = '';
        }
        paint(); busy = false;
      },
    });
  }

  function restoreFlow() {
    const inp = document.createElement('input');
    inp.type = 'file';

    inp.style.display = 'none';
    inp.addEventListener('change', async () => {
      const f = inp.files[0];
      inp.remove();
      if (!f) return;
      let text;
      try { text = await f.text(); }
      catch (e) { UI.toast(t('g.error'), { type: 'danger' }); return; }
      const ok = await UI.confirm(t('set.restoreWarn'), { danger: true, title: t('set.restore'), yes: t('set.restore') });

      catch (e) { UI.toast(t('g.error'), { type: 'danger' }); }
    });
    document.body.appendChild(inp);
    inp.click();
  }

  async function onClick(e) {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    const a = b.dataset.a;
    const s = S();
    if (a === 'back') { UI.haptic('light'); UI.go('more'); return; }
    if (a === 'lang') {
      const v = b.dataset.v;
      if (v !== s.lang) { Store.setSettings({ lang: v }); UI.refresh(); saved(); }
      return;
    }
    if (a === 'logo-pick') {
      const uri = await UI.pickImage();
      if (uri) { Store.setSettings({ logo: uri }); saved(); }
      return;
    }
    if (a === 'logo-rm') { Store.setSettings({ logo: null }); saved(); return; }
    if (a === 'team-add') { addMemberSheet(); return; }
    if (a === 'emp-pin') { staffPinSheet(b.dataset.id); return; }
    if (a === 'emp-act') {
      const emp = Store.state.employees.find(x => x.id === b.dataset.id);
      if (!emp) return;
      if (emp.active) {
        if (await UI.confirm(t('set.teamDeactivateWarn', { name: emp.name }), { danger: true, title: t('set.teamDeactivate'), yes: t('set.teamDeactivate') })) {
          Store.setEmployeeActive(emp.id, false); UI.haptic('warn'); saved();
        }
      } else if (await UI.confirm(t('set.teamReactivateWarn', { name: emp.name }), { title: t('set.teamReactivate'), yes: t('set.teamReactivate') })) {
        Store.setEmployeeActive(emp.id, true); UI.haptic('success'); saved();
      }
      return;
    }
    if (a === 'requirePin') { UI.haptic('light'); Store.setSettings({ requireStaffPin: !s.requireStaffPin }); saved(); return; }
    if (a === 'owner-pin') { ownerPinSheet(); return; }
    if (a === 'var-' || a === 'var+') {
      const v = Math.min(10, Math.max(1, (s.varThreshold || 2) + (a === 'var+' ? 1 : -1)));
      if (v !== s.varThreshold) { UI.haptic('light'); Store.setSettings({ varThreshold: v }); }
      return;
    }
    if (a === 'notif') { toggleNotifs(); return; }
    if (a === 'costs') {
      costsOpen = !costsOpen;
      if (!costsOpen) costFocusId = null;
      UI.haptic('light'); UI.refresh();
      return;
    }
    if (a === 'backup') {
      UI.haptic('success');
      UI.download('bartally-backup-' + Store.todayBd() + '.json', Store.exportJSON(), 'application/json');
      return;
    }
    if (a === 'restore') { restoreFlow(); return; }
    if (a === 'demo-clear') {
      if (await UI.confirm(t('set.demoClearWarn'), { danger: true, title: t('set.demoClear'), yes: t('set.demoClear') })) Store.resetAll();
      return;
    }
    if (a === 'reset') {
      if (await UI.confirm(t('set.resetWarn'), { danger: true, title: t('set.reset'), yes: t('set.reset') })) Store.resetAll();
      return;
    }
    if (a === 'audit') { auditSheet(); return; }
  }

  function onChange(e) {
    const tgt = e.target;
    const s = S();
    if (tgt.dataset.r === 'barname') {
      const v = tgt.value.trim();
      if (v && v !== s.barName) { Store.setSettings({ barName: v }); saved(); }
      else if (!v) tgt.value = s.barName;
      return;
    }
    if (tgt.dataset.r === 'cutoff') {
      const v = +tgt.value;
      if (v !== s.cutoffHour) { Store.setSettings({ cutoffHour: v }); saved(); }
      return;
    }
    if (tgt.dataset.r === 'cur') {
      const v = tgt.value.trim().toUpperCase();
      if (v.length < 3 || v.length > 5) { tgt.value = s.currency; UI.toast(t('set.curLen'), { type: 'danger' }); }
      else if (v !== s.currency) { Store.setSettings({ currency: v }); saved(); }
      return;
    }
    if (tgt.dataset.cost) {
      const it = Store.item(tgt.dataset.cost);
      if (!it) return;
      const raw = tgt.value.trim().replace(',', '.');
      let cost = raw === '' ? null : Number(raw);
      if (cost != null && (!isFinite(cost) || cost < 0)) { tgt.value = it.cost ?? ''; return; }
      if (cost != null) cost = Math.round(cost * 100) / 100;
      if (cost !== (it.cost ?? null)) { Store.saveItem({ id: it.id, cost }); saved(); }
    }
  }

  /* ---------- screen ---------- */

  UI.registerScreen({
    id: 'settings',
    render(el) {
      if (!Store.isOwner) {
        el.innerHTML = `<div class="empty grow">${UI.icon('lock')}<div class="empty__t">${esc(t('login.locked'))}</div></div>`;
        return;
      }
      const s = S();
      el.innerHTML = `
        <header class="apphead">
          <button class="iconbtn" data-a="back" aria-label="${esc(t('g.back'))}">${UI.icon('chevL')}</button>
          <div class="apphead__titles"><h1 class="apphead__title">${esc(t('set.title'))}</h1>
            ${s.barName ? `<div class="apphead__sub">${esc(s.barName)}</div>` : ''}</div>
        </header>
        ${barCard(s)}
        ${teamCard(s)}
        ${ownerPinCard()}
        ${alertsCard(s)}
        ${costsCard(s)}
        ${dataCard(s)}
        ${auditCard()}
        ${aboutCard()}`;
      /* keep focus on the cost input the user is moving to across store-driven re-renders */
      if (costsOpen && costFocusId) {
        const inp = el.querySelector(`[data-cost="${costFocusId}"]`);
        if (inp && document.activeElement !== inp) inp.focus();
      }
      el.addEventListener('click', onClick);
      el.addEventListener('change', onChange);
      el.addEventListener('focusin', e => { costFocusId = (e.target.dataset && e.target.dataset.cost) || null; });
    },
  });
})();

/* ============ boot + "Plus" menu screen ============ */
UI.registerScreen({
  id: 'more',
  render(el) {
    const s = Store.state.settings;
    el.innerHTML = UI.header(t('tab.more'), s.barName) + `
      <div class="card" style="padding:6px 16px">
        ${[
          ['reports', 'calendar', 'rep.title'],
          ['insights', 'chart', 'ins.title'],
          ['restock', 'truck', 'restock.title'],
          ['waste', 'spill', 'waste.title'],
          ['settings', 'gear', 'set.title'],
        ].map(([id, ic, key]) => `
          <button class="row" style="width:100%;text-align:left" data-go="${id}">
            <span class="iconbtn iconbtn--plain" style="color:var(--gold)">${UI.icon(ic)}</span>
            <span class="row__body"><span class="row__t">${UI.esc(t(key))}</span></span>
            <span style="color:var(--text-3)">${UI.icon('chevR')}</span>
          </button>`).join('')}
      </div>
      <div class="card" style="padding:6px 16px">
        <button class="row" style="width:100%;text-align:left" data-a="lock">
          <span class="iconbtn iconbtn--plain" style="color:var(--text-2)">${UI.icon('lock')}</span>
          <span class="row__body"><span class="row__t">${UI.esc(t('login.switchUser'))}</span></span>
        </button>
      </div>`;
    el.addEventListener('click', e => {
      const g = e.target.closest('[data-go]');
      if (g) return UI.go(g.dataset.go);
      if (e.target.closest('[data-a=lock]')) { Store.logout(); }
    });
  },
});

const App = {
  start() {
    I18N.lang = Store.state.settings.lang || 'fr';
    let raf = null;
    Store.on(what => {
      if (what === 'session' || what === 'all') return App.route();
      if (raf) return;
      raf = requestAnimationFrame(() => { raf = null; UI.refresh(); });
    });
    this.route();
    this.countReminder();
    // PWA service worker (no-op where sw.js doesn't exist, e.g. artifact preview)
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  },
  route() {
    const st = Store.state;
    if (!st.settings.setupDone) return UI.go('welcome');
    if (!st.session) return UI.go('login');
    UI.go(Store.isOwner ? 'dashboard' : 'sell');
  },
  countReminder() {
    const st = Store.state;
    if (!st.settings.setupDone) return;
    const yesterday = Store.Engine.addDays(Store.todayBd(), -1);
    const has = st.counts.some(c => c.bd >= yesterday && c.status === 'closed');
    const already = st.notifs.some(n => n.type === 'reminder' && n.bd === Store.todayBd());
    if (!has && !already && new Date().getHours() >= 11) {
      Store.notify('reminder', { date: UI.fmtDate(yesterday) });
    }
  },
};
window.addEventListener('DOMContentLoaded', () => App.start());

</script>
