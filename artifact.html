        <p class="sub2">${esc(t('wiz.stockHint'))}</p>
        ${groups}
        <div class="bottomstack"><button class="btn btn--gold" data-a="next">${esc(t('g.next'))}</button></div>`;
    } else {
      W.items = W.items || Store.SEED.build();
      const opening = collectOpening();
      const filled = W.items.filter(it => opening[it.id] > 0).length;
      const rows = [
        [t('wiz.barName'), W.barName.trim()],
        [t('wiz.ownerName'), W.ownerName.trim() || t('g.owner')],
        [t('wiz.staff'), I18N.plural('wiz.sumTeam', W.employees.length)],
        [t('wiz.stock'), I18N.plural('wiz.sumStock', filled)],
      ];
      body = `
        <div class="h1">${esc(t('wiz.ready'))}</div>
        <p class="sub2">${esc(t('wiz.readySub'))}</p>
        <div class="mt4">${rows.map(([l, v]) => `<div class="sumrow"><span>${esc(l)}</span><b>${esc(v)}</b></div>`).join('')}</div>
        <div class="bottomstack"><button class="btn btn--gold" data-a="finish">${esc(t('wiz.finish'))}</button></div>`;
    }

    view.innerHTML = wizTop() + `<div class="wiz fade" data-step="${W.step}">${body}</div>`;
    if (W.step === 2) UI.numpad(view.querySelector('[data-np]'), { decimal: false, onKey: k => onWizPin(k, view, el) });

    view.addEventListener('click', e => {
      const rm = e.target.closest('[data-rm]');
      if (rm) { W.employees.splice(+rm.dataset.rm, 1); UI.haptic('light'); paintWelcome(el); return; }
      const b = e.target.closest('[data-a]');
      if (!b) return;
      const a = b.dataset.a;
      if (a === 'back') wizBack(el);
      else if (a === 'next') wizNext(el);
      else if (a === 'addEmp') addEmp(view, el);
      else if (a === 'finish') finishSetup(b, el);
    });
    view.addEventListener('input', e => {
      const f = e.target.dataset.f;
      if (f) {
        W[f] = e.target.value;
        if (f === 'barName') { const nb = view.querySelector('[data-a=next]'); if (nb) nb.disabled = !W.barName.trim(); }
      }
      const id = e.target.dataset.item;
      if (id) {
        const itm = (W.items || []).find(i => i.id === id);
        const clean = e.target.value.replace(itm && !itm.allowDecimal ? /[^\d]/g : /[^\d.,]/g, '');
        if (clean !== e.target.value) e.target.value = clean;
        W.opening[id] = clean;
      }
    });
    view.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const f = e.target.dataset.f;
      if ((f === 'barName' || f === 'ownerName') && W.barName.trim()) wizNext(el);
      else if (f === 'empName') addEmp(view, el);
      else if (e.target.dataset.item) e.target.blur();
    });
  }

  function wizNext(el) {
    UI.haptic('light');
    if (W.step === 1) {
      if (!W.barName.trim()) return;
      W.step = 2; W.pinPhase = 'set'; W.pin1 = ''; W.pinEntry = ''; W.pinErr = '';
    } else if (W.step === 3) W.step = 4;
    else if (W.step === 4) W.step = 5;
    paintWelcome(el);
  }

  function wizBack(el) {
    UI.haptic('light');
    if (W.step === 2) {
      if (W.pinPhase === 'confirm') W.pinPhase = 'set';
      else W.step = 1;
      W.pin1 = ''; W.pinEntry = ''; W.pinErr = '';
    } else if (W.step > 0) {
      W.step -= 1;
      if (W.step === 2) { W.pinPhase = 'set'; W.pin1 = ''; W.pinEntry = ''; W.pinErr = ''; }
    }
    paintWelcome(el);
  }

  function onWizPin(k, view, el) {
    if (W.busy) return;
    if (k === 'del') W.pinEntry = W.pinEntry.slice(0, -1);
    else if (/^\d$/.test(k) && W.pinEntry.length < 4) W.pinEntry += k;
    else return;
    if (W.pinErr) {
      W.pinErr = '';
      const er = view.querySelector('[data-err]');
      if (er) { er.classList.remove('is-err'); er.textContent = ''; }
    }
    const dots = view.querySelector('[data-dots]');
    if (dots) dots.querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i < W.pinEntry.length));
    if (W.pinEntry.length < 4) return;
    W.busy = true;
    setTimeout(() => {
      if (W.pinPhase === 'set') {
        W.busy = false;
        W.pin1 = W.pinEntry; W.pinPhase = 'confirm'; W.pinEntry = '';
        paintWelcome(el);
      } else if (W.pinEntry === W.pin1) {
        W.busy = false;
        W.pin = W.pinEntry;
        UI.haptic('success');
        W.step = 3;
        paintWelcome(el);
      } else {
        UI.haptic('warn');
        W.pinErr = t('wiz.pinMismatch');
        if (dots && dots.isConnected) {
          dots.classList.add('shake');
          const er = view.querySelector('[data-err]');
          if (er) { er.textContent = W.pinErr; er.classList.add('is-err'); }
        }
        setTimeout(() => {
          W.busy = false;
          W.pinPhase = 'set'; W.pin1 = ''; W.pinEntry = '';
          paintWelcome(el);
        }, 650);
      }
    }, 160);
  }

  function addEmp(view, el) {
    const inp = view.querySelector('[data-f=empName]');
    const name = (inp ? inp.value : W.empName).trim();
    if (!name) { if (inp) inp.focus(); return; }
    W.employees.push(name);
    W.empName = '';
    UI.haptic('light');
    paintWelcome(el);
    const ninp = el.querySelector('[data-f=empName]');
    if (ninp) ninp.focus();
  }

  async function finishSetup(btn, el) {
    if (W.busy) return;
    if (!W.pin || W.pin.length !== 4) { // safety net: PIN somehow missing → back to PIN step
      W.step = 2; W.pinPhase = 'set'; W.pin1 = ''; W.pinEntry = ''; W.pinErr = '';
      paintWelcome(el);
      return;
    }
    W.busy = true;
    btn.disabled = true;
    btn.textContent = t('g.loading');
    try {
      W.items = W.items || Store.SEED.build();
      await Store.setupReal({
        barName: W.barName.trim(),
        ownerName: W.ownerName.trim(),
        pin: W.pin,
        employees: W.employees.map(n => n.trim()).filter(Boolean),
        opening: collectOpening(),
      }); // emits 'all' → App.route() takes over
      UI.haptic('success');
      UI.toast(t('wiz.openingSaved'), { type: 'ok' });
      resetW();
    } catch (err) {
      W.busy = false;
      UI.toast(t('g.error'), { type: 'danger' });
      paintWelcome(el);
    }
  }

  UI.registerScreen({ id: 'welcome', bare: true, render(el) { paintWelcome(el); } });

  /* ================================================================
     LOGIN — daily unlock: user rows → PIN pad */
  const L = { view: 'grid', target: null, pin: '', busy: false };
  function resetL() { L.view = 'grid'; L.target = null; L.pin = ''; L.busy = false; }

  function paintLogin(el) {
    el.innerHTML = '';
    el.insertAdjacentHTML('afterbegin', langToggle());
    if (L.view === 'pin' && L.target && L.target.type === 'emp') {
      const emp = Store.state.employees.find(x => x.id === L.target.id && x.active);
      if (!emp) resetL(); // employee deactivated meanwhile → back to grid
    }
    const view = UI.el('<div class="grow" style="display:flex;flex-direction:column"></div>');
    el.appendChild(view);
    if (L.view === 'grid') paintUserGrid(view, el);
    else paintPinPad(view, el);
  }

  /* initials tile: standard t40 tile, monogram brass for owner / t2 for staff — no new art */
  const userArt = (name, owner) =>
    `<span class="row__art tile t40"><span class="mono" style="color:${owner ? 'var(--brass)' : 'var(--t2)'}">${esc(initials(name))}</span></span>`;

  function paintUserGrid(view, el) {
    const s = Store.state.settings;
    const emps = Store.state.employees.filter(e => e.active);
    const ownerName = s.ownerName || t('g.owner');
    view.innerHTML = `
      <div class="topbar">${UI.logoMark(26)}</div>
      <div class="h1">${esc(s.barName || 'BarTally')}</div>
      <div class="sub2">${esc(t('login.subtitle'))}</div>
      <div class="mt4">
        <button class="row" data-owner>
          ${userArt(ownerName, true)}
          <span class="row__body"><span class="row__t">${esc(ownerName)}</span><span class="row__s">${esc(t('g.owner'))}</span></span>
          <span class="chev">›</span>
        </button>
        ${emps.map(e2 => `
          <button class="row" data-emp="${esc(e2.id)}">
            ${userArt(e2.name, false)}
            <span class="row__body"><span class="row__t">${esc(e2.name)}</span></span>
            <span class="chev">›</span>
          </button>`).join('')}
      </div>`;
    view.addEventListener('click', async e => {
      if (e.target.closest('[data-owner]')) {
        UI.haptic('light');
        L.view = 'pin'; L.target = { type: 'owner', name: Store.state.settings.ownerName || t('g.owner') }; L.pin = ''; L.busy = false;
        paintLogin(el);
        return;
      }
      const eb = e.target.closest('[data-emp]');
      if (!eb) return;
      const emp = Store.state.employees.find(x => x.id === eb.dataset.emp && x.active);
      if (!emp) return;
      UI.haptic('light');
      if (Store.state.settings.requireStaffPin && emp.pinHash) {
        L.view = 'pin'; L.target = { type: 'emp', id: emp.id, name: emp.name }; L.pin = ''; L.busy = false;
        paintLogin(el);
        return;
      }
      if (Store.state.settings.requireStaffPin && !emp.pinHash) {
        UI.toast(t('login.pinNeeded', { name: emp.name }), { type: 'danger' });
        return;
      }
      if (L.busy) return;
      L.busy = true;
      const ok = await Store.loginEmployee(emp.id); // emits 'session' → App.route()
      if (ok) { UI.haptic('success'); resetL(); }
      else { L.busy = false; UI.toast(t('g.error'), { type: 'danger' }); }
    });
  }

  function paintPinPad(view, el) {
    const isOwner = L.target.type === 'owner';
    const nDots = isOwner ? 4 : Math.min(6, Math.max(4, L.pin.length));
    view.innerHTML = `
      <div class="topbar"><button class="back" data-a="back">‹ ${esc(t('g.back'))}</button></div>
      <div class="pad">
        <div class="micro">${esc(isOwner ? t('login.ownerPin') : t('login.staffPin', { name: L.target.name }))}</div>
        ${dotsHtml(nDots, L.pin.length)}
        <div class="perr" data-err aria-live="polite"></div>
        ${isOwner && Store.state.settings.demoMode ? `<div class="sub2" style="text-align:center">${esc(t('login.demoPin'))}</div>` : ''}
        <div data-np></div>
        ${isOwner ? '' : `<button class="btn btn--gold btn--full mt3" data-a="pinok" ${L.pin.length >= 4 ? '' : 'disabled'}>${esc(t('g.confirm'))}</button>`}
        ${isOwner ? `<button class="textbtn mt3" data-a="forgot">${esc(t('login.forgot'))}</button>` : ''}
      </div>`;
    UI.numpad(view.querySelector('[data-np]'), { decimal: false, onKey: k => onLoginKey(k, view, el) });
    view.addEventListener('click', async e => {
      const b = e.target.closest('[data-a]');
      if (!b) return;
      if (b.dataset.a === 'back') { UI.haptic('light'); resetL(); paintLogin(el); }
      else if (b.dataset.a === 'pinok') submitPin(view, el);
      else if (b.dataset.a === 'forgot') openForgotSheet();
    });
  }

  /* forgot-PIN: guarded erase sheet — backup offer + type-the-bar-name confirmation */
  function openForgotSheet() {
    const normName = s => String(s || '').normalize('NFD').replace(new RegExp('[\\u0300-\\u036f]', 'g'), '').trim().toLowerCase();
    const c = UI.el(`<div data-screen="login">
      <div class="sheetname" style="text-align:center">${esc(t('login.forgot'))}</div>
      <p class="sub2" style="text-align:center;line-height:1.6">${esc(t('login.forgotHint'))}</p>
      <button class="btn btn--gold btn--full mt4" type="button" data-a="fgdl">${esc(t('login.forgotBackup'))}</button>
      <div class="field" style="margin-top:16px"><label for="fg-bar">${esc(t('login.forgotType'))}</label>
        <input id="fg-bar" type="text" data-f="fgbar" autocomplete="off" placeholder="${esc(Store.state.settings.barName || '')}"></div>
      <button class="btn btn--danger btn--full" type="button" data-a="fgerase" disabled>${esc(t('set.reset'))}</button>
    </div>`);
    UI.sheet(c);
    const inp = c.querySelector('[data-f=fgbar]');
    const eraseBtn = c.querySelector('[data-a=fgerase]');
    inp.addEventListener('input', () => {
      eraseBtn.disabled = normName(inp.value) !== normName(Store.state.settings.barName);
    });
    c.addEventListener('click', e => {
      const b = e.target.closest('[data-a]');
      if (!b) return;
      if (b.dataset.a === 'fgdl') {
        UI.haptic('light');
        UI.download('bartally-backup.json', Store.exportJSON(), 'application/json');
      } else if (b.dataset.a === 'fgerase') {
        if (normName(inp.value) !== normName(Store.state.settings.barName)) return;
        UI.haptic('warn');
        Store.resetAll();
      }
    });
  }

  function refreshLoginDots(view) {
    const isOwner = L.target && L.target.type === 'owner';
    const nDots = isOwner ? 4 : Math.min(6, Math.max(4, L.pin.length));
    const dots = view.querySelector('[data-dots]');
    if (dots) dots.outerHTML = dotsHtml(nDots, L.pin.length);
  }

  function onLoginKey(k, view, el) {
    if (L.busy || !L.target) return;
    const isOwner = L.target.type === 'owner';
    const max = isOwner ? 4 : 6;
    if (k === 'del') L.pin = L.pin.slice(0, -1);
    else if (/^\d$/.test(k) && L.pin.length < max) L.pin += k;
    else return;
    const er = view.querySelector('[data-err]');
    if (er && er.classList.contains('is-err')) { er.classList.remove('is-err'); er.textContent = ''; }
    refreshLoginDots(view);
    const okBtn = view.querySelector('[data-a=pinok]');
    if (okBtn) okBtn.disabled = L.pin.length < 4;
    if ((isOwner && L.pin.length === 4) || (!isOwner && L.pin.length === 6)) submitPin(view, el);
  }

  async function submitPin(view, el) {
    if (L.busy || !L.target || L.pin.length < 4) return;
    L.busy = true;
    const okBtn = view.querySelector('[data-a=pinok]');
    if (okBtn) okBtn.disabled = true;
    let ok = false;
    try {
      ok = L.target.type === 'owner'
        ? await Store.loginOwner(L.pin)
        : await Store.loginEmployee(L.target.id, L.pin);
    } catch (e) { ok = false; }
    if (ok) { UI.haptic('success'); resetL(); return; } // 'session' event routes to the app
    L.busy = false;
    UI.haptic('warn');
    if (!view.isConnected) return;
    const dots = view.querySelector('[data-dots]');
    if (dots) dots.classList.add('shake');
    const er = view.querySelector('[data-err]');
    if (er) { er.textContent = t('login.pinWrong'); er.classList.add('is-err'); }
    setTimeout(() => {
      L.pin = '';
      if (!view.isConnected) return;
      refreshLoginDots(view);
      const ob = view.querySelector('[data-a=pinok]');
      if (ob) ob.disabled = true;
    }, 520);
  }

  UI.registerScreen({ id: 'login', bare: true, render(el) { paintLogin(el); } });
})();

/* == 21-screen-sell.js == */
/* ============ Screen: sell — reference frame 02. Two gestures: tile → validate. ============ */
(() => {
  'use strict';

  I18N.extend({
    fr: {
      'sell.stockEst': 'Stock estimé · {n}',
      'sell.validate': 'Valider la vente',
      'sell.lock': 'Verrouiller',
    },
    en: {
      'sell.stockEst': 'Estimated stock · {n}',
      'sell.validate': 'Confirm sale',
      'sell.lock': 'Lock',
    },
  });

  document.head.appendChild(UI.el(`<style>
  [data-screen=sell] .topbar{display:flex;justify-content:space-between;align-items:center;min-height:26px}
  [data-screen=sell] .h1{font:600 24px/1.2 var(--f-display);letter-spacing:-.01em;margin-top:8px}
  [data-screen=sell] .lockbtn{font-size:13px;font-weight:500;color:var(--t3)}
  [data-screen=sell] .scanbtn{width:32px;height:32px;border:0;display:flex;align-items:center;justify-content:center;color:var(--t3)}
  [data-screen=sell] .scanbtn svg{width:18px;height:18px}
  [data-screen=sell] .topside{display:flex;align-items:center;gap:8px}
  </style>`));

  const V = { q: '', cat: 'all' };
  const norm = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  function qtySheet(item) {
    const step = item.allowDecimal ? 0.5 : 1;
    let qty = 1;
    const c = UI.el(`<div>
      <div class="sheetrow">
        <div class="tile t40">${UI.art(item)}</div>
        <div><div class="sheetname">${UI.esc(item.name)}</div>
        <div class="sheetsub tnum">${UI.esc(t('sell.stockEst', { n: UI.fmtQty(Store.stock(item.id)) }))}</div></div>
      </div>
      <div class="stepper">
        <button class="stepper__btn" data-a="minus" aria-label="−">−</button>
        <div class="stepper__v tnum" data-v>1</div>
        <button class="stepper__btn" data-a="plus" aria-label="+">+</button>
      </div>
      <button class="btn btn--gold btn--full" data-a="ok">${UI.esc(t('sell.validate'))}</button>
    </div>`);
    const sh = UI.sheet(c);
    const vEl = c.querySelector('[data-v]');
    c.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      if (b.dataset.a === 'minus') { qty = Math.max(step, Math.round((qty - (qty > 1 ? 1 : step)) * 100) / 100); vEl.textContent = UI.fmtQty(qty); UI.haptic('light'); }
      if (b.dataset.a === 'plus') { qty = Math.round((qty + (qty >= 1 ? 1 : step)) * 100) / 100; vEl.textContent = UI.fmtQty(qty); UI.haptic('light'); }
      if (b.dataset.a === 'ok') {
        const entry = Store.logSale(item.id, qty);
        UI.haptic('light');
        sh.close();
        if (entry) UI.toast(t('sell.logged', { qty: UI.fmtQty(qty), item: item.name }), {
          type: 'ok', action: { label: t('g.undo'), fn: () => { Store.undoSale(entry.id); } },
        });
      }
    });
  }

  function openScan() {
    UI.scan({
      onCode: code => {
        const item = Store.findByBarcode(code);
        if (item) qtySheet(item);
        else UI.toast(t('sell.noresults'), { type: 'danger' });
      },
    });
  }

  UI.registerScreen({
    id: 'sell',
    render(el, params) {
      if (!Store.state.session) { UI.go('login'); return; }
      const owner = Store.isOwner;
      const cats = [...Store.state.categories].sort((a, b) => a.sort - b.sort);
      const items = Store.activeItems();
      const nq = norm(V.q);
      const visible = items.filter(it =>
        (!nq || norm(it.name).includes(nq)) &&
        (V.cat === 'all' || it.catId === V.cat));
      const pinned = items.filter(i => i.pinned).slice(0, 5);

      el.innerHTML = `
        <div class="topbar">
          ${owner ? `<button class="back" data-a="back">‹ ${UI.esc(t('g.back'))}</button>` : `${UI.logoMark(26)}`}
          <div class="topside">
            <button class="scanbtn" data-a="scan" aria-label="${UI.esc(t('sell.scan'))}">${UI.icon('scan')}</button>
            ${owner ? '' : `<button class="lockbtn" data-a="lock">${UI.esc(t('sell.lock'))}</button>`}
          </div>
        </div>
        <div class="h1">${UI.esc(t('sell.title'))}</div>
        <div class="search">
          ${UI.icon('search')}
          <input type="text" placeholder="${UI.esc(t('g.search'))}" value="${UI.esc(V.q)}" aria-label="${UI.esc(t('g.search'))}">
          ${V.q ? `<button class="iconbtn search__clear" data-a="clear" aria-label="×">${UI.icon('x')}</button>` : ''}
        </div>

        ${(!nq && V.cat === 'all' && pinned.length) ? `
          <div class="sec"><div class="micro">${UI.esc(t('sell.favorites'))}</div></div>
          <div class="tilerow">${pinned.map(it => `
            <button class="tile t56" data-item="${it.id}" aria-label="${UI.esc(it.name)}">${UI.art(it)}</button>`).join('')}
          </div>` : ''}

        <div class="chips">
          <button class="chip ${V.cat === 'all' ? 'is-on' : ''}" data-cat="all"><span class="dot"></span>${UI.esc(t('g.all'))}</button>
          ${cats.map(c => `<button class="chip ${V.cat === c.id ? 'is-on' : ''}" data-cat="${c.id}"><span class="dot" style="background:${c.hex}"></span>${UI.esc(Store.catName(c))}</button>`).join('')}
        </div>

        ${visible.length ? `<div class="igrid">${visible.map(it => `
          <button class="icard" data-item="${it.id}">
            <div class="icard__art">${UI.art(it, '', { qty: UI.fmtQty(Store.stock(it.id)) })}</div>
            <div class="icard__name">${UI.esc(it.name)}</div>
          </button>`).join('')}</div>`
          : `<div class="empty"><div class="empty__t">${UI.esc(t('sell.noresults'))}</div><div class="empty__s">${UI.esc(t('sell.noresults.hint'))}</div></div>`}
      `;

      const input = el.querySelector('.search input');
      input.addEventListener('input', () => { V.q = input.value; UI.refresh(); });
      if (V.q) { requestAnimationFrame(() => { const i2 = el.querySelector('.search input'); if (i2) { i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); } }); }

      el.addEventListener('click', e => {
        const cat = e.target.closest('[data-cat]');
        if (cat) { V.cat = cat.dataset.cat; UI.haptic('light'); UI.refresh(); return; }
        const itEl = e.target.closest('[data-item]');
        if (itEl) { const item = Store.item(itEl.dataset.item); if (item) qtySheet(item); return; }
        const a = e.target.closest('[data-a]');
        if (!a) return;
        if (a.dataset.a === 'back') UI.go('dashboard');
        else if (a.dataset.a === 'lock') Store.logout();
        else if (a.dataset.a === 'scan') openScan();
        else if (a.dataset.a === 'clear') { V.q = ''; UI.refresh(); }
      });
    },
  });
})();

/* == 22-screen-dashboard.js == */
/* ============ Screen: dashboard — reference frame 01, live data ============ */
(() => {
  'use strict';

  I18N.extend({
    fr: {
      'dash.concerned_one': '{n} article concerné',
      'dash.concerned_many': '{n} articles concernés',
      'dash.cleanLast': 'Comptage propre',
      'dash.vsYest': '{sign}{pct}% vs hier',
      'dash.lowNone': 'Aucun article sous le seuil',
      'dash.feedNone': 'Les ventes du soir apparaîtront ici.',
      'dash.alertsN': 'Alertes {n}',
    },
    en: {
      'dash.concerned_one': '{n} item concerned',
      'dash.concerned_many': '{n} items concerned',
      'dash.cleanLast': 'Clean count',
      'dash.vsYest': '{sign}{pct}% vs yesterday',
      'dash.lowNone': 'No item under threshold',
      'dash.feedNone': 'Tonight’s sales will appear here.',
      'dash.alertsN': 'Alerts {n}',
    },
  });

  document.head.appendChild(UI.el(`<style>
  [data-screen=dashboard] .topbar{display:flex;justify-content:space-between;align-items:center;min-height:26px}
  [data-screen=dashboard] .topbar .side{display:flex;align-items:center;gap:14px}
  [data-screen=dashboard] .eyebrow{margin-top:16px}
  [data-screen=dashboard] .spark{margin-top:12px;display:block}
  [data-screen=dashboard] .alink{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--bad)}
  </style>`));

  function todaySales() {
    const bd = Store.todayBd();
    return Store.state.sales.filter(s => s.bd === bd && !s.voidedAt);
  }
  function unitsOn(bd) {
    let n = 0;
    for (const s of Store.state.sales) if (s.bd === bd && !s.voidedAt) n += s.qty;
    return Math.round(n * 100) / 100;
  }
  function sparkline() {
    const today = Store.todayBd();
    const days = [];
    for (let i = 6; i >= 0; i--) days.push(unitsOn(Store.Engine.addDays(today, -i)));
    const max = Math.max(...days, 1);
    const pts = days.map((v, i) => `${(i * 96 / 6).toFixed(1)},${(22 - (v / max) * 16 + 2).toFixed(1)}`).join(' ');
    return `<svg class="spark" viewBox="0 0 96 26" width="96" height="26" fill="none" aria-hidden="true">
      <polyline points="${pts}" stroke="var(--brass)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  }

  function alertsSheet() {
    const ns = Store.state.notifs;
    const rows = ns.length ? ns.slice(0, 30).map(n => `
      <div class="row">
        <div class="row__body">
          <span class="row__t" style="${n.read ? 'color:var(--t3)' : ''}">${UI.esc(window.__notifText(n.type, n.payload))}</span>
          <span class="row__s tnum">${UI.esc(UI.fmtDate(n.bd))} · ${UI.esc(UI.fmtTime(n.at))}</span>
        </div>
      </div>`).join('') : `<div class="empty"><div class="empty__t">${UI.esc(t('dash.notifEmpty'))}</div></div>`;
    const c = UI.el(`<div>
      <div class="micro" style="margin-bottom:6px">${UI.esc(t('dash.alerts'))}</div>
      ${rows}
      ${ns.some(n => !n.read) ? `<button class="btn btn--ghost btn--full mt4" data-a="read">${UI.esc(t('dash.markRead'))}</button>` : ''}
    </div>`);
    const sh = UI.sheet(c);
    c.addEventListener('click', e => { if (e.target.closest('[data-a=read]')) { Store.markNotifsRead(); sh.close(); } });
  }

  UI.registerScreen({
    id: 'dashboard',
    render(el) {
      if (!Store.isOwner) { UI.go(Store.state.session ? 'sell' : 'login'); return; }
      const st = Store.state;
      const today = Store.todayBd();
      const yest = Store.Engine.addDays(today, -1);
      const sales = todaySales();
      const units = Math.round(sales.reduce((a, s) => a + s.qty, 0) * 100) / 100;
      const uYest = unitsOn(yest);
      const pct = uYest > 0 ? Math.round((units - uYest) / uYest * 100) : null;
      const last = Store.closedCounts()[0];
      const lastVar = last ? Math.round(last.lines.reduce((a, l) => a + l.variance, 0) * 100) / 100 : null;
      const lastIssues = last ? last.lines.filter(l => l.variance !== 0).length : 0;
      const low = Store.lowItems().slice(0, 5);
      const lowTotal = Store.lowItems().length;
      const feed = st.sales.filter(s => s.bd === today).slice(0, 4);
      const unread = st.notifs.filter(n => !n.read).length;
      const sign = v => v > 0 ? '+' : v < 0 ? '−' : '±';
      const fmtSigned = v => v === 0 ? '±0' : (v > 0 ? '+' : '−') + UI.fmtQty(Math.abs(v));

      el.innerHTML = `
        <div class="topbar">
          ${UI.logoMark(26)}
          <div class="side">
            ${unread ? `<button class="alink" data-a="alerts">${UI.esc(t('dash.alertsN', { n: unread }))}</button>` : ''}
            <div class="micro tnum">${UI.esc(UI.fmtDate(today))}</div>
          </div>
        </div>
        <div class="eyebrow micro">${UI.esc(st.settings.barName || 'BarTally')}</div>

        <div class="stats">
          <div class="stat">
            <div class="micro">${UI.esc(t('dash.sales'))}</div>
            <div class="big tnum">${UI.esc(UI.fmtQty(units))}</div>
            ${sparkline()}
            ${pct !== null ? `<div><span class="chipstat ${pct >= 0 ? 'ok' : 'bad'} tnum">${UI.esc(t('dash.vsYest', { sign: sign(pct), pct: Math.abs(pct) }))}</span></div>` : ''}
          </div>
          <div class="stat">
            <div class="micro">${UI.esc(t('dash.lastCount'))}</div>
            ${last
              ? `<div class="big tnum ${lastVar !== 0 ? 'bad' : ''}">${fmtSigned(lastVar)}</div>
                 <div class="sub2">${lastIssues ? UI.esc(I18N.plural('dash.concerned', lastIssues)) : UI.esc(t('dash.cleanLast'))}</div>`
              : `<div class="big tnum faint">—</div><div class="sub2">${UI.esc(t('dash.noCountYet'))}</div>`}
          </div>
        </div>

        <div class="sec"><div class="micro">${UI.esc(t('dash.lowstock'))}</div><div class="micro tnum">${lowTotal || ''}</div></div>
        ${low.length ? `<div class="tilerow">${low.map(it => `
          <button class="tilecol" data-item="${it.id}">
            <div class="tile t64">${UI.art(it)}</div>
            <div class="tilecap">${UI.esc(it.name)}</div>
            <div class="lowqty tnum">${UI.esc(UI.fmtQty(Store.stock(it.id)))}</div>
          </button>`).join('')}</div>`
          : `<div class="sub2">${UI.esc(t('dash.lowNone'))}</div>`}

        <div class="sec"><div class="micro">${UI.esc(t('dash.feed'))}</div></div>
        <div class="feed">
          ${feed.length ? feed.map(s => {
            const it = Store.item(s.itemId);
            const cat = it && Store.cat(it.catId);
            return `<div class="row" style="${s.voidedAt ? 'opacity:.45' : ''}">
              <span class="feedtick" style="background:${cat ? cat.hex : 'var(--t3)'}"></span>
              <span class="row__t" style="flex:none;${s.voidedAt ? 'text-decoration:line-through' : ''}">${UI.esc(it ? it.name : '?')}</span>
              <span class="qtybubble">×${UI.esc(UI.fmtQty(s.qty))}</span>
              <div class="row__end">
                <div class="tnum" style="font-size:12px;color:var(--t3)">${UI.esc(UI.fmtTime(s.at))}</div>
                <div style="font-size:11px;color:var(--t3);margin-top:2px">${UI.esc(s.by)}</div>
              </div>
            </div>`;
          }).join('') : `<div class="sub2">${UI.esc(t('dash.feedNone'))}</div>`}
        </div>

        <div class="actions">
          <button class="btn btn--gold" data-go="sell">${UI.esc(t('dash.qa.sale'))}</button>
          <button class="btn btn--ghost" data-go="count">${UI.esc(t('dash.qa.count'))}</button>
          <button class="btn btn--ghost" data-go="restock">${UI.esc(t('dash.qa.restock'))}</button>
          <button class="btn btn--ghost" data-go="waste">${UI.esc(t('dash.qa.waste'))}</button>
        </div>`;

      el.addEventListener('click', e => {
        const g = e.target.closest('[data-go]');
        if (g) { UI.haptic('light'); UI.go(g.dataset.go, { from: 'dashboard' }); return; }
        if (e.target.closest('[data-a=alerts]')) alertsSheet();
        if (e.target.closest('[data-item]')) UI.go('inventory');
      });
    },
  });
})();

  let catFilter = 'all';
  let showInactive = false;

  const emptyHtml = (title, sub) => `<div class="empty"><div class="empty__t">${UI.esc(title)}</div>${sub ? `<div class="empty__s">${UI.esc(sub)}</div>` : ''}</div>`;

    const cats = Store.state.categories.slice().sort((a, b) => a.sort - b.sort);
    const d = isNew
      ? {
          name: '',
          catId: (catFilter !== 'all' && Store.cat(catFilter)) ? catFilter : (cats[0] ? cats[0].id : 'biere'),
          unit: 'bouteille', allowDecimal: false, threshold: 6, pinned: false, cost: null, photo: null, barcode: null,

        <div class="field"><label>${UI.esc(t('inv.threshold'))}</label><input data-f="thr" type="number" min="0" step="any" inputmode="decimal" value="${d.threshold ?? ''}"></div>

          <div><div class="switchrow__t">${UI.esc(t('inv.pinned'))}</div><div class="switchrow__s">${UI.esc(t('inv.pinnedHint'))}</div></div>

        </div>
      </div>
      ${isNew ? '' : `
      <div class="field"><label>${UI.esc(t('inv.photo'))}</label>
        <div class="inv-photo">
          <div class="tile t56" data-r="prev"></div>
          <div class="inv-photo__acts">
            <button type="button" class="textbtn" data-a="ptake">${UI.esc(t('inv.photoTake'))}</button>
            <button type="button" class="textbtn" data-a="ppick">${UI.esc(t('inv.photoPick'))}</button>
            <button type="button" class="textbtn inv-mut${d.photo ? '' : ' hidden'}" data-a="prm">${UI.esc(t('inv.photoRemove'))}</button>
          </div>
        </div>
      </div>
      <div class="field"><label>${UI.esc(t('inv.barcode'))}</label>
        <div class="inv-code">
          <span class="sub2 num" data-r="code"></span>
          <button type="button" class="textbtn" data-a="scan">${UI.esc(t('inv.barcodeScan'))}</button>
        </div>
      </div>`}
      <div class="inv-foot">
        <button type="button" class="btn btn--gold btn--full" data-a="save">${UI.esc(t('g.save'))}</button>
        ${isNew ? '' : (src.active
          ? `<button type="button" class="textbtn inv-danger" data-a="deact">${UI.esc(t('inv.deactivate'))}</button>`
          : `<button type="button" class="textbtn" data-a="react">${UI.esc(t('inv.reactivate'))}</button>`)}

          if (thr == null) delete patch.threshold; // store default applies

          const live = Store.item(id); // live data at action time
          if (!live) { s.close(); return; }

        UI.toast(t('inv.saved'), { type: 'ok' });
        s.close();
      } else if (a === 'deact') {
        const ok = await UI.confirm(t('inv.deactivateWarn'), { danger: true, title: t('inv.deactivate'), yes: t('inv.deactivate') });
        if (!ok) return;
        if (Store.item(id)) Store.saveItem({ id, active: false });
        UI.haptic('warn');
        UI.toast(t('inv.deactivated'));
        s.close();
      } else if (a === 'react') {
        if (Store.item(id)) Store.saveItem({ id, active: true });
        UI.haptic('success');
        UI.toast(t('inv.reactivated'), { type: 'ok' });
        s.close();
      }
    });
  }

  /* ---------- screen (root tab — global tab bar, no back button) ---------- */
  UI.registerScreen({
    id: 'inventory',
    render(el) {
      if (!Store.isOwner) { // owner-only guard, same as dashboard
        el.innerHTML = '';
        setTimeout(() => UI.go(Store.state.session ? 'sell' : 'login'), 0);
        return;
      }
      if (catFilter !== 'all' && !Store.cat(catFilter)) catFilter = 'all';
      const st = Store.state;
      const cats = st.categories.slice().sort((a, b) => a.sort - b.sort);
      const nAct = Store.activeItems().length;

      el.innerHTML = `
        <div class="topbar">
          ${UI.logoMark(26)}
          <div class="micro tnum">${UI.esc(I18N.plural('inv.activeCount', nAct))}</div>
        </div>
        <div class="h1">${UI.esc(t('inv.title'))}</div>
        <div class="search">${UI.icon('search')}
          <input type="text" placeholder="${UI.esc(t('g.search'))}" autocomplete="off" enterkeyhint="search" aria-label="${UI.esc(t('g.search'))}">
          <button type="button" class="iconbtn iconbtn--plain search__clear${query ? '' : ' hidden'}" data-a="clear" aria-label="${UI.esc(t('g.close'))}">${UI.icon('x')}</button>
        </div>
        <div class="chips" role="tablist">
          <button type="button" class="chip${catFilter === 'all' ? ' is-on' : ''}" data-cat="all" aria-pressed="${catFilter === 'all'}"><span class="dot"></span>${UI.esc(t('g.all'))}</button>
          ${cats.map(cg => `<button type="button" class="chip${catFilter === cg.id ? ' is-on' : ''}" data-cat="${UI.esc(cg.id)}" aria-pressed="${catFilter === cg.id}"><span class="dot" style="background:${UI.esc(cg.hex)}"></span>${UI.esc(Store.catName(cg))}</button>`).join('')}
        </div>
        <div class="inv-list"></div>`;

      const input = el.querySelector('.search input');
      const clearBtn = el.querySelector('[data-a=clear]');
      const listEl = el.querySelector('.inv-list');
      input.value = query;
      input.addEventListener('focus', () => { searchFocus = true; });
      input.addEventListener('blur', () => { searchFocus = false; });
      input.addEventListener('input', () => {
        query = input.value;
        clearBtn.classList.toggle('hidden', !query);
        renderList();
      });
      if (searchFocus) {
        input.focus();
        try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
      }

      function renderList() {
        const q = norm(query.trim());
        const match = it => (catFilter === 'all' || it.catId === catFilter) && (!q || norm(it.name).includes(q));
        const act = Store.activeItems().filter(match);
        const off = st.items.filter(i => !i.active).sort((a, b) => a.sort - b.sort).filter(match);
        let html = '';
        if (!act.length) {
          if (!st.items.length) html += emptyHtml(t('inv.emptyAll'), t('inv.emptyAllSub'));
          else if (!off.length) html += q
            ? emptyHtml(t('sell.noresults'), t('sell.noresults.hint'))
            : emptyHtml(t('inv.empty'), '');
        } else {
          const groups = cats.map(cg => ({ cg, items: act.filter(i => i.catId === cg.id) })).filter(g => g.items.length);
          const orphans = act.filter(i => !Store.cat(i.catId));
          html += groups.map(g => `
            <div class="sec"><div class="micro">${UI.esc(Store.catName(g.cg))}</div><div class="micro tnum">${g.items.length}</div></div>
            <div class="feed">${g.items.map(i => rowHtml(i, false)).join('')}</div>`).join('');
          if (orphans.length) html += `<div class="sec"><div class="micro">—</div><div class="micro tnum">${orphans.length}</div></div>
            <div class="feed">${orphans.map(i => rowHtml(i, false)).join('')}</div>`;
        }
        if (off.length) {
          const open = showInactive || !!q;
          html += `<button type="button" class="grouprow" data-a="toggleOff" aria-expanded="${open}">
            <span class="micro tnum">${UI.esc(t('inv.inactiveN', { n: off.length }))}</span><span class="chev">${open ? '⌄' : '›'}</span>
          </button>`;
          if (open) html += `<div class="feed inv-off">${off.map(i => rowHtml(i, true)).join('')}</div>`;
        }
        html += `<button type="button" class="textbtn" data-a="new">${UI.esc(t('inv.addItem'))}</button>`;
        listEl.innerHTML = html;
      }

      el.addEventListener('click', e => {
        if (e.target.closest('[data-a=new]')) { UI.haptic('light'); openItemSheet(null); return; }
        if (e.target.closest('[data-a=clear]')) {
          query = ''; input.value = '';
          clearBtn.classList.add('hidden');
          renderList(); input.focus();
          return;
        }
        if (e.target.closest('[data-a=toggleOff]')) { showInactive = !showInactive; UI.haptic('light'); renderList(); return; }
        const chip = e.target.closest('[data-cat]');
        if (chip) {
          catFilter = chip.dataset.cat;
          el.querySelectorAll('[data-cat]').forEach(x => {
            const on = x.dataset.cat === catFilter;
            x.classList.toggle('is-on', on);
            x.setAttribute('aria-pressed', String(on));
          });
          UI.haptic('light'); renderList();
          return;
        }
        const row = e.target.closest('[data-edit]');
        if (row) { UI.haptic('light'); openItemSheet(row.dataset.edit); }
      });

      renderList();
    },
  });
})();

/* ============ Screen: count — walkthrough + Écarts review (reference frame 03) ============ */
(() => {

      'count.att': 'Exp.', 'count.cpt': 'Cnt.', 'count.ecart': 'Var.',

      'count.noVar_many': 'No variance — {n} items',

      'count.article': 'Item',
      'count.itemsToCount': 'Items to count',
      'count.startHint': 'The app shows the expected stock; you type what you actually count. Every discrepancy shows, item by item.',
      'count.notePrefix': 'Note',
      'count.editLine': 'Edit',
      'count.ownerOnly': 'Owner only',
      'count.viewReport': 'View report',
    },
  });

  document.head.appendChild(UI.el(`<style>
  [data-screen=count] .topbar{display:flex;justify-content:space-between;align-items:center;min-height:26px}
  [data-screen=count] .h1{font:600 24px/1.2 var(--f-display);letter-spacing:-.01em;margin-top:8px}
  [data-screen=count] .cw-item{display:flex;align-items:center;gap:12px;margin-top:20px}
  [data-screen=count] .cw-name{font-size:16px;font-weight:600}
  [data-screen=count] .cw-unit{font-size:11px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
  [data-screen=count] .cw-progress{font-variant-numeric:tabular-nums}
  [data-screen=count] .cw-in.has{color:var(--brass)}
  [data-screen=count] .cw-actions{display:flex;gap:8px;margin-top:12px}
  [data-screen=count] .cw-actions .btn{flex:1}
  [data-screen=count] .trow.tap{cursor:pointer}
  [data-screen=count] .done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
  [data-screen=count] .done-mark{width:64px;height:64px;border-radius:50%;border:1px solid var(--hair2);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  [data-screen=count] .done-mark svg{width:26px;height:26px;color:var(--ok)}
  [data-screen=count] .ov{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:rgba(5,6,8,.94);text-align:center;animation:fade-in .2s}
  [data-screen=count] .ov.is-out{animation:fade-out .25s forwards}
  [data-screen=count] .ov .ring1{stroke-dasharray:290;stroke-dashoffset:290;animation:cnt-draw .8s .1s cubic-bezier(.55,0,.3,1) forwards}
  [data-screen=count] .ov .ck1{stroke-dasharray:56;stroke-dashoffset:56;animation:cnt-draw .3s .75s ease-out forwards}
  [data-screen=count] .ov h2{font:600 20px var(--f-display);margin-top:12px;opacity:0;animation:cnt-up .4s .9s forwards}
  [data-screen=count] .ov p{color:var(--t2);font-size:13px;opacity:0;animation:cnt-up .4s 1s forwards}
  @keyframes cnt-draw{to{stroke-dashoffset:0}}
  @keyframes cnt-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  </style>`));

  const V = { mode: 'entry', idx: 0, buf: '', showClean: false };

  function orderedItems() {
    const cats = [...Store.state.categories].sort((a, b) => a.sort - b.sort);
    const act = Store.activeItems();
    const out = [];
    for (const c of cats) out.push(...act.filter(i => i.catId === c.id));
    return out;
  }
  const openCount = () => Store.state.counts.find(c => c.status === 'open');
  const fmtSigned = v => v === 0 ? '±0' : (v > 0 ? '+' : '−') + UI.fmtQty(Math.abs(v));
  const parseBuf = b => { const n = parseFloat(String(b).replace(',', '.')); return isNaN(n) ? null : Math.round(n * 100) / 100; };

  /* ---------- closing ceremony ---------- */
  function ceremony(el) {
    const ov = UI.el(`<div class="ov" data-screen="count" role="status">
      <svg viewBox="0 0 100 100" width="104" height="104" aria-hidden="true">
        <circle cx="50" cy="50" r="46" fill="none" stroke="var(--hair2)" stroke-width="3"/>
        <circle class="ring1" cx="50" cy="50" r="46" fill="none" stroke="var(--brass)" stroke-width="3" stroke-linecap="round" transform="rotate(-90 50 50)"/>
        <path class="ck1" d="M31 52l13 13 25-27" fill="none" stroke="var(--brass)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>${UI.esc(t('count.closed'))}</h2>
      <p>${UI.esc(t('count.closedSub'))}</p>
    </div>`);
    document.body.appendChild(ov);
    UI.haptic('success');
    setTimeout(() => { ov.classList.add('is-out'); setTimeout(() => ov.remove(), 260); }, 1900);
  }

  /* ---------- line sheet: edit counted + note ---------- */
  function lineSheet(c, item) {
    const line = c.lines.find(l => l.itemId === item.id);
    const exp = line ? line.expected : Store.countExpected(item.id, c.bd);
    let buf = line ? String(line.counted) : '';
    const cEl = UI.el(`<div>
      <div class="sheetrow">
        <div class="tile t40">${UI.art(item)}</div>
        <div><div class="sheetname">${UI.esc(item.name)}</div>
        <div class="sheetsub tnum">${UI.esc(t('count.attendu'))} · ${UI.esc(UI.fmtQty(exp))}</div></div>
      </div>
      <div class="sum" style="margin-top:14px">
        <div class="sumcol"><div class="micro">${UI.esc(t('count.compte'))}</div><div class="mid tnum" data-buf>${buf ? UI.esc(UI.fmtQty(parseBuf(buf))) : '—'}</div></div>
        <div class="sumcol"><div class="micro">${UI.esc(t('count.ecart'))}</div><div class="mid tnum" data-var>${buf ? fmtSigned(parseBuf(buf) - exp) : '—'}</div></div>
      </div>
      <div data-np></div>
      <div class="field" style="margin-top:14px"><label>${UI.esc(t('count.note'))}</label>
        <textarea rows="2" placeholder="${UI.esc(t('count.notePh'))}">${UI.esc(line ? (line.note || '') : '')}</textarea></div>
      <button class="btn btn--gold btn--full" data-a="save">${UI.esc(t('g.save'))}</button>
    </div>`);
    const sh = UI.sheet(cEl);
    const paint = () => {
      const v = parseBuf(buf);
      cEl.querySelector('[data-buf]').textContent = v == null ? '—' : UI.fmtQty(v);
      const vv = cEl.querySelector('[data-var]');
      vv.textContent = v == null ? '—' : fmtSigned(Math.round((v - exp) * 100) / 100);
      vv.className = 'mid tnum ' + (v == null ? '' : (v - exp) < 0 ? 'bad' : (v - exp) > 0 ? 'good' : 'faint');
    };
    UI.numpad(cEl.querySelector('[data-np]'), { decimal: item.allowDecimal, onKey: k => {
      if (k === 'del') buf = buf.slice(0, -1);
      else if (k === 'dot') { if (!buf.includes('.')) buf = (buf || '0') + '.'; }
      else if (buf.replace('.', '').length < 5) buf += k;
      paint();
    } });
    cEl.addEventListener('click', e => {
      if (!e.target.closest('[data-a=save]')) return;
      const v = parseBuf(buf);
      const note = cEl.querySelector('textarea').value.trim();
      if (v != null) Store.setCountLine(c.id, item.id, v, note);
      else if (note) Store.setCountLine(c.id, item.id, exp, note);
      sh.close();
    });
  }

  /* ---------- entry ---------- */
  function renderEntry(el) {
    const today = Store.todayBd();
    const closedToday = Store.state.counts.find(c => c.bd === today && c.status === 'closed');
    const oc = openCount();
    const items = orderedItems();
    if (closedToday && !oc) {
      el.innerHTML = `
        <div class="topbar"><button class="back" data-a="back">‹ ${UI.esc(t('g.back'))}</button><div class="micro tnum">${UI.esc(UI.fmtDate(today))}</div></div>
        <div class="done-wrap">
          <div class="done-mark">${UI.icon('check')}</div>
          <div style="font:600 20px var(--f-display)">${UI.esc(t('count.closed'))}</div>
          <div class="sub2">${UI.esc(t('count.closedSub'))}</div>
        </div>
        <div class="bottomstack">
          <button class="btn btn--ghost" data-a="report">${UI.esc(t('count.viewReport'))}</button>
          <button class="textbtn" data-a="reopen">${UI.esc(t('count.reopen'))}</button>
        </div>`;
      return;
    }
    const sumExp = items.reduce((a, it) => a + Store.countExpected(it.id, today), 0);
    el.innerHTML = `
      <div class="topbar"><button class="back" data-a="back">‹ ${UI.esc(t('g.back'))}</button><div class="micro tnum">${UI.esc(UI.fmtDate(today))}</div></div>
      <div class="h1">${UI.esc(t('count.title'))}</div>
      <div class="sub2" style="margin-top:10px;line-height:1.6">${UI.esc(t('count.startHint'))}</div>
      <div class="sum">
        <div class="sumcol"><div class="micro">${UI.esc(t('count.itemsToCount'))}</div><div class="mid tnum">${items.length}</div></div>
        <div class="sumcol"><div class="micro">${UI.esc(t('count.attendu'))}</div><div class="mid tnum">${UI.esc(UI.fmtQty(Math.round(sumExp * 100) / 100))}</div></div>
      </div>
      <div class="bottomstack">
        <button class="btn btn--gold" data-a="start">${UI.esc(oc ? t('count.continue') : t('count.start'))}</button>
      </div>`;
  }

  /* ---------- walkthrough ---------- */
  function renderWalk(el, c, items) {
    const it = items[V.idx];
    if (!it) { V.mode = 'review'; UI.refresh(); return; }
    const cat = Store.cat(it.catId);
    const exp = (() => { const l = c.lines.find(l => l.itemId === it.id); return l ? l.expected : Store.countExpected(it.id, c.bd); })();
    const existing = c.lines.find(l => l.itemId === it.id);
    const done = c.lines.length;
    const v = parseBuf(V.buf);
    el.innerHTML = `
      <div class="topbar">
        <button class="back" data-a="exit">‹ ${UI.esc(t('count.title'))}</button>
        <div class="micro cw-progress">${done}/${items.length}</div>
      </div>
      <div class="sec" style="margin-top:14px"><div class="micro">${UI.esc(cat ? Store.catName(cat) : '')}</div>
        <button class="scanbtn iconbtn iconbtn--plain" data-a="scan" aria-label="scan" style="width:32px;height:32px">${UI.icon('scan')}</button></div>
      <div class="cw-item">
        <div class="tile t56">${UI.art(it)}</div>
        <div><div class="cw-name">${UI.esc(it.name)}</div><div class="cw-unit">${UI.esc(t('u.' + it.unit))}</div></div>
      </div>
      <div class="sum">
        <div class="sumcol"><div class="micro">${UI.esc(t('count.attendu'))}</div><div class="mid tnum">${UI.esc(UI.fmtQty(exp))}</div></div>
        <div class="sumcol"><div class="micro">${UI.esc(t('count.compte'))}</div>
          <div class="mid tnum cw-in ${V.buf ? 'has' : ''}">${V.buf ? UI.esc(UI.fmtQty(v ?? 0)) : (existing ? UI.esc(UI.fmtQty(existing.counted)) : '—')}</div></div>
      </div>
      <div data-np></div>
      <div class="cw-actions">
        <button class="btn btn--ghost" data-a="prev" ${V.idx === 0 ? 'disabled' : ''}>‹</button>
        <button class="btn btn--ghost" data-a="skip">${UI.esc(t('count.skip'))}</button>
        <button class="btn btn--gold" data-a="ok">${UI.esc(t('g.confirm'))}</button>
      </div>`;
    UI.numpad(el.querySelector('[data-np]'), { decimal: it.allowDecimal, onKey: k => {
      if (k === 'del') V.buf = V.buf.slice(0, -1);
      else if (k === 'dot') { if (!V.buf.includes('.')) V.buf = (V.buf || '0') + '.'; }
      else if (V.buf.replace('.', '').length < 5) V.buf += k;
      UI.refresh();
    } });
  }

  /* ---------- review: reference frame 03 ---------- */
  function renderReview(el, c, items) {
    const lines = items.map(it => {
      const l = c.lines.find(x => x.itemId === it.id);
      return { it, exp: l ? l.expected : Store.countExpected(it.id, c.bd), cnt: l ? l.counted : null, v: l ? l.variance : null, note: l?.note || '' };
    });
    const withVar = lines.filter(l => l.v != null && l.v !== 0);
    const clean = lines.filter(l => l.v === 0);
    const missing = lines.filter(l => l.cnt == null);
    const sumExp = Math.round(lines.reduce((a, l) => a + l.exp, 0) * 100) / 100;
    const sumCnt = Math.round(lines.reduce((a, l) => a + (l.cnt ?? l.exp), 0) * 100) / 100;
    const sumVar = Math.round((sumCnt - sumExp) * 100) / 100;
    const rowHtml = l => {
      const cat = Store.cat(l.it.catId);
      return `<div class="trow tap" data-line="${l.it.id}">
        <div class="tname"><span class="feedtick" style="background:${cat ? cat.hex : 'var(--t3)'}"></span><span>${UI.esc(l.it.name)}</span></div>
        <div class="r v1 tnum">${UI.esc(UI.fmtQty(l.exp))}</div>
        <div class="r v2 tnum">${l.cnt == null ? '—' : UI.esc(UI.fmtQty(l.cnt))}</div>
        <div class="r d tnum ${l.v == null ? 'faint' : l.v < 0 ? 'bad' : l.v > 0 ? 'good' : 'faint'}">${l.v == null ? '—' : fmtSigned(l.v)}</div>
      </div>${l.note ? `<div class="noterow">↳ ${UI.esc(t('count.notePrefix'))} · ${UI.esc(l.note)}</div>` : ''}`;
    };
    el.innerHTML = `
      <div class="topbar">
        <button class="back" data-a="backwalk">‹ ${UI.esc(t('count.title'))}</button>
        <div class="micro tnum">${UI.esc(UI.fmtDate(c.bd))}</div>
      </div>
      <div class="h1">${UI.esc(t('count.h1'))}</div>
      <div class="sum">
        <div class="sumcol"><div class="micro">${UI.esc(t('count.attendu'))}</div><div class="mid tnum">${UI.esc(UI.fmtQty(sumExp))}</div></div>
        <div class="sumcol"><div class="micro">${UI.esc(t('count.compte'))}</div><div class="mid tnum">${UI.esc(UI.fmtQty(sumCnt))}</div></div>
        <div class="sumcol"><div class="micro">${UI.esc(t('count.ecart'))}</div><div class="mid tnum ${sumVar < 0 ? 'bad' : sumVar > 0 ? 'good' : 'faint'}">${fmtSigned(sumVar)}</div></div>
      </div>
      ${missing.length ? `<div class="sub2">${UI.esc(I18N.plural('count.missing', missing.length))}</div>` : ''}
      <div class="thead"><div>${UI.esc(t('count.article'))}</div><div class="r">${UI.esc(t('count.att'))}</div><div class="r">${UI.esc(t('count.cpt'))}</div><div class="r">${UI.esc(t('count.ecart'))}</div></div>
      ${withVar.map(rowHtml).join('')}
      ${clean.length ? `<button class="grouprow" data-a="toggleclean">
        <span class="micro">${UI.esc(I18N.plural('count.noVar', clean.length))}</span><span class="chev">${V.showClean ? '⌄' : '›'}</span>
      </button>` : ''}
      ${V.showClean ? clean.map(rowHtml).join('') : ''}
      <div class="bottomstack">
        <button class="btn btn--gold" data-a="close">${UI.esc(t('count.closeDay'))}</button>
        <button class="textbtn" data-a="pdf">${UI.esc(t('count.exportPdf'))}</button>
      </div>`;
  }

  function exportPdf(c, items) {
    const lines = items.map(it => {
      const l = c.lines.find(x => x.itemId === it.id);
      return { name: it.name, exp: l ? l.expected : Store.countExpected(it.id, c.bd), cnt: l ? l.counted : '', v: l ? l.variance : '', note: l?.note || '' };
    });
    const rows = lines.map(l => `<tr><td>${UI.esc(l.name)}</td><td style="text-align:right">${UI.esc(UI.fmtQty(l.exp))}</td><td style="text-align:right">${l.cnt === '' ? '' : UI.esc(UI.fmtQty(l.cnt))}</td><td style="text-align:right" class="${l.v < 0 ? 'neg' : l.v > 0 ? 'pos' : ''}">${l.v === '' ? '' : fmtSigned(l.v)}</td><td>${UI.esc(l.note)}</td></tr>`).join('');
    UI.printHTML(`${t('count.h1')} — ${UI.fmtDate(c.bd)}`,
      `<table><thead><tr><th>${UI.esc(t('count.article'))}</th><th style="text-align:right">${UI.esc(t('count.attendu'))}</th><th style="text-align:right">${UI.esc(t('count.compte'))}</th><th style="text-align:right">${UI.esc(t('count.ecart'))}</th><th>${UI.esc(t('count.note'))}</th></tr></thead><tbody>${rows}</tbody></table>`);
  }

  UI.registerScreen({
    id: 'count',
    render(el) {
      if (!Store.isOwner) { UI.go(Store.state.session ? 'sell' : 'login'); return; }
      const items = orderedItems();
      const c = openCount();
      if (!c) V.mode = 'entry';
      if (V.mode === 'walk' && c) renderWalk(el, c, items);
      else if (V.mode === 'review' && c) renderReview(el, c, items);
      else renderEntry(el);

      el.addEventListener('click', async e => {
        const lineEl = e.target.closest('[data-line]');
        if (lineEl && c) { const item = Store.item(lineEl.dataset.line); if (item) lineSheet(c, item); return; }
        const b = e.target.closest('[data-a]');
        if (!b) return;
        const a = b.dataset.a;
        if (a === 'back') UI.go('dashboard');
        else if (a === 'report') UI.go('reports', { day: Store.todayBd() });
        else if (a === 'reopen') {
          const closedToday = Store.state.counts.find(x => x.bd === Store.todayBd() && x.status === 'closed');
          if (closedToday && await UI.confirm(t('count.reopenWarn'), { danger: true })) {
            Store.reopenCount(closedToday.id);
            V.mode = 'review'; V.buf = '';
            UI.refresh();
          }
        }
        else if (a === 'start') {
          const oc = Store.openCount();
          V.mode = 'walk'; V.buf = '';
          V.idx = items.findIndex(it => !oc.lines.some(l => l.itemId === it.id));
          if (V.idx === -1) V.mode = 'review';
          UI.refresh();
        }
        else if (a === 'exit') { V.mode = 'entry'; V.buf = ''; UI.refresh(); }
        else if (a === 'scan') {
          UI.scan({ onCode: code => {
            const item = Store.findByBarcode(code);
            const i2 = items.findIndex(x => x.id === item?.id);
            if (i2 >= 0) { V.idx = i2; V.buf = ''; UI.haptic('success'); UI.refresh(); }
            else UI.toast(t('sell.noresults'), { type: 'danger' });
          } });
        }
        else if (a === 'prev') { if (V.idx > 0) { V.idx--; V.buf = ''; UI.refresh(); } }
        else if (a === 'skip') { advance(items); }
        else if (a === 'ok') {
          const it = items[V.idx];
          const v = parseBuf(V.buf);
          if (v != null && c) Store.setCountLine(c.id, it.id, v);
          advance(items, v != null);
        }
        else if (a === 'backwalk') { V.mode = 'walk'; V.idx = Math.max(0, items.length - 1); V.buf = ''; UI.refresh(); }
        else if (a === 'toggleclean') { V.showClean = !V.showClean; UI.refresh(); }
        else if (a === 'pdf') { if (c) exportPdf(c, items); }
        else if (a === 'close') {
          if (!c) return;
          if (await UI.confirm(t('count.reviewHint'), { title: t('count.closeDay'), yes: t('count.closeDay') })) {
            Store.closeCount(c.id);
            V.mode = 'entry'; V.buf = ''; V.showClean = false;
            ceremony(el);
          }
        }
      });

      function advance(items2, counted) {
        V.buf = '';
        if (V.idx >= items2.length - 1) { V.mode = 'review'; }
        else V.idx++;
        if (counted) UI.haptic('light');
        UI.refresh();
      }
    },
  });
})();

/* == 25-screen-restock-waste.js == */
/* ============ Screens: restock (livraison) + waste (casse & pertes) — owner only, reference patterns ============ */
(() => {
  'use strict';

  I18N.extend({
    fr: {
      'rw.todayRestock': 'Livraisons du jour',
      'rw.todayWaste': 'Pertes du jour',
      'rw.inStock': 'En stock : {qty} {unit}',
      'rw.clear': 'Effacer la recherche',
      'restock.confirmBtn': 'Ajouter +{qty}',
      'waste.confirmBtn': 'Déclarer −{qty}',
      'restock.validate': 'Valider la livraison',
      'waste.validate': 'Valider la perte',
    },
    en: {
      'rw.todayRestock': "Today's deliveries",
      'rw.todayWaste': "Today's waste",
      'rw.inStock': 'In stock: {qty} {unit}',
      'rw.clear': 'Clear search',
      'restock.confirmBtn': 'Add +{qty}',
      'waste.confirmBtn': 'Log −{qty}',
      'restock.validate': 'Confirm delivery',
      'waste.validate': 'Confirm waste',
    },
  });

  document.head.appendChild(UI.el(`<style>
  [data-screen=restock] .topbar,[data-screen=waste] .topbar{display:flex;justify-content:space-between;align-items:center;min-height:26px}
  [data-screen=restock] .h1,[data-screen=waste] .h1{font:600 24px/1.2 var(--f-display);letter-spacing:-.01em;margin-top:8px}
  </style>`));

  /* transient per-screen UI state — survives store-driven re-renders (rule 9) */
  const ST = {
    restock: { q: '', cat: 'all' },
    waste: { q: '', cat: 'all' },
  };
  /* origin screen per mode — remembered across re-renders for back navigation */
  const FROM = { restock: null, waste: null };
  const QUICK = [1, 6, 12, 24];

  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  function filtered(mode) {
    const st = ST[mode];
    let items = Store.activeItems();
    if (st.cat !== 'all') items = items.filter(i => i.catId === st.cat);
    const q = norm(st.q.trim());
    if (q) items = items.filter(i => norm(i.name).includes(q));
    return items;
  }

  /* ---- item grid: reference frame 02 anatomy (art + corner qty, caption below) ---- */
  function icardHtml(it) {
    return `<button type="button" class="icard" data-item="${it.id}" aria-label="${UI.esc(it.name)}">
      <div class="icard__art">${UI.art(it, '', { qty: UI.fmtQty(Store.stock(it.id)) })}</div>
      <div class="icard__name">${UI.esc(it.name)}</div>
    </button>`;
  }

  function gridSection(mode) {
    const items = filtered(mode);
    if (!items.length) {
      const searching = !!ST[mode].q.trim();
      return `<div class="empty">
        <div class="empty__t">${UI.esc(t(searching ? 'sell.noresults' : 'inv.empty'))}</div>
        ${searching ? `<div class="empty__s">${UI.esc(t('sell.noresults.hint'))}</div>` : ''}
      </div>`;
    }
    return `<div class="igrid">${items.map(icardHtml).join('')}</div>`;
  }

  /* ---- today's entries: micro section label + hairline feed rows, no boxes ---- */
  function todaySection(mode) {
    const bd = Store.todayBd();
    const isWaste = mode === 'waste';
    const entries = (isWaste ? Store.state.waste : Store.state.restocks).filter(e => e.bd === bd);
    if (!entries.length) return '';
    const sign = isWaste ? '−' : '+';
    const color = isWaste ? 'var(--bad)' : 'var(--ok)';
    return `
      <div class="sec"><div class="micro">${UI.esc(t('g.today'))}</div><div class="micro tnum">${entries.length}</div></div>
      <div class="feed">
        ${entries.map(e => {
          const it = Store.item(e.itemId);
          const cat = it && Store.cat(it.catId);
          return `<div class="row">
            <span class="feedtick" style="background:${cat ? cat.hex : 'var(--t3)'}"></span>
            <div class="row__body">
              <div class="row__t">${UI.esc(it ? it.name : '?')}</div>
              ${isWaste && e.reason ? `<div class="row__s">${UI.esc(e.reason)}</div>` : ''}
            </div>
            <span class="qtybubble" style="color:${color}">${sign}${UI.esc(UI.fmtQty(e.qty))}</span>
            <div class="row__end"><div class="tnum" style="font-size:12px;color:var(--t3)">${UI.esc(UI.fmtTime(e.at))}</div></div>
          </div>`;
        }).join('')}
      </div>`;
  }

  /* ---- qty sheet (mirrors the sale sheet; quick chips; waste adds required reason) ---- */
  function openQtySheet(mode, itemId) {
    const item = Store.item(itemId);
    if (!item || !Store.isOwner) return;
    const isWaste = mode === 'waste';
    const dec = !!item.allowDecimal;
    const min = dec ? 0.5 : 1;
    const quicks = dec ? [0.5, ...QUICK] : QUICK;
    let qty = 1;
    const c = UI.el(`<div>
      <div class="sheetrow">
        <div class="tile t40">${UI.art(item)}</div>
        <div><div class="sheetname">${UI.esc(item.name)}</div>
        <div class="sheetsub tnum">${UI.esc(t('sell.stockEst', { n: UI.fmtQty(Store.stock(item.id)) }))}</div></div>
      </div>
      <div class="stepper">
        <button type="button" class="stepper__btn" data-a="minus" aria-label="−1">−</button>
        <div class="stepper__v tnum" data-el="v">1</div>
        <button type="button" class="stepper__btn" data-a="plus" aria-label="+1">+</button>
      </div>
      <div style="display:flex;gap:8px;justify-content:center">
        ${quicks.map(n => `<button type="button" class="chip num" data-q="${n}" style="min-width:52px;justify-content:center">${UI.fmtQty(n)}</button>`).join('')}
      </div>
      ${isWaste ? `
      <div class="field" style="margin-top:20px;margin-bottom:0">
        <label for="rw-reason">${UI.esc(t('waste.reason'))}</label>
        <input id="rw-reason" type="text" data-el="reason" placeholder="${UI.esc(t('waste.reasonPh'))}" maxlength="140" autocomplete="off" enterkeyhint="done">
        <div class="hidden" data-el="reasonHelp" style="color:var(--bad);font-size:12px;margin-top:8px">${UI.esc(t('waste.reasonRequired'))}</div>
      </div>` : ''}
      <button type="button" class="btn btn--gold btn--full" data-a="ok" style="margin-top:20px">${UI.esc(t(isWaste ? 'waste.validate' : 'restock.validate'))}</button>
    </div>`);
    const s = UI.sheet(c);
    const vEl = c.querySelector('[data-el=v]');
    const okBtn = c.querySelector('[data-a=ok]');
    const minusBtn = c.querySelector('[data-a=minus]');
    const chips = [...c.querySelectorAll('[data-q]')];
    const reasonInp = c.querySelector('[data-el=reason]');
    const helpEl = c.querySelector('[data-el=reasonHelp]');

    const blocked = () => isWaste && !reasonInp.value.trim();
    function sync() {
      vEl.textContent = UI.fmtQty(qty);
      minusBtn.style.opacity = qty <= min ? '.4' : '';
      chips.forEach(ch => ch.classList.toggle('is-on', Number(ch.dataset.q) === qty));
      okBtn.style.opacity = blocked() ? '.55' : '';
      okBtn.setAttribute('aria-disabled', blocked() ? 'true' : 'false');
    }
    sync();

    function confirm() {
      /* read fresh data at action time (rule 9) */
      const fresh = Store.item(item.id);
      if (!fresh || !Store.isOwner) { s.close(); return; }
      if (isWaste) {
        const reason = reasonInp.value.trim();
        if (!reason) {
          helpEl.classList.remove('hidden');
          reasonInp.style.borderColor = 'var(--bad)';
          UI.haptic('warn');
          reasonInp.focus();
          return;
        }
        Store.logWaste(fresh.id, qty, reason);
        UI.haptic('warn');
        UI.toast(t('waste.logged', { qty: UI.fmtQty(qty), item: fresh.name }), { type: 'ok' });
      } else {
        Store.logRestock(fresh.id, qty);
        UI.haptic('success');
        UI.toast(t('restock.logged', { qty: UI.fmtQty(qty), item: fresh.name }), { type: 'ok' });
      }
      s.close();
    }

    c.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.a === 'minus') { if (qty > min) { qty = qty <= 1 ? min : qty - 1; UI.haptic('light'); sync(); } return; }
      if (b.dataset.a === 'plus') { if (qty < 999) { qty = dec && qty === 0.5 ? 1 : qty + 1; UI.haptic('light'); sync(); } return; }
      if (b.dataset.q) { qty = Number(b.dataset.q); UI.haptic('light'); sync(); return; }
      if (b.dataset.a === 'ok') confirm();
    });
    if (reasonInp) {
      reasonInp.addEventListener('input', () => {
        if (reasonInp.value.trim()) { helpEl.classList.add('hidden'); reasonInp.style.borderColor = ''; }
        sync();
      });
      reasonInp.addEventListener('keydown', e => { if (e.key === 'Enter') confirm(); });
    }
  }

  /* ---- shared screen renderer ---- */
  function renderScreen(mode, el, params) {
    if (!Store.isOwner) { UI.go(Store.state.session ? 'sell' : 'login'); return; }
    if (params && params.from) FROM[mode] = params.from;
    const st = ST[mode];
    const cats = Store.state.categories.slice().sort((a, b) => a.sort - b.sort);
    el.innerHTML = `
      <div class="topbar">
        <button type="button" class="back" data-a="back">‹ ${UI.esc(t('g.back'))}</button>
        <div class="micro tnum">${UI.esc(UI.fmtDate(Store.todayBd()))}</div>
      </div>
      <div class="h1">${UI.esc(t(mode + '.title'))}</div>
      <div class="sub2">${UI.esc(t(mode + '.hint'))}</div>
      <div class="search">
        ${UI.icon('search')}
        <input type="text" data-el="q" placeholder="${UI.esc(t('g.search'))}" value="${UI.esc(st.q)}" autocomplete="off" enterkeyhint="search" aria-label="${UI.esc(t('g.search'))}">
        <button type="button" class="iconbtn iconbtn--plain search__clear ${st.q ? '' : 'hidden'}" data-a="clear" aria-label="${UI.esc(t('rw.clear'))}">${UI.icon('x')}</button>
      </div>
      <div class="chips" data-el="chips">
        <button type="button" class="chip ${st.cat === 'all' ? 'is-on' : ''}" data-cat="all"><span class="dot"></span>${UI.esc(t('g.all'))}</button>
        ${cats.map(cat => `<button type="button" class="chip ${st.cat === cat.id ? 'is-on' : ''}" data-cat="${cat.id}"><span class="dot" style="background:${cat.hex}"></span>${UI.esc(Store.catName(cat))}</button>`).join('')}
      </div>
      <div data-el="gridwrap">${gridSection(mode)}</div>
      ${todaySection(mode)}
    `;
    const qInp = el.querySelector('[data-el=q]');
    const clearBtn = el.querySelector('[data-a=clear]');
    const gridwrap = el.querySelector('[data-el=gridwrap]');
    const chipsEl = el.querySelector('[data-el=chips]');

    const updateGrid = () => { gridwrap.innerHTML = gridSection(mode); };

    qInp.addEventListener('input', () => {
      st.q = qInp.value;
      clearBtn.classList.toggle('hidden', !st.q);
      updateGrid();
    });
    qInp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const list = filtered(mode);
        if (list.length === 1) openQtySheet(mode, list[0].id);
      }
    });
    clearBtn.addEventListener('click', () => {
      st.q = '';
      qInp.value = '';
      clearBtn.classList.add('hidden');
      updateGrid();
      qInp.focus();
    });
    chipsEl.addEventListener('click', e => {
      const b = e.target.closest('[data-cat]');
      if (!b) return;
      st.cat = b.dataset.cat;
      UI.haptic('light');
      chipsEl.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('is-on', ch.dataset.cat === st.cat));
      updateGrid();
    });
    el.addEventListener('click', e => {
      if (e.target.closest('[data-a=back]')) { UI.haptic('light'); UI.go(FROM[mode] || 'dashboard'); return; }
      const card = e.target.closest('[data-item]');
      if (card) openQtySheet(mode, card.dataset.item);
    });
  }

  UI.registerScreen({ id: 'restock', render(el, params) { renderScreen('restock', el, params); } });
  UI.registerScreen({ id: 'waste', render(el, params) { renderScreen('waste', el, params); } });
})();
