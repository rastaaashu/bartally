  .dash-ntf__row.is-unread{background:linear-gradient(90deg,var(--gold-soft),rgba(245,166,35,.02))}
  .dash-ntf__ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .dash-ntf__ic svg{width:19px;height:19px}
  .dash-ntf__ic--low{background:var(--warn-soft);color:var(--warn)}
  .dash-ntf__ic--variance{background:var(--danger-soft);color:var(--danger)}
  .dash-ntf__ic--reminder{background:var(--gold-soft);color:var(--gold-hi)}
  .dash-ntf__bd{flex:1;min-width:0}
  .dash-ntf__txt{display:block;font-size:13.5px;line-height:1.4}
  .dash-ntf__time{display:block;font-size:11.5px;color:var(--text-3);margin-top:3px}
  .dash-ntf__dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none;margin-top:8px;box-shadow:0 0 8px rgba(245,166,35,.6)}
  </style>`));

  let dashSeq = 0;
  const DKEYS = ['d.sun', 'd.mon', 'd.tue', 'd.wed', 'd.thu', 'd.fri', 'd.sat'];
  const signed = v => (v > 0 ? '+' : '−') + UI.fmtQty(Math.abs(v));

  /* ---- 7-day sparkline: polyline + gradient area, today dot + value, weekday labels ---- */
  function sparkSVG(days) {
    const W = 320, H = 112, x0 = 12, x1 = 308, yT = 16, yB = 78;
    const id = 'dashsp' + (dashSeq++);
    const max = Math.max(1, ...days.map(d => d.v));
    const pts = days.map((d, i) => [
      +(x0 + i * (x1 - x0) / (days.length - 1)).toFixed(1),
      +(yB - (d.v / max) * (yB - yT)).toFixed(1),
    ]);
    const poly = pts.map(p => p[0] + ',' + p[1]).join(' ');
    const area = 'M' + pts.map(p => p[0] + ',' + p[1]).join(' L ') + ' L ' + x1 + ',' + yB + ' L ' + x0 + ',' + yB + ' Z';
    const last = pts[pts.length - 1];
    const valX = Math.min(last[0], 294);
    const valY = Math.max(12, last[1] - 12);
    return `<svg viewBox="0 0 ${W} ${H}" class="dash-spark" role="img" aria-label="${UI.esc(t('dash.7days'))}">
      <defs>
        <linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#F7C14B"/><stop offset="1" stop-color="#E8940A"/>
        </linearGradient>
        <linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color:var(--series-1)" stop-opacity=".3"/>
          <stop offset="1" style="stop-color:var(--series-1)" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <line x1="${x0}" y1="${yB}" x2="${x1}" y2="${yB}" stroke="rgba(255,255,255,.08)"/>
      <path class="dash-spark__area" d="${area}" fill="url(#${id}a)"/>
      <polyline class="dash-spark__line" points="${poly}" pathLength="1" fill="none" stroke="url(#${id}s)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.slice(0, -1).map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.3" style="fill:var(--series-1)" opacity=".85"/>`).join('')}
      <circle cx="${last[0]}" cy="${last[1]}" r="9" style="fill:var(--gold)" opacity=".16"/>
      <circle class="dash-spark__dot" cx="${last[0]}" cy="${last[1]}" r="4.2" style="fill:var(--gold-hi)" stroke="#0A0A0E" stroke-width="2"/>
      <text class="dash-spark__val" x="${valX}" y="${valY}" text-anchor="middle">${UI.esc(UI.fmtQty(days[days.length - 1].v))}</text>
      ${days.map((d, i) => `<text class="dash-spark__lb ${d.today ? 'is-today' : ''}" x="${pts[i][0]}" y="${H - 8}" text-anchor="middle">${UI.esc(d.lb)}</text>`).join('')}
    </svg>`;
  }

  /* ---- notification sheet: reads fresh state at paint time ---- */
  function openNotifs() {
    UI.haptic('light');
    const wrap = UI.el('<div class="dash-ntf"></div>');
    const paint = () => {
      const notifs = Store.state.notifs.slice(0, 30);
      const today = Store.todayBd();
      const hasUnread = Store.state.notifs.some(n => !n.read);
      const rows = notifs.map(n => {
        const ic = n.type === 'low' ? 'stock' : n.type === 'variance' ? 'alert' : 'clock';
        const when = (n.bd === today ? '' : UI.fmtDate(n.bd) + ' · ') + UI.fmtTime(n.at);
        return `<div class="dash-ntf__row ${n.read ? '' : 'is-unread'}">
          <span class="dash-ntf__ic dash-ntf__ic--${UI.esc(n.type)}">${UI.icon(ic)}</span>
          <span class="dash-ntf__bd">
            <span class="dash-ntf__txt">${UI.esc(window.__notifText(n.type, n.payload))}</span>
            <span class="dash-ntf__time num">${UI.esc(when)}</span>
          </span>
          ${n.read ? '' : '<span class="dash-ntf__dot"></span>'}
        </div>`;
      }).join('');
      wrap.innerHTML = `<h2 class="dash-ntf__h">${UI.esc(t('dash.alerts'))}</h2>` +
        (notifs.length
          ? `<div class="dash-ntf__list">${rows}</div>` +
            (hasUnread ? `<button class="btn btn--ghost btn--full mt3" data-a="markread">${UI.icon('check')}${UI.esc(t('dash.markRead'))}</button>` : '')
          : `<div class="empty" style="padding:32px 16px">${UI.icon('bell')}<div class="empty__s">${UI.esc(t('dash.notifEmpty'))}</div></div>`);
    };
    paint();
    wrap.addEventListener('click', e => {
      if (e.target.closest('[data-a=markread]')) { UI.haptic('success'); Store.markNotifsRead(); paint(); }
    });
    UI.sheet(wrap);
  }

  UI.registerScreen({
    id: 'dashboard',
    render(el) {
      if (!Store.isOwner) { UI.go('sell'); return; }

      const today = Store.todayBd();
      const name = (Store.me && Store.me.name) || t('g.owner');

      /* today's numbers (non-void sales) */
      const todaySales = Store.state.sales.filter(s => s.bd === today && !s.voidedAt);
      const units = Math.round(todaySales.reduce((a, s) => a + s.qty, 0) * 100) / 100;
      const distinct = new Set(todaySales.map(s => s.itemId)).size;
      const deliv = Math.round(Store.state.restocks.filter(r => r.bd === today).reduce((a, r) => a + r.qty, 0) * 100) / 100;
      const waste = Math.round(Store.state.waste.filter(w => w.bd === today).reduce((a, w) => a + w.qty, 0) * 100) / 100;

      /* last closed count */
      const lc = Store.closedCounts()[0] || null;
      const lcIssueLines = lc ? lc.lines.filter(l => l.variance !== 0) : [];
      const lcIssues = lc ? lcIssueLines.length : null;

      /* last 7 business days of non-void sales */
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const bd = Store.Engine.addDays(today, -i);
        days.push({ bd, v: 0, lb: t(DKEYS[new Date(bd + 'T12:00:00').getDay()]), today: i === 0 });
      }
      for (const s of Store.state.sales) {
        if (s.voidedAt) continue;
        const d = days.find(x => x.bd === s.bd);
        if (d) d.v += s.qty;
      }
      for (const d of days) d.v = Math.round(d.v * 100) / 100;
      const weekTotal = Math.round(days.reduce((a, d) => a + d.v, 0) * 100) / 100;

      /* staggered section entrance */
      let dsec = 0;
      const D = () => `style="animation-delay:${dsec++ * 55}ms"`;

      /* header: greeting + date + bell */
      const unread = Store.state.notifs.filter(n => !n.read).length;
      const bell = `<button class="iconbtn dash-bell" data-a="bell" aria-label="${UI.esc(t('dash.alerts'))}">${UI.icon('bell')}${unread ? `<span class="dash-badge num">${unread > 99 ? '99+' : unread}</span>` : ''}</button>`;

      /* (1) hero */
      const hero = `<section class="card card--gold dash-sec" ${D()}>
        <div class="dash-hero__top">
          <span class="eyebrow">${UI.esc(t('dash.sales'))}</span>
          <span class="dash-hero__live"><span class="livedot"></span>${UI.esc(t('dash.live'))}</span>
        </div>
        <div class="dash-hero__num num">${UI.esc(UI.fmtQty(units))}</div>
        <div class="dash-hero__sub">${UI.esc(t('dash.itemsSold'))}</div>
      </section>`;

      /* (2) stat tiles */
      const statsHtml = `<div class="stats dash-sec" ${D()}>
        <div class="stat"><div class="stat__v num">${UI.esc(UI.fmtQty(distinct))}</div><div class="stat__l">${UI.esc(t('dash.distinct'))}</div></div>
        <div class="stat"><div class="stat__v num ${deliv > 0 ? 'up' : ''}">${deliv > 0 ? '+' : ''}${UI.esc(UI.fmtQty(deliv))}</div><div class="stat__l">${UI.esc(t('rep.restocks'))}</div></div>
        <div class="stat"><div class="stat__v num ${waste > 0 ? 'down' : ''}">${waste > 0 ? '−' : ''}${UI.esc(UI.fmtQty(waste))}</div><div class="stat__l">${UI.esc(t('rep.waste'))}</div></div>
        <div class="stat"><div class="stat__v num ${lcIssues == null ? '' : (lcIssues ? 'down' : 'up')}">${lcIssues == null ? '—' : UI.esc(UI.fmtQty(lcIssues))}</div><div class="stat__l">${UI.esc(t('dash.variance'))}</div>${lc ? `<div class="stat__d tt">${UI.esc(UI.fmtDate(lc.bd))}</div>` : ''}</div>
      </div>`;

      /* (3) 7-day trend */
      const spark = `<section class="card dash-sec" ${D()}>
        <div class="card__head">
          <div class="card__title">${UI.esc(t('dash.7days'))}</div>
          <span class="tt num">${UI.esc(UI.fmtQty(weekTotal))} ${UI.esc(t('g.units'))}</span>
        </div>
        <div class="viz">${sparkSVG(days)}</div>
      </section>`;

      /* (4) low stock */
      const lows = Store.lowItems();
      const lowRows = lows.slice(0, 5).map(it => {
        const cat = Store.cat(it.catId);
        return `<button class="row dash-rowbtn" data-a="low">
          <span class="row__art">${UI.art(it)}</span>
          <span class="row__body"><span class="row__t">${UI.esc(it.name)}</span><span class="row__s">${UI.esc(cat ? Store.catName(cat) : '')}</span></span>
          <span class="row__end"><span class="num dash-lowqty">${UI.esc(UI.fmtQty(Store.stock(it.id)))}</span><span class="tt">${UI.esc(t('dash.thresh', { n: UI.fmtQty(it.threshold) }))}</span></span>
        </button>`;
      }).join('');
      const lowCard = `<section class="card dash-sec" ${D()}>
        <div class="card__head">
          <div class="card__title">${UI.esc(t('dash.lowstock'))}</div>
          ${lows.length ? `<span class="pill pill--danger num">${lows.length}</span>` : ''}
        </div>
        ${lows.length ? lowRows : `<div class="dash-okline">${UI.icon('check')}<span>${UI.esc(t('dash.lowstockNone'))}</span></div>`}
      </section>`;

      /* (5) last count */
      let lcBody;
      if (!lc) {
        lcBody = `<div class="dash-mutline">${UI.icon('count')}<span>${UI.esc(t('dash.noCountYet'))}</span></div>`;
      } else {
        const top3 = [...lcIssueLines].sort((a, b) => Math.abs(b.variance) - Math.abs(a.variance)).slice(0, 3);
        lcBody = `<div class="${top3.length ? 'mb2' : ''}">${lcIssues === 0
            ? `<span class="pill pill--ok">${UI.icon('check')}${UI.esc(t('dash.varianceClean'))}</span>`
            : `<span class="pill pill--danger">${UI.icon('alert')}${UI.esc(t('dash.varianceIssues', { n: lcIssues }))}</span>`}</div>` +
          top3.map(l => {
            const it = Store.item(l.itemId);
            return `<div class="row" style="min-height:48px">
              <div class="row__body"><div class="row__t">${UI.esc(it ? it.name : '?')}</div>${l.note ? `<div class="row__s">${UI.esc(l.note)}</div>` : ''}</div>
              <div class="row__end"><span class="num ${l.variance > 0 ? 'varpos' : 'varneg'}" style="font-weight:700">${UI.esc(signed(l.variance))}</span><div class="tt num">${UI.esc(UI.fmtQty(l.expected))} → ${UI.esc(UI.fmtQty(l.counted))}</div></div>
            </div>`;
          }).join('');
      }
      const lcCard = `<section class="card dash-sec ${lc ? 'dash-tap' : ''}" ${lc ? `data-a="lastcount" data-day="${UI.esc(lc.bd)}"` : ''} ${D()}>
        <div class="card__head">
          <div class="card__title">${UI.esc(t('dash.lastCount'))}</div>
          ${lc ? `<span class="tt dash-lc-date">${UI.esc(UI.fmtDate(lc.bd))}${UI.icon('chevR')}</span>` : ''}
        </div>
        ${lcBody}
      </section>`;

      /* (6) quick actions */
      const qa = [['sell', 'sell', 'dash.qa.sale'], ['count', 'count', 'dash.qa.count'], ['restock', 'truck', 'dash.qa.restock'], ['waste', 'spill', 'dash.qa.waste']];
      const qaCard = `<section class="card dash-sec" ${D()}>
        <div class="card__head"><div class="card__title">${UI.esc(t('dash.quick'))}</div></div>
        <div class="dash-qa">${qa.map(([id, ic, key]) => `<button class="btn btn--ghost" data-go="${id}">${UI.icon(ic)}<span>${UI.esc(t(key))}</span></button>`).join('')}</div>
      </section>`;

      /* (7) live feed — latest 8 of today's sales, voided struck through */
      const feedEntries = Store.state.sales.filter(s => s.bd === today).slice(0, 8);
      const feedRows = feedEntries.map((s, i) => {
        const it = Store.item(s.itemId);
        return `<div class="row ${s.voidedAt ? 'dash-void' : ''}" style="animation-delay:${45 * i}ms">
          <span class="dash-qb num">+${UI.esc(UI.fmtQty(s.qty))}</span>
          <div class="row__body"><div class="row__t">${UI.esc(it ? it.name : '?')}</div></div>
          <div class="row__end tt">${UI.esc(t('sell.by', { name: s.by }))} · <span class="num">${UI.esc(UI.fmtTime(s.at))}</span></div>
        </div>`;
      }).join('');
      const feedCard = `<section class="card dash-sec" ${D()}>
        <div class="card__head"><div class="card__title">${UI.esc(t('dash.feed'))}</div>${feedEntries.length ? '<span class="livedot"></span>' : ''}</div>
        ${feedEntries.length
          ? `<div class="feed">${feedRows}</div>`
          : `<div class="empty" style="padding:24px 16px">${UI.icon('sell')}<div class="empty__s">${UI.esc(t('dash.feedEmpty'))}</div></div>`}
      </section>`;

      el.innerHTML =
        UI.header(t('dash.hello', { name }), UI.fmtDate(today, { weekday: 'long', day: 'numeric', month: 'long' }), bell) +
        hero + statsHtml + spark + lowCard + lcCard + qaCard + feedCard;

      el.addEventListener('click', e => {
        const go = e.target.closest('[data-go]');
        if (go) { UI.haptic('light'); return UI.go(go.dataset.go); }
        if (e.target.closest('[data-a=bell]')) return openNotifs();
        if (e.target.closest('[data-a=low]')) { UI.haptic('light'); return UI.go('inventory'); }
        const lcEl = e.target.closest('[data-a=lastcount]');
        if (lcEl && lcEl.dataset.day) { UI.haptic('light'); return UI.go('reports', { day: lcEl.dataset.day }); }
      });
    },
  });
})();

    [data-screen=inventory] .inv-offbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:14px;color:var(--text-3);font-weight:600;font-size:13px;border-radius:var(--r-el)}

  </style>`));

  /* raw unit values stored on items → display keys */
  const UNITS = [
    ['bouteille', 'inv.unit.bottle'],
    ['canette', 'inv.unit.can'],
    ['portion', 'inv.unit.portion'],
    ['verre', 'inv.unit.glass'],
  ];
  const unitLabel = u => { const m = UNITS.find(x => x[0] === u); return t(m ? m[1] : 'inv.unit.bottle'); };

  /* default art per category for brand-consistent new items */
  const CAT_ART = {
    biere: ['beer', { g: '#7A4A17', l: '#E8E0CE' }],
    rouge: ['wine', { g: '#3B1420', l: '#E2D5BD' }],
    blanc: ['wine-w', { g: '#74763C', l: '#EEE8CE' }],
    rose: ['wine-r', { g: '#A85A6C', l: '#F2E0DC' }],
    demi: ['half', { g: '#34101A', l: '#E8DCC4' }],
    champ: ['champagne', { g: '#5A4A1E', l: '#F2E6BE' }],
    spirit: ['whisky-sq', { g: '#1A1A1A', l: '#E8D9A8' }],
    cuisine: ['cheese', { g: '#C89A3A', l: '#F2E2B0' }],
  };
  const defaultArt = (catId, unit) => unit === 'canette'
    ? ['can', { g: '#27427A', l: '#C8CFDA' }]
    : (CAT_ART[catId] || ['wine', { g: '#3B1420', l: '#E2D5BD' }]);

  /* same normalize-search idiom as sell */
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const parseNum = v => {
    const n = parseFloat(String(v ?? '').replace(',', '.'));
    return isNaN(n) ? null : Math.max(0, Math.round(n * 100) / 100);
  };

  /* transient screen state — survives store-driven re-renders */
  let query = '';
  let catFilter = 'all';
  let showInactive = false;
  let searchFocus = false;

  const emptyHtml = (ic, title, sub) => `<div class="empty">${UI.icon(ic)}<div class="empty__t">${UI.esc(title)}</div>${sub ? `<div class="empty__s">${UI.esc(sub)}</div>` : ''}</div>`;

  function rowHtml(it, off) {
    const stock = Store.stock(it.id);
    const low = !off && Store.isLow(it.id);
    return `<button type="button" class="row" data-edit="${UI.esc(it.id)}">
      <span class="row__art">${UI.art(it)}</span>
      <span class="row__body">
        <span class="row__t">${UI.esc(it.name)}${it.pinned ? `<span class="inv-pin">${UI.icon('pin')}</span>` : ''}</span>
        <span class="row__s">${UI.esc(unitLabel(it.unit))} · ${UI.esc(t('inv.threshold'))} ${UI.esc(UI.fmtQty(it.threshold))}</span>
      </span>
      <span class="row__end">
        <span class="inv-stock num${low ? ' is-low' : ''}">${UI.esc(UI.fmtQty(stock))}</span>
        ${low ? `<span class="pill pill--danger">${UI.esc(t('inv.low'))}</span>` : ''}
      </span>
    </button>`;
  }

  /* ---------- item sheet (edit when id, new otherwise) ---------- */
  function openItemSheet(id) {
    const isNew = !id;
    const src = id ? Store.item(id) : null;
    if (id && !src) return;
    const cur = Store.state.settings.currency;
    const cats = Store.state.categories.slice().sort((a, b) => a.sort - b.sort);
    const d = isNew
      ? {
          name: '',
          catId: (catFilter !== 'all' && Store.cat(catFilter)) ? catFilter : (cats[0] ? cats[0].id : 'biere'),
          unit: 'bouteille', allowDecimal: false, threshold: 6, pinned: false, cost: null, photo: null, barcode: null,
        }
      : {
          name: src.name, catId: src.catId, unit: src.unit, allowDecimal: !!src.allowDecimal,
          threshold: src.threshold, pinned: !!src.pinned, cost: src.cost, photo: src.photo, barcode: src.barcode,
        };
    if (isNew) {
      if (d.catId === 'cuisine') d.unit = 'portion';
      if (d.catId === 'spirit') d.allowDecimal = true;
    }

    const c = UI.el(`<div data-sheet="inv">
      <h2 style="font-size:18px;margin-bottom:16px">${UI.esc(isNew ? t('inv.addItem') : t('inv.editItem'))}</h2>
      <div class="field"><label>${UI.esc(t('inv.name'))}</label><input data-f="name" type="text" value="${UI.esc(d.name)}" autocomplete="off" enterkeyhint="done"></div>
      <div class="inv2col">
        <div class="field"><label>${UI.esc(t('inv.category'))}</label><select data-f="cat">${cats.map(x =>
          `<option value="${UI.esc(x.id)}"${x.id === d.catId ? ' selected' : ''}>${UI.esc(Store.catName(x))}</option>`).join('')}</select></div>
        <div class="field"><label>${UI.esc(t('inv.unit'))}</label><select data-f="unit">${UNITS.map(([v, k]) =>
          `<option value="${v}"${v === d.unit ? ' selected' : ''}>${UI.esc(t(k))}</option>`).join('')}</select></div>
      </div>
      <div class="switchrow">
        <div><div class="switchrow__t">${UI.esc(t('inv.decimal'))}</div><div class="switchrow__s">${UI.esc(t('inv.decimalHint'))}</div></div>
        <button type="button" class="sw${d.allowDecimal ? ' on' : ''}" data-f="dec" role="switch" aria-checked="${d.allowDecimal}" aria-label="${UI.esc(t('inv.decimal'))}"></button>
      </div>
      <div class="switchrow">
        <div><div class="switchrow__t">${UI.esc(t('inv.pinned'))}</div><div class="switchrow__s">${UI.esc(t('inv.pinnedHint'))}</div></div>
        <button type="button" class="sw${d.pinned ? ' on' : ''}" data-f="pin" role="switch" aria-checked="${d.pinned}" aria-label="${UI.esc(t('inv.pinned'))}"></button>
      </div>
      <div class="inv2col mt3">
        <div class="field" style="margin-bottom:6px"><label>${UI.esc(t('inv.threshold'))}</label><input data-f="thr" type="number" min="0" step="any" inputmode="decimal" value="${d.threshold ?? ''}"></div>
        <div class="field" style="margin-bottom:6px"><label>${UI.esc(t('inv.cost', { cur }))}</label><input data-f="cost" type="number" min="0" step="any" inputmode="decimal" value="${d.cost ?? ''}"></div>
      </div>
      <div class="tt" style="margin-bottom:16px">${UI.esc(t('inv.costHint'))}</div>
      ${isNew ? '' : `
      <div class="field"><label>${UI.esc(t('inv.photo'))}</label>
        <div class="invsheet-photo">
          <div class="invsheet-prev" data-r="prev"></div>
          <div class="invsheet-pbtns">
            <button type="button" class="btn btn--ghost" data-a="ptake">${UI.icon('camera')}<span>${UI.esc(t('inv.photoTake'))}</span></button>
            <button type="button" class="btn btn--ghost" data-a="ppick">${UI.icon('upload')}<span>${UI.esc(t('inv.photoPick'))}</span></button>
            <button type="button" class="btn btn--line${d.photo ? '' : ' hidden'}" data-a="prm">${UI.icon('trash')}<span>${UI.esc(t('inv.photoRemove'))}</span></button>
          </div>
        </div>
      </div>
      <div class="field"><label>${UI.esc(t('inv.barcode'))}</label>
        <div class="invsheet-code">
          <span class="invsheet-codev num" data-r="code"></span>
          <button type="button" class="btn btn--ghost" data-a="scan">${UI.icon('scan')}<span>${UI.esc(t('inv.barcodeScan'))}</span></button>
        </div>
      </div>`}
      <div class="invsheet-foot">
        <button type="button" class="btn btn--gold btn--big btn--full" data-a="save">${UI.esc(t('g.save'))}</button>
        ${isNew ? '' : (src.active
          ? `<button type="button" class="btn btn--danger btn--full" data-a="deact">${UI.esc(t('inv.deactivate'))}</button>`
          : `<button type="button" class="btn btn--ghost btn--full" data-a="react">${UI.esc(t('inv.reactivate'))}</button>`)}
      </div>
    </div>`);
    const s = UI.sheet(c);

    const updPrev = () => {
      const p = c.querySelector('[data-r=prev]');
      if (!p) return;
      if (d.photo) p.innerHTML = `<img src="${d.photo}" alt="${UI.esc(d.name)}">`;
      else {
        const live = Store.item(id) || src;
        p.innerHTML = UI.art({ ...live, catId: d.catId, name: d.name || live.name, photo: null });
      }
      const rm = c.querySelector('[data-a=prm]');
      if (rm) rm.classList.toggle('hidden', !d.photo);
    };
    const updCode = () => {
      const n = c.querySelector('[data-r=code]');
      if (!n) return;
      n.textContent = d.barcode || t('inv.noBarcode');
      n.classList.toggle('is-none', !d.barcode);
    };
    if (!isNew) { updPrev(); updCode(); }

    c.addEventListener('click', async e => {
      const sw = e.target.closest('[data-f=dec],[data-f=pin]');
      if (sw) {
        const k = sw.dataset.f === 'dec' ? 'allowDecimal' : 'pinned';
        d[k] = !d[k];
        sw.classList.toggle('on', d[k]);
        sw.setAttribute('aria-checked', String(d[k]));
        UI.haptic('light');
        return;
      }
      const b = e.target.closest('[data-a]');
      if (!b) return;
      const a = b.dataset.a;
      if (a === 'ptake' || a === 'ppick') {
        const img = await UI.pickImage(a === 'ptake' ? { capture: true } : {});
        if (img) { d.photo = img; updPrev(); UI.haptic('light'); }
      } else if (a === 'prm') {
        d.photo = null; updPrev(); UI.haptic('light');
      } else if (a === 'scan') {
        UI.scan({
          onCode: code => {
            d.barcode = String(code);
            updCode();
            UI.haptic('success');
            UI.toast(t('inv.barcodeSet', { code: d.barcode }), { type: 'ok' });
          },
        });
      } else if (a === 'save') {
        const nameEl = c.querySelector('[data-f=name]');
        const name = nameEl.value.trim();
        if (!name) { UI.haptic('warn'); UI.toast(t('inv.nameRequired'), { type: 'danger' }); nameEl.focus(); return; }
        const catId = c.querySelector('[data-f=cat]').value;
        const unit = c.querySelector('[data-f=unit]').value;
        const thr = parseNum(c.querySelector('[data-f=thr]').value);
        const cost = parseNum(c.querySelector('[data-f=cost]').value);
        const patch = { name, catId, unit, allowDecimal: d.allowDecimal, pinned: d.pinned, cost, threshold: thr };
        if (isNew) {
          const [art, tint] = defaultArt(catId, unit);
          if (thr == null) delete patch.threshold; // store default applies
          Store.saveItem({ ...patch, art, tint });
        } else {
          const live = Store.item(id); // live data at action time
          if (!live) { s.close(); return; }
          if (thr == null) patch.threshold = live.threshold;
          Store.saveItem({ id, ...patch, photo: d.photo, barcode: d.barcode });
        }
        UI.haptic('success');
        UI.toast(t('inv.saved'), { type: 'ok' });
        s.close();
      } else if (a === 'deact') {
        const ok = await UI.confirm(t('inv.deactivateWarn'), { danger: true, title: t('inv.deactivate'), yes: t('inv.deactivate') });
        if (!ok) return;
        if (Store.item(id)) Store.saveItem({ id, active: false });
        UI.haptic('warn');
        UI.toast(t('inv.deactivated'));
        s.close();
      } else if (a === 'react') {
        if (Store.item(id)) Store.saveItem({ id, active: true });
        UI.haptic('success');
        UI.toast(t('inv.reactivated'), { type: 'ok' });
        s.close();
      }
    });
  }

  /* ---------- screen ---------- */
  UI.registerScreen({
    id: 'inventory',
    render(el) {
      if (!Store.isOwner) { // owner-only guard, same as dashboard
        el.innerHTML = '';
        setTimeout(() => UI.go(Store.state.session ? 'sell' : 'login'), 0);
        return;
      }
      if (catFilter !== 'all' && !Store.cat(catFilter)) catFilter = 'all';
      const st = Store.state;
      const cats = st.categories.slice().sort((a, b) => a.sort - b.sort);

      el.innerHTML = UI.header(t('inv.title'), st.settings.barName,
        `<button type="button" class="iconbtn" data-a="new" aria-label="${UI.esc(t('inv.addItem'))}">${UI.icon('plus')}</button>`) + `
        <div class="search">${UI.icon('search')}
          <input type="text" placeholder="${UI.esc(t('g.search'))}" autocomplete="off" enterkeyhint="search" aria-label="${UI.esc(t('g.search'))}">
          <button type="button" class="iconbtn iconbtn--plain search__clear${query ? '' : ' hidden'}" data-a="clear" aria-label="${UI.esc(t('g.close'))}">${UI.icon('x')}</button>
        </div>
        <div class="chips" role="tablist">
          <button type="button" class="chip${catFilter === 'all' ? ' is-on' : ''}" data-cat="all" aria-pressed="${catFilter === 'all'}">${UI.esc(t('g.all'))}</button>
          ${cats.map(cg => `<button type="button" class="chip${catFilter === cg.id ? ' is-on' : ''}" data-cat="${UI.esc(cg.id)}" aria-pressed="${catFilter === cg.id}"><i class="dot" style="--c:${UI.esc(cg.color)}"></i>${UI.esc(Store.catName(cg))}</button>`).join('')}
        </div>
        <div class="inv-list"></div>`;

      const input = el.querySelector('.search input');
      const clearBtn = el.querySelector('[data-a=clear]');
      const listEl = el.querySelector('.inv-list');
      input.value = query;
      input.addEventListener('focus', () => { searchFocus = true; });
      input.addEventListener('blur', () => { searchFocus = false; });
      input.addEventListener('input', () => {
        query = input.value;
        clearBtn.classList.toggle('hidden', !query);
        renderList();
      });
      if (searchFocus) {
        input.focus();
        try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) {}
      }

      function renderList() {
        const q = norm(query.trim());
        const match = it => (catFilter === 'all' || it.catId === catFilter) && (!q || norm(it.name).includes(q));
        const act = Store.activeItems().filter(match);
        const off = st.items.filter(i => !i.active).sort((a, b) => a.sort - b.sort).filter(match);
        let html = '';
        if (!act.length) {
          if (!st.items.length) html += emptyHtml('stock', t('inv.emptyAll'), t('inv.emptyAllSub'));
          else if (!off.length) html += q
            ? emptyHtml('search', t('sell.noresults'), t('sell.noresults.hint'))
            : emptyHtml('stock', t('inv.empty'), '');
        } else {
          const groups = cats.map(cg => ({ cg, items: act.filter(i => i.catId === cg.id) })).filter(g => g.items.length);
          const orphans = act.filter(i => !Store.cat(i.catId));
          html += groups.map((g, gi) => `<section class="card inv-group" style="animation-delay:${Math.min(gi * 45, 220)}ms">
            <div class="invcat"><i class="dot" style="--c:${UI.esc(g.cg.color)}"></i><span class="invcat__n">${UI.esc(Store.catName(g.cg))}</span><span class="pill pill--mut num">${g.items.length}</span></div>
            ${g.items.map(i => rowHtml(i, false)).join('')}
          </section>`).join('');
          if (orphans.length) html += `<section class="card inv-group">${orphans.map(i => rowHtml(i, false)).join('')}</section>`;
        }
        if (off.length) {
          const open = showInactive || !!q;
          html += `<button type="button" class="inv-offbtn${open ? ' is-open' : ''}" data-a="toggleOff" aria-expanded="${open}">${UI.icon('chevR')}<span>${UI.esc(t('inv.inactive'))}</span><span class="pill pill--mut num">${off.length}</span></button>`;
          if (open) html += `<section class="card inv-group inv-off">${off.map(i => rowHtml(i, true)).join('')}</section>`;
        }
        listEl.innerHTML = html;
      }

      el.addEventListener('click', e => {
        if (e.target.closest('[data-a=new]')) { UI.haptic('light'); openItemSheet(null); return; }
        if (e.target.closest('[data-a=clear]')) {
          query = ''; input.value = '';
          clearBtn.classList.add('hidden');
          renderList(); input.focus();
          return;
        }
        if (e.target.closest('[data-a=toggleOff]')) { showInactive = !showInactive; UI.haptic('light'); renderList(); return; }
        const chip = e.target.closest('[data-cat]');
        if (chip) {
          catFilter = chip.dataset.cat;
          el.querySelectorAll('[data-cat]').forEach(x => {
            const on = x.dataset.cat === catFilter;
            x.classList.toggle('is-on', on);
            x.setAttribute('aria-pressed', String(on));
          });
          UI.haptic('light'); renderList();
          return;
        }
        const row = e.target.closest('[data-edit]');
        if (row) { UI.haptic('light'); openItemSheet(row.dataset.edit); }
      });

      renderList();
    },
  });
})();

  @keyframes cnt-draw{to{stroke-dashoffset:0}}
  @keyframes cnt-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    [data-screen=count] .rev-row,
    [data-screen=count].cnt-ov .cnt-ov__ring,[data-screen=count].cnt-ov .cnt-ov__ck,
    [data-screen=count].cnt-ov h2,[data-screen=count].cnt-ov p{animation-delay:0ms!important}
  }`;

  function ensureStyle() {
    if (document.getElementById('cnt-css')) return;
    document.head.appendChild(UI.el('<style id="cnt-css">' + CSS + '</style>'));
  }

  /* categories by sort, then items by their sort inside each */
  function orderedItems() {
    const cats = [...Store.state.categories].sort((a, b) => a.sort - b.sort);
    const act = Store.activeItems();
    const out = [];
    for (const c of cats) out.push(...act.filter(i => i.catId === c.id));
    out.push(...act.filter(i => !cats.some(c => c.id === i.catId)));
    return out;
  }

  function setPos(i, c, ordered) {
    V.idx = i; V.mode = 'walk'; V.revealed = false;
    const ln = c.lines.find(l => l.itemId === ordered[i].id);
    V.buf = ln ? String(ln.counted) : '';
  }

  function applyKey(buf, k, dec) {
    if (k === 'del') return buf.slice(0, -1);
    if (k === 'dot') { if (!dec || buf.includes('.')) return buf; return (buf === '' ? '0' : buf) + '.'; }
    if (buf.includes('.')) { if (buf.split('.')[1].length >= 2) return buf; return buf + k; }
    if (buf.length >= 5) return buf;
    return buf === '0' ? k : buf + k;
  }

  /* ---------- closing moment: full-screen gold ring draw + check ---------- */
  function showCloseMoment() {
    const ov = UI.el(`<div class="cnt-ov" data-screen="count" role="status">
      <svg viewBox="0 0 100 100" width="118" height="118" aria-hidden="true">
        <defs><linearGradient id="cntOvG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F7C14B"/><stop offset="1" stop-color="#E8940A"/>
        </linearGradient></defs>
        <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="5"/>
        <circle class="cnt-ov__ring" cx="50" cy="50" r="46" fill="none" stroke="url(#cntOvG)" stroke-width="5" stroke-linecap="round" transform="rotate(-90 50 50)"/>
        <path class="cnt-ov__ck" d="M31 52l13 13 25-27" fill="none" stroke="url(#cntOvG)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>${UI.esc(t('count.closed'))}</h2>
      <p>${UI.esc(t('count.closedSub'))}</p>
    </div>`);
    document.body.appendChild(ov);
    UI.haptic('success');
    setTimeout(() => ov.classList.add('is-out'), 1800);
    setTimeout(() => ov.remove(), 2120);
  }

  /* ---------- note / edit sheet (lives outside the screen; reads fresh at action time) ---------- */
  function openLineSheet(countId, item) {
    const c0 = Store.state.counts.find(x => x.id === countId);
    if (!c0) return;
    const l0 = c0.lines.find(l => l.itemId === item.id);
    let buf = l0 ? String(l0.counted) : '';
    const exp = l0 ? l0.expected : Store.countExpected(item.id, c0.bd);
    const content = UI.el(`<div data-screen="count">
      <div class="row" style="border:0;padding:0;min-height:0;margin-bottom:var(--s3)">
        <span class="row__art">${UI.art(item)}</span>
        <span class="row__body">
          <span class="row__t">${UI.esc(item.name)}</span>
          <span class="row__s">${UI.esc(t('count.expected'))} ${UI.esc(UI.fmtQty(exp))} · ${UI.esc(t('u.' + item.unit))}</span>
        </span>
      </div>
      <div class="cw-in num" data-el="d" style="font-size:26px;min-height:58px"></div>
      <div class="cw-pad" data-el="p"></div>
      <div class="field mt4"><label>${UI.esc(t('count.note'))}</label>
        <textarea rows="3" placeholder="${UI.esc(t('count.notePh'))}">${UI.esc(l0 ? (l0.note || '') : '')}</textarea></div>
      <button class="btn btn--gold btn--full" data-a="save">${UI.esc(t('g.save'))}</button>
    </div>`);
    const disp = () => {
      const d = content.querySelector('[data-el=d]');
      d.classList.toggle('has', buf !== '');
      d.innerHTML = buf !== ''
        ? UI.esc(fmtBuf(buf))
        : `<span style="font-size:13px;font-weight:500;color:var(--text-3)">${UI.esc(t('count.enterCount'))}</span>`;
    };
    disp();
    UI.numpad(content.querySelector('[data-el=p]'), { decimal: !!item.allowDecimal, onKey: k => { buf = applyKey(buf, k, !!item.allowDecimal); disp(); } });
    const s = UI.sheet(content);
    content.querySelector('[data-a=save]').addEventListener('click', () => {
      const note = content.querySelector('textarea').value.trim();
      const cc = Store.state.counts.find(x => x.id === countId);   // fresh read
      if (!cc || cc.status !== 'open') return s.close();
      const val = Math.round(parseFloat(buf) * 100) / 100;
      const ln = cc.lines.find(l => l.itemId === item.id);
      if (buf !== '' && !isNaN(val)) { Store.setCountLine(countId, item.id, val, note); UI.haptic('light'); }
      else if (ln && note !== (ln.note || '')) Store.setCountNote(countId, item.id, note);
      s.close();
    });
  }

  /* ---------- entry states ---------- */
  function renderLocked(el) {
    el.innerHTML = UI.header(t('count.title')) + `
      <div class="empty grow">${UI.icon('lock')}
        <div class="empty__t">${UI.esc(t('count.ownerOnly'))}</div>
        <div class="empty__s">${UI.esc(t('count.ownerOnlySub'))}</div>
      </div>`;
  }

  function renderNoItems(el) {
    el.innerHTML = UI.header(t('count.title')) + `
      <div class="empty grow">${UI.icon('stock')}
        <div class="empty__t">${UI.esc(t('count.noItems'))}</div>
        <div class="empty__s">${UI.esc(t('count.noItemsSub'))}</div>
      </div>`;
  }

  function renderStart(el, ordered, today) {
    const sumExp = ordered.reduce((s, o) => s + Math.max(0, Store.countExpected(o.id, today)), 0);
    el.innerHTML = UI.header(t('count.title'), t('count.forDay', { date: UI.fmtDate(today) })) + `
      <div class="card card--gold">
        <p style="color:var(--text-2);font-size:14px;line-height:1.55">${UI.esc(t('count.startHint'))}</p>
        <div class="stats mt4">
          <div class="stat"><div class="stat__v num">${ordered.length}</div><div class="stat__l">${UI.esc(t('count.itemsToCount'))}</div></div>
          <div class="stat"><div class="stat__v num">${UI.esc(UI.fmtQty(sumExp))}</div><div class="stat__l">${UI.esc(t('inv.expected'))}</div></div>
        </div>
        <button class="btn btn--gold btn--big btn--full mt4" data-a="start">${UI.icon('count')} ${UI.esc(t('count.start'))}</button>
      </div>`;
    el.addEventListener('click', e => {
      if (!e.target.closest('[data-a=start]')) return;
      if (!Store.isOwner) return;
      UI.haptic('light');
      V.countId = null; V.closedId = null; V.revealed = false;
      Store.openCount();
    });
  }

  /* ---------- walkthrough: one item at a time ---------- */
  function renderWalk(el, c, ordered) {
    const it = ordered[V.idx];
    const catg = Store.cat(it.catId);
    const done = ordered.filter(o => c.lines.some(l => l.itemId === o.id)).length;
    const total = ordered.length;
    const exp = Store.countExpected(it.id, c.bd);
    el.innerHTML = `
      <div class="cw-top">
        ${UI.ring(done / total, done + '/' + total)}
        <div class="cw-top__body">
          <div class="cw-top__cat">${UI.esc(catg ? Store.catName(catg) : '')}</div>
          <div class="cw-top__sub">${UI.esc(t('count.forDay', { date: UI.fmtDate(c.bd) }))}</div>
        </div>
        <button class="iconbtn" data-a="scan" aria-label="${UI.esc(t('sell.scan'))}">${UI.icon('scan')}</button>
        <button class="iconbtn" data-a="exit" aria-label="${UI.esc(t('g.close'))}">${UI.icon('x')}</button>
      </div>
      <div class="card cw-stage">
        <div class="cw-art">${UI.art(it)}</div>
        <h2 class="cw-name">${UI.esc(it.name)}</h2>
        <div class="cw-unit">${UI.esc(t('u.' + it.unit))}</div>
        <div class="cw-duo">
          <div class="cw-exp"><span class="eyebrow">${UI.esc(t('count.expected'))}</span><b class="num">${UI.esc(UI.fmtQty(exp))}</b></div>
          <div class="cw-in num" data-el="disp" aria-label="${UI.esc(t('count.counted'))}"></div>
        </div>
        <div class="cw-pad" data-el="pad"></div>
        <div class="cw-acts">
          <button class="iconbtn" data-a="prev" ${V.idx === 0 ? 'disabled' : ''} aria-label="${UI.esc(t('g.back'))}">${UI.icon('chevL')}</button>
          <button class="btn btn--ghost" data-a="skip">${UI.esc(t('count.skip'))}</button>
          <button class="btn btn--gold" data-a="ok">${UI.icon('check')} ${UI.esc(t('g.confirm'))}</button>
        </div>
      </div>`;
    const disp = () => {
      const d = el.querySelector('[data-el=disp]'); if (!d) return;
      const has = V.buf !== '' && !isNaN(parseFloat(V.buf));
      d.classList.toggle('has', V.buf !== '');
      d.innerHTML = V.buf !== ''
        ? UI.esc(fmtBuf(V.buf))
        : `<span style="font-size:13px;font-weight:500;color:var(--text-3)">${UI.esc(t('count.enterCount'))}</span>`;
      const ok = el.querySelector('[data-a=ok]'); if (ok) ok.disabled = !has;
    };
    disp();
    UI.numpad(el.querySelector('[data-el=pad]'), { decimal: !!it.allowDecimal, onKey: k => { V.buf = applyKey(V.buf, k, !!it.allowDecimal); disp(); } });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'exit') { UI.haptic('light'); return UI.go('dashboard'); }   // confirm-less: count stays open
      if (a === 'scan') {
        return UI.scan({ onCode: code => {
          const found = Store.findByBarcode(code);
          const j = found ? ordered.findIndex(o => o.id === found.id) : -1;
          if (j >= 0) { setPos(j, c, ordered); UI.haptic('light'); UI.refresh(); }
          else { UI.haptic('warn'); UI.toast(t('count.scanMiss'), { type: 'danger' }); }
        } });
      }
      if (a === 'prev') { if (V.idx > 0) { setPos(V.idx - 1, c, ordered); UI.refresh(); } return; }
      if (a === 'skip') {
        UI.haptic('light');
        if (V.idx >= ordered.length - 1) { V.mode = 'review'; V.revealed = false; } else setPos(V.idx + 1, c, ordered);
        return UI.refresh();
      }
      if (a === 'ok') {
        const val = Math.round(parseFloat(V.buf) * 100) / 100;
        if (isNaN(val)) return;
        UI.haptic('light');
        if (V.idx >= ordered.length - 1) { V.mode = 'review'; V.revealed = false; V.buf = ''; }
        else setPos(V.idx + 1, c, ordered);
        Store.setCountLine(c.id, it.id, val);   // emits → screen re-renders on updated V
      }
    });
  }

  /* ---------- review: the variance reveal ---------- */
  function renderReview(el, c, ordered) {
    const lineOf = id => c.lines.find(l => l.itemId === id);
    const done = ordered.filter(o => lineOf(o.id)).length;
    const missing = ordered.length - done;
    const sum = Math.round(c.lines.reduce((s, l) => s + l.variance, 0) * 100) / 100;
    const nonzero = c.lines.filter(l => l.variance !== 0).length;
    const clean = missing === 0 && nonzero === 0 && ordered.length > 0;
    const anim = !V.revealed; V.revealed = true;
    const rows = ordered.map((it2, i) => {
      const l = lineOf(it2.id);
      let sub, end;
      if (l) {
        const parts = [`${UI.esc(UI.fmtQty(l.expected))} → ${UI.esc(UI.fmtQty(l.counted))}`];
        if (l.autofilled) parts.push(UI.esc(t('count.autofilled')));
        if (l.note) parts.push(UI.esc(l.note.length > 26 ? l.note.slice(0, 25) + '…' : l.note));
        sub = parts.join(' · ');
        end = `<span class="rev-var ${varCls(l.variance)}">${UI.esc(fmtVar(l.variance))}</span>`;
      } else {
        sub = `${UI.esc(t('count.expected'))} ${UI.esc(UI.fmtQty(Store.countExpected(it2.id, c.bd)))} · ${UI.esc(t('count.skipped'))}`;
        end = `<span class="rev-var varzero">—</span>`;
      }
      return `<button class="row rev-row ${anim ? '' : 'no-anim'}" data-i="${i}" ${anim ? `style="animation-delay:${Math.min(i * 35, 650)}ms"` : ''}>
        <span class="row__art">${UI.art(it2)}</span>
        <span class="row__body"><span class="row__t">${UI.esc(it2.name)}</span><span class="row__s">${sub}</span></span>
        <span class="row__end">${end}</span>
      </button>`;
    }).join('');
    el.innerHTML = UI.header(t('count.review'), t('count.reviewHint'),
      `<button class="iconbtn" data-a="backwalk" aria-label="${UI.esc(t('g.back'))}">${UI.icon('chevL')}</button>
       <button class="iconbtn" data-a="exit" aria-label="${UI.esc(t('g.close'))}">${UI.icon('x')}</button>`) + `
      <div class="card" style="padding:6px 16px">${rows}</div>
      ${clean ? `
      <div class="card card--gold mt3" style="text-align:center;padding:24px 16px">
        <span class="cnt-spark">${UI.icon('sparkles')}</span>
        <h2 style="font-size:20px;margin-top:8px">${UI.esc(t('count.clean'))}</h2>
        <p style="color:var(--text-2);font-size:13.5px;margin-top:4px">${UI.esc(t('count.cleanSub'))}</p>
      </div>` : `
      <div class="card mt3">
        <div class="card__head" style="margin-bottom:6px">
          <span class="card__title">${UI.esc(t('count.varTotal'))}</span>
          <span class="rev-var ${varCls(sum)}" style="font-size:22px">${UI.esc(fmtVar(sum))}</span>
        </div>
        <div class="tt">${UI.esc(nonzero ? t('dash.varianceIssues', { n: nonzero }) : t('dash.varianceClean'))}</div>
        ${missing ? `<div class="tt mt2 cnt-alert">${UI.icon('alert')}<span>${UI.esc(t('count.missing', { n: missing }))}</span></div>` : ''}
      </div>`}
      <button class="btn btn--gold btn--big btn--full mt4" data-a="close">${UI.icon('check')} ${UI.esc(t('count.closeDay'))}</button>`;
    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-a],[data-i]'); if (!b) return;
      const a = b.dataset.a;
      if (a === 'exit') { UI.haptic('light'); return UI.go('dashboard'); }
      if (a === 'backwalk') { setPos(ordered.length - 1, c, ordered); return UI.refresh(); }
      if (a === 'close') {
        const ok = await UI.confirm(t('count.closeConfirm'), { title: t('count.closeDay'), yes: t('count.closeDay') });
        if (!ok) return;
        const closed = Store.closeCount(c.id);
        if (closed) { V.closedId = closed.id; V.countId = null; V.mode = null; showCloseMoment(); }
        return;
      }
      if (b.dataset.i !== undefined) openLineSheet(c.id, ordered[+b.dataset.i]);
    });
  }

  /* ---------- done state: day closed ---------- */
  function renderDone(el, cc) {
    const nonzero = cc.lines.filter(l => l.variance !== 0).length;
    const sum = Math.round(cc.lines.reduce((s, l) => s + l.variance, 0) * 100) / 100;
    el.innerHTML = UI.header(t('count.title')) + `
      <div class="cd-wrap grow">
        <div class="cd-check">${UI.icon('check')}</div>
        <h1 style="font-size:24px;margin-top:10px">${UI.esc(t('count.closed'))}</h1>
        <div style="color:var(--text-2);font-size:14px">${UI.esc(UI.fmtDate(cc.bd, { weekday: 'long', day: 'numeric', month: 'long' }))}</div>
        <div style="font-size:13.5px">
          ${nonzero
            ? `<span class="num ${varCls(sum)}" style="font-weight:700">${UI.esc(fmtVar(sum))}</span> <span style="color:var(--text-2)">· ${UI.esc(t('dash.varianceIssues', { n: nonzero }))}</span>`
            : `<span style="color:var(--ok);font-weight:600">${UI.esc(t('dash.varianceClean'))}</span>`}
        </div>
        ${cc.closedBy ? `<div class="tt">${UI.esc(t('sell.by', { name: cc.closedBy }))}${cc.closedAt ? ' · ' + UI.esc(UI.fmtTime(cc.closedAt)) : ''}</div>` : ''}
        <div style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px;margin-top:var(--s6)">
          <button class="btn btn--gold btn--big btn--full" data-a="report">${UI.icon('calendar')} ${UI.esc(t('count.viewReport'))}</button>
          ${cc.isOpening ? '' : `<button class="btn btn--ghost btn--full" data-a="reopen">${UI.esc(t('count.reopen'))}</button>`}
        </div>
      </div>`;
    el.addEventListener('click', async e => {
      const b = e.target.closest('[data-a]'); if (!b) return;
      if (b.dataset.a === 'report') return UI.go('reports', { day: cc.bd });
      if (b.dataset.a === 'reopen') {
        const ok = await UI.confirm(t('count.reopenWarn'), { danger: true, title: t('count.reopen'), yes: t('count.reopen') });
        if (ok && Store.reopenCount(cc.id)) { V.countId = null; V.closedId = null; UI.haptic('warn'); }
      }
    });
  }

  /* ---------- register ---------- */
  UI.registerScreen({
    id: 'count',
    render(el) {
      ensureStyle();
      if (!Store.isOwner) return renderLocked(el);
      const st = Store.state, today = Store.todayBd();
      const ordered = orderedItems();
      const closedToday = st.counts.find(c => c.status === 'closed' && !c.isOpening && c.bd === today)
        || (V.closedId ? st.counts.find(c => c.id === V.closedId && c.status === 'closed') : null);
      const open = st.counts.find(c => c.status === 'open');
      if (closedToday && !open) return renderDone(el, closedToday);        // (a) day already closed
      if (open) {                                                          // (b) resume where left
        if (!ordered.length) return renderNoItems(el);
        if (V.countId !== open.id) {
          V.countId = open.id; V.closedId = null; V.revealed = false;
          const fi = ordered.findIndex(o => !open.lines.some(l => l.itemId === o.id));
          if (fi === -1) { V.mode = 'review'; V.idx = ordered.length - 1; V.buf = ''; }
          else setPos(fi, open, ordered);
        }
        if (V.idx >= ordered.length) V.idx = ordered.length - 1;
        if (V.mode === 'review') return renderReview(el, open, ordered);
        return renderWalk(el, open, ordered);
      }
      if (!ordered.length) return renderNoItems(el);                       // nothing to count yet
      renderStart(el, ordered, today);                                     // (c) start card
    },
  });
})();

/* == 25-screen-restock-waste.js == */
/* ============ Screens: restock (livraison) + waste (casse & pertes) — owner only ============ */
(() => {
  I18N.extend({
    fr: {
      'rw.todayRestock': 'Livraisons du jour',
      'rw.todayWaste': 'Pertes du jour',
      'rw.inStock': 'En stock : {qty} {unit}',
      'rw.clear': 'Effacer la recherche',
      'restock.confirmBtn': 'Ajouter +{qty}',
      'waste.confirmBtn': 'Déclarer −{qty}',
    },
    en: {
      'rw.todayRestock': "Today's deliveries",
      'rw.todayWaste': "Today's waste",
      'rw.inStock': 'In stock: {qty} {unit}',
      'rw.clear': 'Clear search',
      'restock.confirmBtn': 'Add +{qty}',
      'waste.confirmBtn': 'Log −{qty}',
    },
  });

  /* transient per-screen UI state — survives store-driven re-renders (rule 9) */
  const ST = {
    restock: { q: '', cat: 'all' },
    waste: { q: '', cat: 'all' },
  };
  const QUICK = [1, 6, 12, 24];

  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  function filtered(mode) {
    const st = ST[mode];
    let items = Store.activeItems();
    if (st.cat !== 'all') items = items.filter(i => i.catId === st.cat);
    const q = norm(st.q.trim());
    if (q) items = items.filter(i => norm(i.name).includes(q));
    return items;
  }

  function icardHtml(it) {
    const stock = Store.stock(it.id);
    const low = Store.isLow(it.id);
    return `<button type="button" class="icard" data-item="${it.id}" aria-label="${UI.esc(it.name)}">
      <div class="icard__art">${UI.art(it)}</div>
      ${low ? `<span class="pill pill--danger icard__badge">${UI.esc(t('inv.low'))}</span>` : ''}
      <div class="icard__name">${UI.esc(it.name)}</div>
      <div class="icard__meta"><span class="num">${UI.fmtQty(stock)}</span> ${UI.esc(t('u.' + it.unit))}</div>
    </button>`;
  }

  function gridSection(mode) {
    const items = filtered(mode);
    if (!items.length) {
      const searching = !!ST[mode].q.trim();
      return `<div class="empty">${UI.icon(mode === 'waste' ? 'spill' : 'truck')}
        <div class="empty__t">${UI.esc(t(searching ? 'sell.noresults' : 'inv.empty'))}</div>
        ${searching ? `<div class="empty__s">${UI.esc(t('sell.noresults.hint'))}</div>` : ''}
      </div>`;
    }
    return `<div class="igrid">${items.map(icardHtml).join('')}</div>`;
  }

  function todayCardHtml(mode) {
    const bd = Store.todayBd();
    const isWaste = mode === 'waste';
    const entries = (isWaste ? Store.state.waste : Store.state.restocks).filter(e => e.bd === bd);
    if (!entries.length) return '';
    const total = Math.round(entries.reduce((s, e) => s + e.qty, 0) * 100) / 100;
    const sign = isWaste ? '−' : '+';
    const color = isWaste ? 'var(--danger)' : 'var(--ok)';
    return `<div class="card mt4">
      <div class="card__head">
        <div class="card__title">${UI.esc(t(isWaste ? 'rw.todayWaste' : 'rw.todayRestock'))}</div>
        <span class="pill ${isWaste ? 'pill--danger' : 'pill--ok'} num">${sign}${UI.fmtQty(total)}</span>
      </div>
      <div class="feed">
        ${entries.map(e => {
          const it = Store.item(e.itemId);
          return `<div class="row">
            <span class="qtybubble num" style="color:${color};min-width:46px;text-align:right;flex:none">${sign}${UI.fmtQty(e.qty)}</span>
            <div class="row__body">
              <div class="row__t">${UI.esc(it ? it.name : '?')}</div>
              ${isWaste && e.reason ? `<div class="row__s tt">${UI.esc(e.reason)}</div>` : ''}
            </div>
            <div class="row__end tt num">${UI.esc(UI.fmtTime(e.at))}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  /* ---- qty sheet (stepper + quick chips; waste adds required reason) ---- */
  function openQtySheet(mode, itemId) {
    const item = Store.item(itemId);
    if (!item || !Store.isOwner) return;
    const isWaste = mode === 'waste';
    let qty = 1;
    const c = UI.el(`<div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
        <div class="row__art" style="width:52px;height:52px">${UI.art(item)}</div>
        <div style="flex:1;min-width:0">
          <div style="font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${UI.esc(item.name)}</div>
          <div class="tt" style="margin-top:2px">${UI.esc(t('rw.inStock', { qty: UI.fmtQty(Store.stock(item.id)), unit: t('u.' + item.unit) }))}</div>
        </div>
      </div>
      <div class="stepper">
        <button type="button" class="stepper__btn" data-a="minus" aria-label="−1">−</button>
        <div class="stepper__v num" data-el="v" style="color:${isWaste ? 'var(--danger)' : 'var(--text)'}">1</div>
        <button type="button" class="stepper__btn" data-a="plus" aria-label="+1">+</button>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:14px">
        ${QUICK.map(n => `<button type="button" class="chip num" data-q="${n}" style="min-width:52px;justify-content:center">${n}</button>`).join('')}
      </div>
      ${isWaste ? `
      <div class="field" style="margin-top:20px;margin-bottom:0">
        <label for="rw-reason">${UI.esc(t('waste.reason'))}</label>
        <input id="rw-reason" type="text" data-el="reason" placeholder="${UI.esc(t('waste.reasonPh'))}" maxlength="140" autocomplete="off" enterkeyhint="done">
        <div class="tt hidden" data-el="reasonHelp" style="color:var(--danger);margin-top:6px">${UI.esc(t('waste.reasonRequired'))}</div>
      </div>` : ''}
      <button type="button" class="btn btn--gold btn--big btn--full" data-a="ok" style="margin-top:20px"></button>
    </div>`);
    const s = UI.sheet(c);
    const vEl = c.querySelector('[data-el=v]');
    const okBtn = c.querySelector('[data-a=ok]');
    const minusBtn = c.querySelector('[data-a=minus]');
    const chips = [...c.querySelectorAll('[data-q]')];
    const reasonInp = c.querySelector('[data-el=reason]');
    const helpEl = c.querySelector('[data-el=reasonHelp]');

    const blocked = () => isWaste && !reasonInp.value.trim();
    function sync() {
      vEl.textContent = UI.fmtQty(qty);
      minusBtn.style.opacity = qty <= 1 ? '.4' : '';
      chips.forEach(ch => ch.classList.toggle('is-on', Number(ch.dataset.q) === qty));
      okBtn.textContent = t(isWaste ? 'waste.confirmBtn' : 'restock.confirmBtn', { qty: UI.fmtQty(qty) });
      okBtn.style.opacity = blocked() ? '.55' : '';
      okBtn.setAttribute('aria-disabled', blocked() ? 'true' : 'false');
    }
    sync();

    function confirm() {
      /* read fresh data at action time (rule 9) */
      const fresh = Store.item(item.id);
      if (!fresh || !Store.isOwner) { s.close(); return; }
      if (isWaste) {
        const reason = reasonInp.value.trim();
        if (!reason) {
          helpEl.classList.remove('hidden');
          reasonInp.style.borderColor = 'var(--danger)';
          UI.haptic('warn');
          reasonInp.focus();
          return;
        }
        Store.logWaste(fresh.id, qty, reason);
        UI.haptic('warn');
        UI.toast(t('waste.logged', { qty: UI.fmtQty(qty), item: fresh.name }), { type: 'ok' });
      } else {
        Store.logRestock(fresh.id, qty);
        UI.haptic('success');
        UI.toast(t('restock.logged', { qty: UI.fmtQty(qty), item: fresh.name }), { type: 'ok' });
      }
      s.close();
    }

    c.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.a === 'minus') { if (qty > 1) { qty -= 1; UI.haptic('light'); sync(); } return; }
      if (b.dataset.a === 'plus') { if (qty < 999) { qty += 1; UI.haptic('light'); sync(); } return; }
      if (b.dataset.q) { qty = Number(b.dataset.q); UI.haptic('light'); sync(); return; }
      if (b.dataset.a === 'ok') confirm();
    });
    if (reasonInp) {
      reasonInp.addEventListener('input', () => {
        if (reasonInp.value.trim()) { helpEl.classList.add('hidden'); reasonInp.style.borderColor = ''; }
        sync();
      });
      reasonInp.addEventListener('keydown', e => { if (e.key === 'Enter') confirm(); });
    }
  }

  /* ---- shared screen renderer ---- */
  function renderScreen(mode, el) {
    if (!Store.isOwner) { UI.go(Store.state.session ? 'sell' : 'login'); return; }
    const st = ST[mode];
    const cats = Store.state.categories.slice().sort((a, b) => a.sort - b.sort);
    el.innerHTML = `
      <header class="apphead">
        <button type="button" class="iconbtn" data-a="back" aria-label="${UI.esc(t('g.back'))}">${UI.icon('chevL')}</button>
        <div class="apphead__titles">
          <h1 class="apphead__title">${UI.esc(t(mode + '.title'))}</h1>
          <div class="apphead__sub">${UI.esc(t(mode + '.hint'))}</div>
        </div>
      </header>
      <div class="search">
        ${UI.icon('search')}
        <input type="text" data-el="q" placeholder="${UI.esc(t('g.search'))}" value="${UI.esc(st.q)}" autocomplete="off" enterkeyhint="search" aria-label="${UI.esc(t('g.search'))}">
        <button type="button" class="iconbtn iconbtn--plain search__clear ${st.q ? '' : 'hidden'}" data-a="clear" aria-label="${UI.esc(t('rw.clear'))}">${UI.icon('x')}</button>
      </div>
      <div class="chips" data-el="chips">
        <button type="button" class="chip ${st.cat === 'all' ? 'is-on' : ''}" data-cat="all">${UI.esc(t('g.all'))}</button>
        ${cats.map(cat => `<button type="button" class="chip ${st.cat === cat.id ? 'is-on' : ''}" data-cat="${cat.id}">
          <span class="dot" style="--c:${cat.color}"></span>${UI.esc(Store.catName(cat))}</button>`).join('')}
      </div>
      <div data-el="gridwrap" class="mt2">${gridSection(mode)}</div>
      ${todayCardHtml(mode)}
    `;
    const qInp = el.querySelector('[data-el=q]');
    const clearBtn = el.querySelector('[data-a=clear]');
    const gridwrap = el.querySelector('[data-el=gridwrap]');
    const chipsEl = el.querySelector('[data-el=chips]');

    const updateGrid = () => { gridwrap.innerHTML = gridSection(mode); };

    qInp.addEventListener('input', () => {
      st.q = qInp.value;
      clearBtn.classList.toggle('hidden', !st.q);
      updateGrid();
    });
    qInp.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const list = filtered(mode);
        if (list.length === 1) openQtySheet(mode, list[0].id);
      }
    });
    clearBtn.addEventListener('click', () => {
      st.q = '';
      qInp.value = '';
      clearBtn.classList.add('hidden');
      updateGrid();
      qInp.focus();
    });
    chipsEl.addEventListener('click', e => {
      const b = e.target.closest('[data-cat]');
      if (!b) return;
      st.cat = b.dataset.cat;
      UI.haptic('light');
      chipsEl.querySelectorAll('.chip').forEach(ch => ch.classList.toggle('is-on', ch.dataset.cat === st.cat));
      updateGrid();
    });
    el.addEventListener('click', e => {
      if (e.target.closest('[data-a=back]')) { UI.haptic('light'); UI.go('more'); return; }
      const card = e.target.closest('[data-item]');
      if (card) openQtySheet(mode, card.dataset.item);
    });
  }

  UI.registerScreen({ id: 'restock', render(el) { renderScreen('restock', el); } });
  UI.registerScreen({ id: 'waste', render(el) { renderScreen('waste', el); } });
})();

/* == 26-screen-reports.js == */
/* ============ 26 — reports: history list, day report, CSV/PDF exports (owner only) ============ */
(() => {
  I18N.extend({
    fr: {
      'rep.openHint': 'Comptage en cours — clôturez-le pour générer le rapport.',
      'rep.sold_one': '{n} unité vendue', 'rep.sold_many': '{n} unités vendues',
