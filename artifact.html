/* == 01-tokens.css == */
/* ============ BarTally tokens — copied from reference.html :root (THE LAW) ============ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
:root{
  color-scheme:dark;
  /* reference tokens */
  --bg:#0A0B0F; --page:#050608; --surface:#12141A; --surface2:#191C24;
  --hair:rgba(255,255,255,.07); --hair2:rgba(255,255,255,.12);
  --t1:#F4F2ED; --t2:#9BA0AB; --t3:#5C6170;
  --brass:#E8B14E; --brassg:linear-gradient(135deg,#F0C468,#D89A2B); --onbrass:#1A1405;
  --ok:#34D399; --okbg:rgba(52,211,153,.12);
  --bad:#F0655A; --badbg:rgba(240,101,90,.12);
  --c-beer:#E8B14E; --c-red:#C0564F; --c-white:#D6C7A1; --c-rose:#D89AA0;
  --c-demi:#8FA3B8; --c-champ:#E5D5A8; --c-spirit:#7FB5A8; --c-food:#D08B5B;
  /* chart series (validated, dark band) — sequential brass for single-series */
  --series-1:#C98500; --series-2:#3987E5; --series-3:#D55181; --series-4:#9085E9;
  /* legacy aliases (screens reference these names; values are the reference tokens) */
  --ink:var(--bg);
  --surface-2:var(--surface2); --surface-3:#20242E; --glass:var(--surface2);
  --hairline:var(--hair); --hairline-strong:var(--hair2);
  --paper:var(--surface); --paper-2:var(--surface2); --on-paper:var(--t1);
  --gold:var(--brass); --gold-hi:#F0C468; --gold-deep:#D89A2B;
  --gold-grad:var(--brassg); --gold-soft:rgba(232,177,78,.12); --on-gold:var(--onbrass);
  --text:var(--t1); --text-2:var(--t2); --text-3:var(--t3);
  --danger:var(--bad); --danger-soft:var(--badbg);
  --warn:#E8B14E; --warn-soft:rgba(232,177,78,.12);
  --ok-soft:var(--okbg);
  --cat-biere:var(--c-beer); --cat-rouge:var(--c-red); --cat-blanc:var(--c-white);
  --cat-rose:var(--c-rose); --cat-demi:var(--c-demi); --cat-champ:var(--c-champ);
  --cat-spirit:var(--c-spirit); --cat-cuisine:var(--c-food);
  /* geometry — 4pt grid, 20px gutters; radius: 10 controls, 12 tiles, 22 sheets */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px; --s12:48px;
  --r-ctl:10px; --r-tile:12px; --r-sheet:22px;
  --r-card:12px; --r-el:10px; --r-pill:10px;
  --shadow-1:none; --shadow-2:none;
  --sheet-shadow:0 -18px 48px rgba(0,0,0,.45);
  --glow-gold:none;
  --f-display:'Space Grotesk',system-ui,sans-serif;
  --f-ui:'Inter',system-ui,-apple-system,sans-serif;
  --tap:48px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--t1);
  font-family:var(--f-ui);
  font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.num,.tnum{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
.sg{font-family:var(--f-display)}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.eyebrow,.micro{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
a{color:var(--brass);text-decoration:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
::selection{background:rgba(232,177,78,.3)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* == 02-components.css == */
/* ============ BarTally components — reference.html anatomy. De-boxed: hairlines + whitespace, no cards-in-cards, no shadows outside sheets. ============ */

/* ---- app shell ---- */
#app{position:relative;z-index:1;max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;padding:calc(var(--sat) + 20px) 20px calc(var(--sab) + 96px)}
.screen--bare{padding-bottom:calc(var(--sab) + 24px)}
.apphead{display:flex;align-items:center;gap:12px;margin-bottom:8px;min-height:26px}
.apphead__titles{flex:1;min-width:0}
.apphead__title{font:600 24px/1.2 var(--f-display);letter-spacing:-.01em}
.apphead__sub{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-top:4px}
.back{font-size:13px;font-weight:500;color:var(--t3);display:inline-flex;align-items:center;gap:2px}

/* ---- text-only tab bar (reference) ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;height:calc(58px + var(--sab));
  padding:0 0 var(--sab);background:var(--bg);border-top:1px solid var(--hair);max-width:520px;margin:0 auto}
@media (min-width:520px){.tabbar{left:50%;transform:translateX(-50%);width:520px}}
.tabbar__btn{flex:1;display:flex;align-items:center;justify-content:center;position:relative;
  font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--t3)}
.tabbar__btn.is-on{color:var(--brass)}
.tabbar__btn.is-on::before{content:'';position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--brassg)}
.tabbar__btn svg{display:none}
.tabbar__btn span{font-size:inherit;font-weight:inherit;letter-spacing:inherit}

/* ---- sections: hairline blocks, never boxes ---- */
.card{background:none;border:0;border-radius:0;padding:16px 0 18px;box-shadow:none}
.card+.card{margin-top:0;border-top:1px solid var(--hair)}

.card__head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:12px}
.card__title{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);font-family:var(--f-ui)}
.sec{margin-top:22px;display:flex;justify-content:space-between;align-items:baseline}

/* ---- stat columns (reference .stats) ---- */
.stats{display:flex;grid-template-columns:none;gap:0;margin-top:12px;padding:18px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.stat{flex:1;min-width:0;background:none;border:0;border-radius:0;padding:0}
.stat + .stat{border-left:1px solid var(--hair);padding-left:18px}
.stat:first-child{padding-right:18px}
.stat__v{font:600 28px/1 var(--f-display);letter-spacing:-.01em;margin-top:10px;font-variant-numeric:tabular-nums}
.big{font:600 34px/1 var(--f-display);letter-spacing:-.01em;margin-top:10px;font-variant-numeric:tabular-nums}
.mid{font:600 24px/1 var(--f-display);margin-top:8px;font-variant-numeric:tabular-nums}
.stat__l{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-top:6px}
.stat__d{font-size:12px;margin-top:8px;font-weight:600}
.sub2{font-size:12px;color:var(--t3);margin-top:10px}
.up,.good{color:var(--ok)}.down,.bad{color:var(--bad)}.faint{color:var(--t3)}
.chipstat{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 7px;border-radius:6px;margin-top:10px}
.chipstat.ok{color:var(--ok);background:var(--okbg)}
.chipstat.bad{color:var(--bad);background:var(--badbg)}

/* ---- buttons: text only ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;min-height:52px;
  padding:0 18px;border-radius:var(--r-ctl);font-size:14px;font-weight:600;transition:opacity .12s,transform .12s;user-select:none}
.btn:active{transform:scale(.98)}
.btn svg{display:none}
.btn--gold{background:var(--brassg);color:var(--onbrass)}
.btn--ghost{background:var(--surface2);border:1px solid var(--hair);color:var(--t1)}
.btn--danger{background:var(--badbg);color:var(--bad)}
.btn--line{background:none;border:0;color:var(--t2);font-weight:500;font-size:13px;height:auto;min-height:40px}
.btn--full{width:100%}
.btn--big{height:52px;font-size:14px;border-radius:var(--r-ctl)}
.btn[disabled]{opacity:.4;pointer-events:none}
.textbtn{text-align:center;padding:10px;font-size:13px;font-weight:500;color:var(--t2)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--r-ctl);
  background:none;border:1px solid var(--hair);color:var(--t2);transition:background .15s}
.iconbtn svg{width:18px;height:18px}
.iconbtn:active{background:var(--surface)}
.iconbtn--plain{border:0}

/* ---- filter pills (reference .pill) ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-ms-overflow-style:none;margin-top:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-ctl);
  background:var(--surface2);border:1px solid var(--hair);color:var(--t2);font-size:12px;font-weight:500;transition:all .16s}
.chip .dot{width:5px;height:5px;border-radius:50%;background:var(--brass);display:none}
.chip.is-on{color:var(--t1);border-color:rgba(232,177,78,.45);background:var(--surface2)}
.chip.is-on .dot{display:block}
.seg{display:flex;background:var(--surface2);border:1px solid var(--hair);border-radius:var(--r-ctl);padding:3px;gap:2px}
.seg__btn{flex:1;min-height:34px;border-radius:8px;font-size:12px;font-weight:600;color:var(--t3);transition:all .16s}
.seg__btn.is-on{background:var(--surface);color:var(--t1)}

/* ---- search ---- */
.search{position:relative;margin-top:16px;margin-bottom:0}
.search input{width:100%;height:44px;padding:0 14px 0 38px;border-radius:var(--r-ctl);border:1px solid var(--hair);
  background:var(--surface2);color:var(--t1);font-size:14px}
.search input::placeholder{color:var(--t3)}
.search input:focus{border-color:rgba(232,177,78,.45)}
.search>svg{position:absolute;left:12px;top:13px;width:18px;height:18px;color:var(--t3);pointer-events:none}
.search .search__clear{position:absolute;right:2px;top:2px;width:40px;height:40px;border:0}

/* ---- monogram tiles (reference anatomy) ---- */
.tile{background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-tile);
  position:relative;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.tick{position:absolute;top:8px;left:8px;width:3px;height:14px;border-radius:2px;z-index:2}
.mono{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;font-size:15px;z-index:1}
.mono--half{position:absolute;top:7px;right:8px;font:600 10px var(--f-display);color:var(--t3);letter-spacing:0}
.tqty{position:absolute;right:8px;bottom:6px;font:600 11px var(--f-display);color:var(--t3);font-variant-numeric:tabular-nums;z-index:2}
.t64{width:64px;height:64px} .t56{width:56px;height:56px} .t40{width:40px;height:40px}
.t40 .tick{display:none}
.t40 .mono{font-size:12px}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,11,15,0) 45%,rgba(10,11,15,.85));z-index:1}
.tilecol{width:64px;display:flex;flex-direction:column;align-items:center;gap:6px}
.tilecap{font-size:11px;color:var(--t2);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lowqty{font:600 12px var(--f-display);color:var(--bad);font-variant-numeric:tabular-nums}
.tilerow{display:flex;gap:14px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.tilerow::-webkit-scrollbar{display:none}

/* ---- item grid (reference .grid/.gcell/.gtile) ---- */
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.icard{background:none;border:0;border-radius:0;aspect-ratio:auto;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;
  transition:transform .12s;content-visibility:auto;contain-intrinsic-size:140px}
.icard:active{transform:scale(.96)}
.icard__art{position:relative;width:100%;aspect-ratio:1/1;background:var(--surface);border:1px solid var(--hair);border-radius:var(--r-tile);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.icard__art .itemart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.icard__art .mono{font-size:17px}
.icard__name{font-size:11px;color:var(--t2);font-weight:400;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0;line-height:1.3}
.icard__meta{font-size:11px;color:var(--t3);padding:0;font-variant-numeric:tabular-nums}
.icard__badge{position:absolute;z-index:3;top:6px;right:6px}

/* ---- rows (feeds, lists, tables) ---- */
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:0;border-bottom:1px solid var(--hair);background:none}
.row:last-child{border-bottom:0}
.row__art{width:40px;height:40px;border-radius:var(--r-tile);overflow:hidden;flex:none;background:var(--surface);border:1px solid var(--hair);position:relative;display:flex;align-items:center;justify-content:center}
.row__art .itemart{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.row__art .mono{font-size:12px}
.row__art img{width:100%;height:100%;object-fit:cover}
.row__body{flex:1;min-width:0;display:block}
.row__t{display:block;font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1)}
.row__s{display:block;color:var(--t3);font-size:11px;margin-top:2px}
.row__end{text-align:right;flex:none}

.feed{display:flex;flex-direction:column}

.thead{display:grid;grid-template-columns:1fr 54px 54px 54px;height:34px;align-items:center;

.r{text-align:right;font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* ---- badges ---- */
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600}

.sheet-wrap{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}

.sheet{position:relative;width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;background:var(--surface2);
  border:1px solid var(--hair2);border-bottom:0;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:10px 20px calc(var(--sab) + 24px);

.sheet__grip{width:36px;height:4px;border-radius:2px;background:var(--hair2);margin:0 auto 18px}
.sheet.is-closing{animation:sheet-down .2s ease-in forwards}
.sheet-wrap__bg.is-closing{animation:fade-out .2s forwards}
@keyframes sheet-up{from{transform:translateY(48px);opacity:.5}to{transform:none;opacity:1}}
@keyframes sheet-down{to{transform:translateY(100%);opacity:0}}
@keyframes fade-in{from{opacity:0}}
@keyframes fade-out{to{opacity:0}}
.sheetrow{display:flex;align-items:center;gap:12px}
.sheetname{font-size:16px;font-weight:600}
.sheetsub{font-size:12px;color:var(--t3);margin-top:3px}

/* ---- toast ---- */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 74px);z-index:80;display:flex;flex-direction:column;gap:8px;width:min(92vw,440px)}
.toast{display:flex;align-items:center;gap:12px;background:var(--surface2);
  border:1px solid var(--hair2);border-radius:var(--r-ctl);padding:12px 14px;animation:toast-in .22s ease-out}
.toast--ok{border-left:2px solid var(--ok)}
.toast--danger{border-left:2px solid var(--bad)}
.toast__msg{flex:1;font-size:13px;font-weight:500}
.toast__act{color:var(--brass);font-weight:600;font-size:13px;padding:6px 10px;flex:none}

.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

.numpad button:active{background:var(--surface2);transform:scale(.97)}

.pinDots{display:flex;gap:14px;justify-content:center;margin:16px 0}

/* ============ BarTally store — state, engine, seed, audit. No DOM, no i18n here. ============ */

/* ---------- pure engine (also exercised by node tests) ---------- */
const Engine = {
  pad(n) { return String(n).padStart(2, '0'); },
  /** business date 'YYYY-MM-DD' for a JS Date, given cutoff hour (sales at 01:30 belong to previous evening) */
  bdOf(date, cutoffHour) {
    const d = new Date(date.getTime());
    if (d.getHours() < cutoffHour) d.setDate(d.getDate() - 1);
    return `${d.getFullYear()}-${this.pad(d.getMonth() + 1)}-${this.pad(d.getDate())}`;
  },
  addDays(bd, n) {
    const [y, m, d] = bd.split('-').map(Number);
    const dt = new Date(y, m - 1, d + n);
    return `${dt.getFullYear()}-${this.pad(dt.getMonth() + 1)}-${this.pad(dt.getDate())}`;
  },
  /** latest CLOSED count with bd matching cmp relative to targetBd */
  baselineCount(counts, targetBd, { strictlyBefore = false } = {}) {
    let best = null;
    for (const c of counts) {
      if (c.status !== 'closed') continue;
      if (strictlyBefore ? c.bd >= targetBd : c.bd > targetBd) continue;
      if (!best || c.bd > best.bd) best = c;
    }
    return best;
  },
  sumSince(entries, itemId, base, targetBd, { skipVoided = true, cutIso = null } = {}) {
    // cutIso: the moment this item was physically counted (per-line); falls back
    // to the count's closedAt. Entries after that moment are "since the count".
    let s = 0;
    const cut = cutIso || base?.closedAt || null;
    for (const e of entries) {
      if (e.itemId !== itemId) continue;
      if (skipVoided && e.voidedAt) continue;
      if (targetBd && e.bd > targetBd) continue;
      if (base) {
        if (e.bd < base.bd) continue;
        if (e.bd === base.bd && !(cut && e.at > cut)) continue;
      }
      s += e.qty;
    }
    return Math.round(s * 100) / 100;
  },
  /**
   * expected(item, targetBd) = counted at baseline + restocks − sales − waste since baseline, up to targetBd inclusive.
   * strictlyBefore=true → baseline is the previous day's count (used DURING a count of targetBd).
   */
  expected(state, itemId, targetBd, { strictlyBefore = false } = {}) {
    const base = this.baselineCount(state.counts, targetBd, { strictlyBefore });
    let start = 0, cutIso = null;
    if (base) {
      const line = base.lines.find(l => l.itemId === itemId);
      if (line) { start = line.counted; cutIso = line.at || null; }
      else start = 0; // item added after that count → entries since still apply
    }
    const r = this.sumSince(state.restocks, itemId, base, targetBd, { skipVoided: false, cutIso });
    const s = this.sumSince(state.sales, itemId, base, targetBd, { cutIso });
    const w = this.sumSince(state.waste, itemId, base, targetBd, { skipVoided: false, cutIso });
    return Math.round((start + r - s - w) * 100) / 100;
  },
  /** sales velocity: avg non-void units/day over the last `days` FULL business days
   *  (today's partial day excluded); young bars divide by days actually traded */
  velocity(state, itemId, todayBd, days = 14) {
    const to = this.addDays(todayBd, -1);
    const from = this.addDays(to, -days);
    let s = 0;
    for (const e of state.sales) {
      if (e.itemId !== itemId || e.voidedAt) continue;
      if (e.bd > to || e.bd <= from) continue;
      s += e.qty;
    }
    let firstBd = null;
    for (const c of (state.counts || [])) if (c.status === 'closed' && (!firstBd || c.bd < firstBd)) firstBd = c.bd;
    let eff = days;
    if (firstBd) {
      const span = Math.round((new Date(to + 'T12:00') - new Date(firstBd + 'T12:00')) / 864e5);
      eff = Math.max(1, Math.min(days, span));
    }
    return s / eff;
  },
  daysUntilStockout(stock, vel) { return vel > 0.01 ? Math.floor(stock / vel) : null; },
  /** cumulative unexplained loss series from closed counts (negative variances only, flipped positive) */
  shrinkageSeries(state) {
    const closed = state.counts.filter(c => c.status === 'closed').sort((a, b) => a.bd < b.bd ? -1 : 1);
    let cum = 0;
    return closed.filter(c => !c.isOpening).map(c => {
      let day = 0;
      for (const l of c.lines) if (l.variance < 0) day += -l.variance;
      cum = Math.round((cum + day) * 100) / 100;
      return { bd: c.bd, day: Math.round(day * 100) / 100, cum };
    });
  },
};

/* ---------- id/hash utils ---------- */
let _uidc = 0;
function uid() { return Date.now().toString(36) + (_uidc++).toString(36) + Math.random().toString(36).slice(2, 6); }
async function hashPin(pin, salt) {
  const data = new TextEncoder().encode(salt + '|' + pin);
  const h = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(h)].map(b => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- store ---------- */
const Store = (() => {
  const KEY = 'bartally.v1';
  const LS = (typeof localStorage !== 'undefined') ? localStorage : { getItem: () => null, setItem: () => {}, removeItem: () => {} };
  const listeners = new Set();
  let saveTimer = null;

  function blank() {
    return {
      v: 1,
      settings: {
        barName: '', logo: null, lang: 'fr', cutoffHour: 6,
        varThreshold: 2, currency: 'MAD', requireStaffPin: false,
        ownerPinHash: null, ownerPinSalt: null, ownerName: '',
        setupDone: false, demoMode: false, notifGranted: false,
      },
      categories: [], items: [], employees: [],
      sales: [], restocks: [], waste: [], counts: [],
      audit: [], notifs: [], recents: [],
      session: null,
    };
  }

  let state = blank();
  try {
    const raw = LS.getItem(KEY);
    if (raw) {
      const p = JSON.parse(raw);
      if (p && p.v === 1) {
        state = Object.assign(blank(), p, { settings: Object.assign(blank().settings, p.settings) });
        // migrations: category accents follow the current design tokens; monograms backfill
        for (const c of state.categories) {
          const s = SEED.categories.find(x => x.id === c.id);
          if (s) { c.hex = s.hex; c.color = s.color; }
        }
        const seedByName = new Map(SEED.items.map(([, name, , , , mono]) => [name, mono]));
        for (const it of state.items) {
          if (!it.mono && seedByName.has(it.name)) it.mono = seedByName.get(it.name);
          if (it.isDemi === undefined) it.isDemi = String(it.name || '').startsWith('1/2 ');
        }
      }
    }
  } catch (e) { console.error('load failed', e); }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { LS.setItem(KEY, JSON.stringify(state)); }
      catch (e) { console.error('save failed', e); }
    }, 120);
  }
  function emit(what) { save(); for (const fn of listeners) fn(what); }

  const S = {
    Engine, SEED,
    get state() { return state; },
    on(fn) { listeners.add(fn); return () => listeners.delete(fn); },

    /* ---- session & auth ---- */
    get me() { return state.session ? (state.session.role === 'owner' ? { id: 'owner', name: state.settings.ownerName || 'Patron', role: 'owner' } : state.employees.find(e => e.id === state.session.userId)) : null; },
    get isOwner() { return state.session?.role === 'owner'; },
    async loginOwner(pin) {
      const ok = state.settings.ownerPinHash === await hashPin(pin, state.settings.ownerPinSalt);
      if (ok) { state.session = { userId: 'owner', role: 'owner' }; emit('session'); }
      return ok;
    },
    async loginEmployee(empId, pin) {
      const emp = state.employees.find(e => e.id === empId && e.active);
      if (!emp) return false;
      if (state.settings.requireStaffPin && emp.pinHash) {
        if (emp.pinHash !== await hashPin(pin, emp.pinSalt)) return false;
      }
      state.session = { userId: empId, role: 'employee' }; emit('session');
      return true;
    },
    logout() { state.session = null; emit('session'); },

    /* ---- helpers ---- */
    todayBd() { return Engine.bdOf(new Date(), state.settings.cutoffHour); },
    item(id) { return state.items.find(i => i.id === id); },
    cat(id) { return state.categories.find(c => c.id === id); },
    catName(c) { return state.settings.lang === 'en' ? c.nameEn : c.nameFr; },
    stock(itemId) { return Engine.expected(state, itemId, this.todayBd()); },
    activeItems() { return state.items.filter(i => i.active).sort((a, b) => a.sort - b.sort); },
    isLow(itemId) { const it = this.item(itemId); return it && this.stock(itemId) <= it.threshold; },
    lowItems() { return this.activeItems().filter(i => this.stock(i.id) <= i.threshold); },

    audit(action, entity, entityId, before, after) {
      state.audit.unshift({ at: new Date().toISOString(), actor: this.me?.name || 'system', action, entity, entityId, before: before ?? null, after: after ?? null });
      if (state.audit.length > 600) state.audit.length = 600;
    },
    notify(type, payload) {
      const bd = this.todayBd();
      if (type === 'low' && state.notifs.some(n => n.type === 'low' && n.bd === bd && n.payload.itemId === payload.itemId)) return; // debounce: 1/item/day
      state.notifs.unshift({ id: uid(), type, at: new Date().toISOString(), bd, read: false, payload });
      if (state.notifs.length > 120) state.notifs.length = 120;
      if (typeof Notification !== 'undefined' && Notification.permission === 'granted' && typeof window !== 'undefined' && window.__notifText) {
        try { new Notification(state.settings.barName || 'BarTally', { body: window.__notifText(type, payload), tag: type + (payload.itemId || '') }); } catch (e) {}
      }
    },
    checkLow(itemId) {
      const it = this.item(itemId);
      if (it && it.active && this.stock(itemId) <= it.threshold) this.notify('low', { itemId, qty: this.stock(itemId), unit: it.unit });
    },

    /* ---- staff + owner actions ---- */
    logSale(itemId, qty) {
      if (!state.session) return null;
      const e = { id: uid(), itemId, qty, bd: this.todayBd(), at: new Date().toISOString(), by: this.me.name, byId: state.session.userId, voidedAt: null, voidedBy: null };
      state.sales.unshift(e);
      state.recents = [itemId, ...state.recents.filter(r => r !== itemId)].slice(0, 8);
      this.checkLow(itemId);
      emit('sales');
      return e;
    },
    /** staff undo: only own entry, only within grace window (UI enforces 6s); recorded as void */
    undoSale(saleId) {
      const e = state.sales.find(s => s.id === saleId);
      if (!e || e.voidedAt) return false;
      if (!this.isOwner && e.byId !== state.session?.userId) return false;
      e.voidedAt = new Date().toISOString(); e.voidedBy = this.me.name;
      this.audit('void_sale', 'sale', saleId, { qty: e.qty, itemId: e.itemId }, null);
      emit('sales');
      return true;
    },
    voidSale(saleId) {
      if (!this.isOwner) return false;
      return this.undoSale(saleId);
    },
    logRestock(itemId, qty) {
      if (!this.isOwner) return null;
      const e = { id: uid(), itemId, qty, bd: this.todayBd(), at: new Date().toISOString(), by: this.me.name };
      state.restocks.unshift(e);
      this.audit('restock', 'restock', e.id, null, { itemId, qty });
      emit('restocks');
      return e;
    },
    logWaste(itemId, qty, reason) {
      if (!this.isOwner) return null;
      const e = { id: uid(), itemId, qty, reason: reason || '', bd: this.todayBd(), at: new Date().toISOString(), by: this.me.name };
      state.waste.unshift(e);
      this.audit('waste', 'waste', e.id, null, { itemId, qty, reason });
      this.checkLow(itemId);
      emit('waste');
      return e;
    },

    /* ---- counts ---- */
    openCount() {
      if (!this.isOwner) return null;
      let c = state.counts.find(c => c.status === 'open');
      if (c) return c;
      const bd = this.todayBd();
      c = { id: uid(), bd, status: 'open', startedAt: new Date().toISOString(), closedAt: null, closedBy: null, lines: [] };
      state.counts.push(c);
      emit('counts');
      return c;
    },
    countExpected(itemId, bd) { return Engine.expected(state, itemId, bd, { strictlyBefore: true }); },
    setCountLine(countId, itemId, counted, note) {
      const c = state.counts.find(x => x.id === countId);
      if (!c || c.status !== 'open' || !this.isOwner) return;
      const expected = this.countExpected(itemId, c.bd);
      const variance = Math.round((counted - expected) * 100) / 100;
      const i = c.lines.findIndex(l => l.itemId === itemId);
      // per-line timestamp: sales logged after this moment count against the NEXT day
      const line = { itemId, expected, counted, variance, at: new Date().toISOString(), note: note ?? (i >= 0 ? c.lines[i].note : '') };
      if (i >= 0) c.lines[i] = line; else c.lines.push(line);
      emit('counts');
    },
    setCountNote(countId, itemId, note) {
      const c = state.counts.find(x => x.id === countId);
      if (!c || c.status !== 'open' || !this.isOwner) return;
      const l = c.lines.find(l => l.itemId === itemId);
      if (l) { l.note = note; emit('counts'); }
    },
    closeCount(countId) {
      const c = state.counts.find(x => x.id === countId);
      if (!c || c.status !== 'open' || !this.isOwner) return null;
      // uncounted items (incl. inactive — they keep their baseline) hold expected value
      for (const it of state.items) {
        if (!c.lines.some(l => l.itemId === it.id)) {
          const expected = this.countExpected(it.id, c.bd);
          c.lines.push({ itemId: it.id, expected, counted: expected, variance: 0, at: new Date().toISOString(), note: '', autofilled: true });
        }
      }
      c.status = 'closed'; c.closedAt = new Date().toISOString(); c.closedBy = this.me.name;
      this.audit('close_count', 'count', c.id, null, { bd: c.bd, lines: c.lines.length });
      const issues = c.lines.filter(l => Math.abs(l.variance) >= state.settings.varThreshold || l.variance !== 0);
      const big = c.lines.filter(l => Math.abs(l.variance) >= state.settings.varThreshold);
      if (issues.length) {
        const top = [...issues].sort((a, b) => Math.abs(b.variance) - Math.abs(a.variance))[0];
        const it = this.item(top.itemId);
        this.notify('variance', { n: issues.length, big: big.length, top: `${it?.name} ${top.variance > 0 ? '+' : ''}${top.variance}` });
      }
      for (const it of this.activeItems()) this.checkLow(it.id);
      emit('counts');
      return c;
    },
    reopenCount(countId) {
      const c = state.counts.find(x => x.id === countId);
      if (!c || c.status !== 'closed' || !this.isOwner || c.isOpening) return false;
      c.status = 'open'; this.audit('reopen_count', 'count', c.id, { closedAt: c.closedAt }, null);
      c.closedAt = null; c.closedBy = null;
      emit('counts');
      return true;
    },
    closedCounts() { return state.counts.filter(c => c.status === 'closed' && !c.isOpening).sort((a, b) => a.bd < b.bd ? 1 : -1); },

    /* ---- items & categories (owner) ---- */
    saveItem(data) {
      if (!this.isOwner) return null;
      if (data.id) {
        const it = this.item(data.id); const before = { ...it };
        Object.assign(it, data);
        this.audit('edit_item', 'item', it.id, { name: before.name, threshold: before.threshold, cost: before.cost }, { name: it.name, threshold: it.threshold, cost: it.cost });
        emit('items'); return it;
      }
      const mono = data.mono || (() => {
        const clean = String(data.name || '').replace(/^1\/2\s+/, '').trim();
        const words = clean.split(/\s+/).filter(w => /[A-Za-zÀ-ÿ]/.test(w));
        if (words.length >= 2) return (words[0][0] + '.' + words[1][0]).toUpperCase();
        return clean.replace(/[^A-Za-zÀ-ÿ]/g, '').slice(0, 3).toUpperCase();
      })();
      const it = { id: uid(), catId: data.catId, name: data.name, unit: data.unit || 'bouteille', allowDecimal: !!data.allowDecimal, threshold: data.threshold ?? 6, mono, isDemi: String(data.name || '').startsWith('1/2 '), photo: data.photo || null, barcode: data.barcode || null, pinned: !!data.pinned, cost: data.cost ?? null, active: true, sort: state.items.length };
      state.items.push(it);
      this.audit('add_item', 'item', it.id, null, { name: it.name });
      emit('items'); return it;
    },
    findByBarcode(code) { return state.items.find(i => i.barcode === code && i.active); },

    /* ---- employees (owner) ---- */
    async addEmployee(name, pin) {
      if (!this.isOwner) return null;
      const emp = { id: uid(), name, active: true, pinHash: null, pinSalt: null };
      if (pin) { emp.pinSalt = uid(); emp.pinHash = await hashPin(pin, emp.pinSalt); }
      state.employees.push(emp);
      this.audit('add_employee', 'employee', emp.id, null, { name });
      emit('employees'); return emp;
    },
    async setEmployeePin(empId, pin) {
      if (!this.isOwner) return;
      const emp = state.employees.find(e => e.id === empId);
      if (!emp) return;
      emp.pinSalt = uid(); emp.pinHash = await hashPin(pin, emp.pinSalt);
      this.audit('reset_pin', 'employee', empId, null, null);
      emit('employees');
    },
    setEmployeeActive(empId, active) {
      if (!this.isOwner) return;
      const emp = state.employees.find(e => e.id === empId);
      if (emp) { emp.active = active; this.audit(active ? 'reactivate_employee' : 'deactivate_employee', 'employee', empId, null, null); emit('employees'); }
    },
    async setOwnerPin(pin) {
      if (state.settings.setupDone && !this.isOwner) return;
      state.settings.ownerPinSalt = uid();
      state.settings.ownerPinHash = await hashPin(pin, state.settings.ownerPinSalt);
      this.audit('change_owner_pin', 'settings', 'owner', null, null);
      emit('settings');
    },

    /* ---- settings & data ---- */
    setSettings(patch) {
      // employees may not touch settings; pre-login (no session) only affects
      // device-level prefs like language, which is fine
      if (state.settings.setupDone && state.session && state.session.role !== 'owner') return;
      const before = { ...state.settings };
      Object.assign(state.settings, patch);
      if (state.session?.role === 'owner' || !state.settings.setupDone) this.audit('settings', 'settings', 'app', null, Object.keys(patch).join(','));
      if (patch.lang) I18N.lang = patch.lang;
      emit('settings');
    },
    markNotifsRead() { for (const n of state.notifs) n.read = true; emit('notifs'); },
    exportJSON() { return JSON.stringify(state, null, 1); },
    importJSON(json) {
      if (state.settings.setupDone && state.session && state.session.role !== 'owner') throw new Error('owner only');
      const p = JSON.parse(json);
      if (!p || p.v !== 1 || !Array.isArray(p.items)) throw new Error('bad backup');
      state = Object.assign(blank(), p, { settings: Object.assign(blank().settings, p.settings) });
      state.session = null;
      I18N.lang = state.settings.lang || 'fr';
      emit('all');
    },
    resetAll() {
      if (state.settings.setupDone && state.session && state.session.role !== 'owner') return;
      const lang = state.settings.lang;
      state = blank(); state.settings.lang = lang;
      I18N.lang = lang || 'fr';
      LS.removeItem(KEY); emit('all');
    },

    /* ---- setup ---- */
    async setupReal({ barName, ownerName, pin, employees, opening }) {
      state = blank();
      state.categories = JSON.parse(JSON.stringify(SEED.categories));
      state.items = SEED.build();
      state.settings.barName = barName; state.settings.ownerName = ownerName || 'Patron';
      await this.setOwnerPin(pin);
      for (const name of employees) await this.addEmployeeRaw(name);
      // opening stock = closed baseline count dated yesterday-bd so today's entries apply on top
      const bd = Engine.addDays(this.todayBd(), -1);
      const c = { id: uid(), bd, status: 'closed', isOpening: true, startedAt: new Date().toISOString(), closedAt: new Date().toISOString(), closedBy: ownerName || 'Patron', lines: [] };
      for (const it of state.items) {
        const raw = opening[it.id];
        const q = raw ?? 0;
        if (raw === undefined) it.active = false; // untouched in the wizard = "we don't serve this"; reactivable in Stock
        c.lines.push({ itemId: it.id, expected: q, counted: q, variance: 0, note: '' });
      }
      state.counts.push(c);
      state.settings.setupDone = true; state.settings.demoMode = false;
      state.session = { userId: 'owner', role: 'owner' };
      this.audit('setup', 'settings', 'app', null, { items: state.items.length });
      emit('all');
    },
    async addEmployeeRaw(name) {
      const emp = { id: uid(), name, active: true, pinHash: null, pinSalt: null };
      state.employees.push(emp); return emp;
    },
    async setupDemo() {
      state = blank();
      state.categories = JSON.parse(JSON.stringify(SEED.categories));
      state.items = SEED.build();
      state.settings.barName = 'Le Comptoir'; state.settings.ownerName = 'Karim';
      state.settings.demoMode = true;
      await this.setOwnerPin('1234'); // before setupDone flips, so the owner-guard lets setup through
      state.settings.setupDone = true;
      const y = await this.addEmployeeRaw('Yassine');
      const s = await this.addEmployeeRaw('Sarah');
      seedDemoHistory(state, [y, s]);
      state.session = { userId: 'owner', role: 'owner' };
      emit('all');
    },
  };

  /* deterministic demo history: 14 closed days + today's open activity */
  function seedDemoHistory(st, emps) {
    let rs = 42;
    const rnd = () => (rs = (rs * 1103515245 + 12345) % 2147483648) / 2147483648;
    const today = S.todayBd();
    const start = Engine.addDays(today, -14);
    const stockNow = {}; // running physical stock
    const popular = { Heineken: 26, 'Spécial': 30, Casablanca: 18, 'Spécial Gold': 10, Budweiser: 8, 'Smirnoff Ice': 6, 'Red Bull': 14, Soda: 12, 'Black Label': 7, 'Red Label': 5, Absolut: 4, "Jack Daniel's": 4, Ricard: 6, 'Jägermeister': 3, "Gordon's" : 3, Belvedere: 2, Agavita: 2, Cognac: 1.5, 'Martini Blanc': 2, Champagne: 0.4, Fromage: 5, 'Viande Hachée': 4, Foie: 3, Cervelle: 2, 'Pizza V/H': 6 };
    for (const it of st.items) {
      const base = it.catId === 'biere' ? 90 : it.catId === 'spirit' ? 6 : it.catId === 'cuisine' ? 25 : it.catId === 'champ' ? 5 : 14;
      stockNow[it.id] = base;
    }
    // opening baseline
    st.counts.push({ id: uid(), bd: Engine.addDays(start, -1), status: 'closed', isOpening: true, startedAt: '', closedAt: new Date(Date.now() - 15 * 864e5).toISOString(), closedBy: 'Karim', lines: st.items.map(it => ({ itemId: it.id, expected: stockNow[it.id], counted: stockNow[it.id], variance: 0, note: '' })) });
    const mkAt = (bd, h, m) => { const [Y, M, D] = bd.split('-').map(Number); const d = new Date(Y, M - 1, D, h, m); if (h < 6) d.setDate(d.getDate() + 1); return d.toISOString(); };
    for (let d = 0; d < 14; d++) {
      const bd = Engine.addDays(start, d);
      const dow = new Date(bd + 'T12:00').getDay();
      const busy = (dow === 5 || dow === 6) ? 1.5 : dow === 0 ? 1.15 : 1;
      // sales
      for (const it of st.items) {
        const p = popular[it.name] ?? (it.catId === 'rouge' ? 2.2 : it.catId === 'blanc' ? 1.4 : it.catId === 'rose' ? 1.2 : it.catId === 'demi' ? 0.9 : 1);
        let want = Math.round(p * busy * (0.6 + rnd() * 0.8) * 10) / 10;
        let n = it.allowDecimal ? Math.round(want) : Math.round(want);
        n = Math.min(n, Math.floor(stockNow[it.id] * 0.7));
        let logged = 0;
        while (logged < n) {
          const q = Math.min(n - logged, 1 + Math.floor(rnd() * 2));
          const emp = emps[Math.floor(rnd() * emps.length)];
          const hour = 18 + Math.floor(rnd() * 10); // 18h → 03h
          st.sales.push({ id: uid(), itemId: it.id, qty: q, bd, at: mkAt(bd, hour % 24, Math.floor(rnd() * 60)), by: emp.name, byId: emp.id, voidedAt: null, voidedBy: null });
          logged += q; stockNow[it.id] -= q;
        }
      }
      // deliveries: top-up model so shelves stay realistic; a few items deliberately
      // run low at the end (the low-stock story on the dashboard)
      const lowStory = ['Casablanca', 'Champagne', 'Ricard'];
      if (d === 4 || d === 9 || d === 12) {
        for (const it of st.items) {
          if (d === 12 && lowStory.includes(it.name)) continue;
          let q = 0;
          if (it.catId === 'biere' && stockNow[it.id] < 70) q = Math.ceil((110 - stockNow[it.id]) / 24) * 24;
          else if (it.catId === 'spirit' && stockNow[it.id] < 3.5) q = 6;
          else if (it.catId === 'cuisine' && stockNow[it.id] < 14) q = 20;
          else if ((it.catId === 'rouge' || it.catId === 'blanc' || it.catId === 'rose' || it.catId === 'demi') && stockNow[it.id] < it.threshold * 2) q = 12;
          else if (it.catId === 'champ' && stockNow[it.id] < 3) q = 4;
          if (q > 0) {
            st.restocks.push({ id: uid(), itemId: it.id, qty: q, bd, at: mkAt(bd, 16, Math.floor(rnd() * 50)), by: 'Karim' });
            stockNow[it.id] += q;
          }
        }
      }
      // one waste event
      if (d === 6) {
        const hei = st.items.find(i => i.name === 'Heineken');
        st.waste.push({ id: uid(), itemId: hei.id, qty: 2, reason: 'Casse — 2 bouteilles tombées', bd, at: mkAt(bd, 22, 40), by: 'Karim' });
        stockNow[hei.id] -= 2;
      }
      // shrink: unexplained losses on some days (the story the app catches)
      const shrinkPlan = { 3: [['Black Label', 0.5]], 7: [['Heineken', 2]], 10: [['Heineken', 3], ['Red Label', 0.5]], 12: [['Black Label', 1]], 13: [['Heineken', 2], ['Black Label', 0.5]] };
      for (const [nm, q] of (shrinkPlan[d] || [])) {
        const it = st.items.find(i => i.name === nm);
        stockNow[it.id] -= q; // vanished without a log entry → shows as negative variance
      }
      // close the day
      const lines = st.items.map(it => {
        const expected = Engine.expected(st, it.id, bd, { strictlyBefore: true });
        const counted = Math.round(stockNow[it.id] * 100) / 100;
        const v = Math.round((counted - expected) * 100) / 100;
        const notes = { Heineken: 'À surveiller — écart répété', 'Black Label': 'Vérifier le doseur' };
        return { itemId: it.id, expected, counted, variance: v, note: v < -1 ? (notes[it.name] || '') : '' };
      });
      st.counts.push({ id: uid(), bd, status: 'closed', startedAt: mkAt(bd, 4, 0), closedAt: mkAt(bd, 4, 30), closedBy: 'Karim', lines });
    }
    // today's open activity: a few live sales
    const liveSales = [['Heineken', 2, 'Yassine'], ['Spécial', 3, 'Sarah'], ['Red Bull', 1, 'Yassine'], ['Black Label', 1, 'Sarah'], ['Casablanca', 2, 'Yassine']];
    let mins = 0;
    for (const [nm, q, who] of liveSales) {
      const it = st.items.find(i => i.name === nm);
      if (stockNow[it.id] < q + 1) continue; // never oversell the demo shelves
      const emp = emps.find(e => e.name === who);
      st.sales.push({ id: uid(), itemId: it.id, qty: q, bd: today, at: new Date(Date.now() - (50 - mins) * 60000).toISOString(), by: emp.name, byId: emp.id, voidedAt: null, voidedBy: null });
      stockNow[it.id] -= q;
      mins += 10;
    }
    st.recents = liveSales.map(([nm]) => st.items.find(i => i.name === nm).id).reverse();
  }

  return S;
})();

      const s = sheet(c, { onClose: () => res(false) });

  /* ---------- numpad ---------- */
  function numpad(container, { decimal = false, onKey }) {
    const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', decimal ? (I18N.lang === 'fr' ? ',' : '.') : '', '0', '⌫'];
    const np = el(`<div class="numpad">${keys.map(k => k === '' ? '<span></span>' : `<button type="button" data-k="${k === ',' || k === '.' ? 'dot' : k === '⌫' ? 'del' : k}">${k}</button>`).join('')}</div>`);
    np.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      haptic('light'); onKey(b.dataset.k);
    });
    container.appendChild(np);
    return np;
  }

  /* ---------- progress ring ---------- */
  function ring(pct, label) {
    const r = 26, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, Math.max(0, pct)));
    return `<div class="ring"><svg viewBox="0 0 64 64" width="64" height="64">
      <defs><linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DFB86A"/><stop offset="1" stop-color="#A87B2F"/></linearGradient></defs>
      <circle class="ring__bg" cx="32" cy="32" r="${r}"/>
      <circle class="ring__fg" cx="32" cy="32" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg><div class="ring__t">${label ?? Math.round(pct * 100) + '%'}</div></div>`;
  }

  /* ---------- barcode scanning ---------- */
  const canScan = 'BarcodeDetector' in window && !!navigator.mediaDevices?.getUserMedia;
  async function scan({ onCode }) {
    const c = el(`<div><h2 style="font-size:18px;margin-bottom:12px">${esc(t('sell.scan'))}</h2>
      <div style="position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:3/4">
        <video autoplay playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
        <div style="position:absolute;inset:0;border:2px solid rgba(201,154,75,.6);border-radius:16px;margin:14%;pointer-events:none"></div>
      </div>
      <div class="field mt4"><label>${esc(t('inv.barcode'))}</label><input type="text" inputmode="numeric" placeholder="0000000000000"></div>
      <button class="btn btn--gold btn--full" data-a="manual">${esc(t('g.confirm'))}</button></div>`);
    const s = sheet(c, { onClose: stop });
    const video = c.querySelector('video');
    let stream = null, timer = null;
    function stop() { clearInterval(timer); stream?.getTracks().forEach(tk => tk.stop()); }
    c.querySelector('[data-a=manual]').addEventListener('click', () => {
      const v = c.querySelector('input').value.trim();
      if (v) { onCode(v); s.close(); }
    });
    if (canScan) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'qr_code'] });
        timer = setInterval(async () => {
          try {
            const codes = await det.detect(video);
            if (codes.length) { haptic('success'); onCode(codes[0].rawValue); stop(); s.close(); }
          } catch (e) {}
        }, 300);
      } catch (e) { video.parentElement.style.display = 'none'; }
    } else { video.parentElement.style.display = 'none'; }
    return s;
  }

  /* ---------- image pick + compress ---------- */
  function pickImage({ capture } = {}) {
    return new Promise(res => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/*';
      if (capture) inp.capture = 'environment';
      inp.addEventListener('change', () => {
        const f = inp.files[0]; if (!f) return res(null);
        const img = new Image();
        img.onload = () => {
          const max = 512, k = Math.min(1, max / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          res(cv.toDataURL('image/jpeg', .72));
        };
        img.src = URL.createObjectURL(f);
      });
      inp.click();
    });
  }

  /* ---------- exports ---------- */
  function download(filename, content, mime) {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }
  function csv(rows, filename) {
    const sep = ';';
    const body = rows.map(r => r.map(v => {
      let s = String(v ?? '');
      // Excel formula-injection guard: neutralize leading =,+,@ (and non-numeric -)
      if (/^[=+@]/.test(s) || (/^-/.test(s) && !/^-?\d+([.,]\d+)?$/.test(s))) s = "'" + s;
      if (/[";\n]/.test(s)) s = '"' + s.replaceAll('"', '""') + '"';
      return s;
    }).join(sep)).join('\r\n');
    download(filename, '﻿sep=;\r\n' + body, 'text/csv;charset=utf-8');
  }
  function printHTML(title, bodyHtml) {
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
    document.body.appendChild(f);
    f.srcdoc = `<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title>
      <style>
        body{font-family:Inter,Segoe UI,system-ui,sans-serif;color:#15161A;margin:36px;font-size:12.5px}
        h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em} .sub{color:#8A8F98;font-size:11px;margin-bottom:18px}
        table{width:100%;border-collapse:collapse;margin:10px 0 22px}
        th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#8A8F98;text-align:left;padding:7px 8px;border-bottom:1px solid #D9DBDF}
        td{padding:7px 8px;border-bottom:1px solid #ECEDEF;font-variant-numeric:tabular-nums}
        .neg{color:#C2483E;font-weight:600}.pos{color:#1E8E5A;font-weight:600}
        .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid #D9DBDF}
        .brand b{font-size:15px} h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8A8F98;margin:20px 0 4px}
        .kpis{display:flex;gap:32px;margin:14px 0}.kpis div b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
        .kpis div span{font-size:10px;color:#8A8F98;text-transform:uppercase;letter-spacing:.07em}
      </style></head><body>
      <div class="brand"><svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke-linecap="round"><line x1="4" y1="3" x2="4" y2="19" stroke="#15161A" stroke-width="2.4"/><line x1="10" y1="3" x2="10" y2="19" stroke="#15161A" stroke-width="2.4"/><line x1="16" y1="3" x2="16" y2="19" stroke="#15161A" stroke-width="2.4"/><line x1="22" y1="3" x2="22" y2="19" stroke="#15161A" stroke-width="2.4"/><line x1="1" y1="17" x2="26" y2="4" stroke="#D89A2B" stroke-width="2.6"/></svg>
      <div><b>${esc(Store.state.settings.barName || 'BarTally')}</b><div style="color:#8A8F98;font-size:11px">${esc(title)}</div></div></div>
      ${bodyHtml}</body></html>`;
    f.addEventListener('load', () => setTimeout(() => { f.contentWindow.print(); setTimeout(() => f.remove(), 2000); }, 150));
  }

  /* ---------- router / shell ---------- */
  function registerScreen(def) { screens[def.id] = def; }
  function go(id, params = {}) {
    if (!screens[id]) return console.error('no screen', id);
    current = id; currentParams = params;
    render();
    window.scrollTo({ top: 0 });
  }
  function refresh() { if (current) render(); }
  function render() {
    const root = document.getElementById('app');
    const def = screens[current];
    root.innerHTML = '';
    const wrap = el(`<div class="screen ${def.bare ? 'screen--bare' : ''}" data-screen="${def.id}"></div>`);
    root.appendChild(wrap);
    def.render(wrap, currentParams);
    if (!def.bare) renderTabs(root);
  }
  /* reference: text-only bar, 4 root destinations; pushed screens carry a back link instead */
  const TAB_ROOTS = ['dashboard', 'inventory', 'reports', 'settings'];
  function renderTabs(root) {
    if (!Store.isOwner) return;              // staff: single screen, no tab chrome
    if (!TAB_ROOTS.includes(current)) return; // pushed screens: no bar (per reference frame 02)
    const tabs = [['dashboard', 'tab.home'], ['inventory', 'tab.stock'], ['reports', 'tab.reports'], ['settings', 'set.title']];
    const bar = el(`<nav class="tabbar" aria-label="Navigation">${tabs.map(([id, key]) =>
      `<button class="tabbar__btn ${current === id ? 'is-on' : ''}" data-go="${id}"><span>${esc(t(key))}</span></button>`).join('')}</nav>`);
    bar.addEventListener('click', e => {
      const b = e.target.closest('[data-go]'); if (!b) return;
      haptic('light'); go(b.dataset.go);
    });
    root.appendChild(bar);
  }
  window.addEventListener('popstate', () => {
    if (suppressPop > 0) { suppressPop--; return; }
    if (sheetStack.length) { sheetStack[sheetStack.length - 1](true); }
  });

  /* header helper */
  function header(title, sub, actionsHtml) {
    return `<header class="apphead">
      <div class="apphead__titles"><h1 class="apphead__title">${esc(title)}</h1>${sub ? `<div class="apphead__sub">${esc(sub)}</div>` : ''}</div>
      ${actionsHtml || ''}</header>`;
  }

  return {
    esc, el, t, icon, art, logoMark, toast, sheet, confirm: confirmBox, numpad, ring,
    canScan, scan, pickImage, download, csv, printHTML,
    fmtQty, fmtDate, fmtTime, money, haptic,
    registerScreen, go, refresh, header,
    get current() { return current; }, get params() { return currentParams; },
  };
})();

/* notification body text for system notifications */
window.__notifText = (type, p) => {
  if (type === 'low') { const it = Store.item(p.itemId); return t('ntf.low', { item: it?.name || '?', qty: UI.fmtQty(p.qty), unit: t('u.' + (p.unit || 'bouteille')) }); }
  if (type === 'variance') return t('ntf.variance', { n: p.n, top: p.top });
  if (type === 'reminder') return t('ntf.countReminder', { date: p.date });
  return '';
};
